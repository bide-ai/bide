<svg xmlns="http://www.w3.org/2000/svg" width="320" height="40" viewBox="0 0 320 40">
  <g transform="translate(320,0) scale(-1,1)">
  <defs>
    <filter id="glow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="296" y2="0">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <g filter="url(#glow)">
    <line x1="8" y1="20" x2="296" y2="20" stroke="url(#fade)" stroke-width="3"/>
    <rect x="300" y="14" width="12" height="12" fill="#E8A33D"/>
  </g>
  </g>
</svg>
