<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Menlo, 'DejaVu Sans Mono', monospace">
  <rect width="1200" height="860" fill="#0E0E11"/>

  <!-- header -->
  <rect x="160" y="56" width="18" height="18" fill="#E8A33D"/>
  <text x="190" y="72" font-size="26" font-weight="700" fill="#E8A33D" letter-spacing="3">UNKNOWN OUTCOME</text>
  <text x="160" y="112" font-size="23" fill="#9A968E">the effect fired, but its result never reached the journal</text>

  <!-- rung 1 -->
  <g>
    <rect x="160" y="150" width="920" height="150" rx="16" fill="#17171C" stroke="#2A2A31" stroke-width="1.5"/>
    <rect x="160" y="150" width="7" height="150" rx="3" fill="#3A3A42"/>
    <rect x="196" y="205" width="44" height="44" fill="#E8A33D"/>
    <text x="218" y="236" font-size="28" font-weight="700" fill="#111114" text-anchor="middle">1</text>
    <text x="270" y="216" font-size="31" font-weight="700" fill="#F5F1E8">Retry-safe</text>
    <text x="270" y="252" font-size="20" fill="#9A968E">read-only, idempotent, or keyed</text>
    <line x1="736" y1="180" x2="736" y2="270" stroke="#2A2A31" stroke-width="1.5"/>
    <text x="762" y="232" font-size="20" fill="#CFCBC2">auto, provider dedupes</text>
  </g>
  <text x="218" y="330" font-size="19" fill="#6E6A62" text-anchor="middle">else</text>
  <path d="M212 338 l6 8 l6 -8" fill="none" stroke="#6E6A62" stroke-width="2"/>

  <!-- rung 2 -->
  <g>
    <rect x="160" y="355" width="920" height="150" rx="16" fill="#17171C" stroke="#2A2A31" stroke-width="1.5"/>
    <rect x="160" y="355" width="7" height="150" rx="3" fill="#3A3A42"/>
    <rect x="196" y="410" width="44" height="44" fill="#E8A33D"/>
    <text x="218" y="441" font-size="28" font-weight="700" fill="#111114" text-anchor="middle">2</text>
    <text x="270" y="421" font-size="31" font-weight="700" fill="#F5F1E8">Queryable record</text>
    <text x="270" y="457" font-size="20" fill="#9A968E">sent-message id, row, log line</text>
    <line x1="736" y1="385" x2="736" y2="475" stroke="#2A2A31" stroke-width="1.5"/>
    <text x="762" y="437" font-size="20" fill="#CFCBC2">auto, reconciler resolves</text>
  </g>
  <text x="218" y="535" font-size="19" fill="#6E6A62" text-anchor="middle">else</text>
  <path d="M212 543 l6 8 l6 -8" fill="none" stroke="#6E6A62" stroke-width="2"/>

  <!-- rung 3: the stop, emphasized -->
  <g>
    <rect x="160" y="560" width="920" height="150" rx="16" fill="#1C1710" stroke="#E8A33D" stroke-width="2"/>
    <rect x="160" y="560" width="7" height="150" rx="3" fill="#E8A33D"/>
    <rect x="196" y="615" width="44" height="44" fill="#E8A33D"/>
    <text x="218" y="646" font-size="28" font-weight="700" fill="#111114" text-anchor="middle">3</text>
    <text x="270" y="626" font-size="31" font-weight="700" fill="#F5F1E8">Genuinely unknowable</text>
    <text x="270" y="662" font-size="20" fill="#9A968E">nothing can establish the truth</text>
    <line x1="736" y1="590" x2="736" y2="680" stroke="#5A4A28" stroke-width="1.5"/>
    <text x="762" y="637" font-size="20" font-weight="700" fill="#E8A33D">HALT, wait for a human</text>
  </g>

  <!-- footer principle -->
  <line x1="160" y1="752" x2="1080" y2="752" stroke="#2A2A31" stroke-width="1.5"/>
  <text x="160" y="792" font-size="25" font-weight="700" fill="#F5F1E8">Under ultimate ambiguity, it stops.</text>
  <text x="160" y="824" font-size="20" fill="#9A968E">A pause a human or reconciler can clear beats a double-fire you cannot undo.</text>
</svg>
