<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bide edit</title><link rel="icon" href="data:,">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/graph.css"><link rel="stylesheet" href="/assets/extras.css"><link rel="stylesheet" href="/assets/editor.css">
<script type="module" src="/assets/editor.js"></script>
</head>
<body>{{.Sprite}}
<header class="top"><span class="brand">bide edit</span><span class="ro" id="state-tag">saved</span><span class="grow"></span><span class="muted small" id="file"></span><button type="button" class="btn" id="undo" disabled>Undo</button><button type="button" class="btn" id="redo" disabled>Redo</button><button type="button" class="btn" id="revert" disabled>Revert</button><button type="button" class="btn primary" id="save" disabled>Save&hellip;</button><button type="button" class="btn" id="theme" aria-label="Switch between light and dark">Theme</button></header>
<main>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p class="bad">bide edit needs script: the page draws what the server computes.</p></noscript>
<div id="weakened"></div>
<div id="verdict"></div>
<p class="muted small" id="modeline"></p>
<p class="muted small" id="baseline"></p>
<div class="editor">
  <section aria-labelledby="h-canvas" class="pane canvas"><h2 id="h-canvas">Flow</h2><div class="graphwrap" id="canvas"></div></section>
  <section aria-labelledby="h-outline" class="pane outline"><h2 id="h-outline">Outline</h2><ol id="outline" class="outlist"></ol><h3>Wiring</h3><ul id="wiring" class="wirelist"></ul></section>
  <section aria-labelledby="h-inspector" class="pane inspector"><h2 id="h-inspector">Inspector</h2><div id="inspector"></div></section>
</div>
<section aria-labelledby="h-assert"><h2 id="h-assert">Assertions</h2><p class="muted small">Checked by <code>bide check</code> and in CI, not at run time.</p><div id="assertions"></div></section>
<section aria-labelledby="h-problems"><h2 id="h-problems">Problems</h2><div id="problems"></div></section>
<section aria-labelledby="h-source"><h2 id="h-source">Source</h2><p class="muted small">Edit the file here; the page checks it as you type. Nothing is written until you save.</p><textarea id="source" class="source" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Config source" rows="24"></textarea></section>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-form"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions" id="dialog-actions"></div></div></dialog>
</main>
</body></html>
