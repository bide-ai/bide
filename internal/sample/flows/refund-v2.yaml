# yaml-language-server: $schema=https://raw.githubusercontent.com/bide-ai/bide/main/plan/schema/flow.schema.json
# The refund flow after a change that lowers review's gate from 2 of 3 approvers to 1 of 3, and
# drops the assertion that guarded it. bide check passes this file; the diff against refund-v1.yaml
# is what calls out the weakened approval policy:
#   bide check flows/refund-v2.yaml -diff flows/refund-v1.yaml -check -fail-on-weaken
version: 1
flow: refund
entry: validate
nodes:
  - {name: validate, block: validate, safety: readonly}
  - {name: lookup, block: lookup}
  - {name: review, block: review, safety: readonly, approval: {need: 1, approvers: [ops, finance, risk]}}
  - {name: charge, block: charge, safety: side_effect}
  - {name: credit, block: credit, safety: idempotent}
  - {name: receipt, block: receipt, safety: idempotent}
wiring:
  - edge: [validate, lookup]
  - switch: lookup
    when: [{pred: large, to: review}]
    else: credit
  - edge: [review, charge]
  - edge: [charge, receipt]
assert:
  - no side effect after charge
  - every path to a terminal passes validate
  - credit reachable
