# Release config for bide. Builds the bide command (cmd/bide: demo, view,
# check, audit) cross-platform and publishes a GitHub Release from the pushed
# tag. The library itself is consumed via `go get`; these binaries are for
# everyone else, auditors included, without a Go toolchain. cmd/bide is its own
# module; at the root tag its replace directives point at the tagged tree, so
# the binary is built from exactly the source the tag names.
#
# bide-hsm (cmd/bide/bide-hsm: bide approve for keys in an HSM or a KMS) is not built here. It needs
# cgo, because the PKCS#11 library is loaded at run time, and a cgo binary is only as reproducible
# as the C toolchain that built it, which a release for three operating systems and two
# architectures does not pin. It is installed from source (CGO_ENABLED=1 go install
# github.com/bide-ai/bide/cmd/bide/bide-hsm@vX.Y.Z, verified by the Go checksum database), and
# scripts/release.sh installs and runs it from the module proxy at every release. Keeping it out of
# this file leaves bide pure Go (CGO_ENABLED=0 above) and scripts/repro.sh unchanged.
version: 2

project_name: bide

before:
  hooks:
    - go -C cmd/bide mod download

builds:
  - id: bide
    dir: cmd/bide
    main: .
    binary: bide
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    # Reproducible: no build paths (-trimpath), no VCS stamp that an untracked dist/ would mark
    # modified (-buildvcs=false), and file times from the commit. scripts/repro.sh rebuilds each
    # binary from the tag with these flags and compares the bytes; its --self-test holds this file
    # to the same flags.
    flags:
      - -trimpath
      - -buildvcs=false
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # -X main.version stamps the exact release tag into `bide version`; without it the CLI
      # falls back to the module version the go command records (see internal/auditcli/exit.go).
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: bide
    ids:
      - bide
    name_template: "bide_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

# SBOM: one SPDX JSON document per archive, generated by syft (the release workflow installs it),
# named <archive>.sbom.json and listed in checksums.txt.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

# Signing and publishing are not done here. The release builder (github.com/bide-ai/release-builder,
# called by .github/workflows/release.yml) runs goreleaser with --skip=publish,sign, attests the
# archives, their SBOMs and checksums.txt with SLSA Build L3 provenance, and release.yml verifies that
# provenance, signs checksums.txt, each archive and each SBOM keylessly with cosign (a Sigstore bundle
# named <file>.sigstore.json each) and publishes the release. docs/trust/verify-releases.md has the
# verification commands.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Only the repository the changelog is read from (changelog.use: github) comes from this block, because
# goreleaser does not publish here. release.yml creates the release itself: the title "bide <tag>",
# the notes (docs/releases/<tag>.md, else the changelog goreleaser writes to dist/CHANGELOG.md) and the
# prerelease mark for a tag with a hyphen.
release:
  github:
    owner: bide-ai
    name: bide
  draft: false
  prerelease: auto
  name_template: "bide {{ .Tag }}"

# Homebrew: the bide formula in bide-ai/homebrew-tap is generated by
# scripts/brew-formula.sh from this release's checksums.txt and pushed by the
# release workflow. goreleaser's `brews` (formula) key is deprecated in favor of
# `homebrew_casks`, and casks are macOS-only, which would drop Linux brew.
