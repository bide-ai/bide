# Release config for bide. Builds the bide-audit verifier CLI cross-platform
# and publishes a GitHub Release from the pushed tag. The library itself is
# consumed via `go get`; these binaries are for auditors who verify proof
# bundles without a Go toolchain.
version: 2

project_name: bide

before:
  hooks:
    - go mod download

builds:
  - id: bide-audit
    main: ./cmd/bide-audit
    binary: bide-audit
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: bide-audit
    ids:
      - bide-audit
    name_template: "bide-audit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: bide-ai
    name: bide
  draft: false
  prerelease: auto
  name_template: "bide {{ .Tag }}"

brews:
  - name: bide-audit
    ids:
      - bide-audit
    repository:
      owner: bide-ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://bide-ai.com"
    description: "Offline verifier for bide proof bundles (RFC 6962 Merkle audit trails)"
    license: "Apache-2.0"
    # Skip the push (but still generate the formula) when no tap token is set,
    # so a release never fails just because the secret is absent.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    install: |
      bin.install "bide-audit"
    test: |
      assert_match "verify", shell_output("#{bin}/bide-audit 2>&1 || true")
