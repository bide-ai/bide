# Release config for bide. Builds the bide command (cmd/bide: demo, view,
# check, audit) cross-platform and publishes a GitHub Release from the pushed
# tag. The library itself is consumed via `go get`; these binaries are for
# everyone else, auditors included, without a Go toolchain. cmd/bide is its own
# module; at the root tag its replace directives point at the tagged tree, so
# the binary is built from exactly the source the tag names.
version: 2

project_name: bide

before:
  hooks:
    - go -C cmd/bide mod download

builds:
  - id: bide
    dir: cmd/bide
    main: .
    binary: bide
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    # Reproducible: no build paths (-trimpath), no VCS stamp that an untracked dist/ would mark
    # modified (-buildvcs=false), and file times from the commit. scripts/repro.sh rebuilds each
    # binary from the tag with these flags and compares the bytes; its --self-test holds this file
    # to the same flags.
    flags:
      - -trimpath
      - -buildvcs=false
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # -X main.version stamps the exact release tag into `bide version`; without it the CLI
      # falls back to the module version the go command records (see internal/auditcli/exit.go).
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: bide
    ids:
      - bide
    name_template: "bide_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

# SBOM: one SPDX JSON document per archive, generated by syft (the release workflow installs it),
# named <archive>.sbom.json and listed in checksums.txt.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

# Keyless signatures: cosign signs with the release workflow's GitHub OIDC identity (no key to
# keep), and each signature is a Sigstore bundle (signature, Fulcio certificate and Rekor entry)
# named <file>.sigstore.json. `checksum` signs checksums.txt, which lists every archive and SBOM, so
# one verification covers them all; `archive` signs each archive on its own. docs/trust/verify-releases.md
# has the verification commands. The release workflow skips this in its snapshot dry run, so a dry
# run writes nothing to the public transparency log.
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true
  - id: archive
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: bide-ai
    name: bide
  draft: false
  prerelease: auto
  name_template: "bide {{ .Tag }}"

# Homebrew: the bide formula in bide-ai/homebrew-tap is generated by
# scripts/brew-formula.sh from this release's checksums.txt and pushed by the
# release workflow. goreleaser's `brews` (formula) key is deprecated in favor of
# `homebrew_casks`, and casks are macOS-only, which would drop Linux brew.
