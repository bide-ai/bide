name: Models

# TLA+ models of the coordination protocols (spec/tla/README.md). On main: the PlusCal translation
# check, the checker self-test, and every "ci", "regress", "finding" and "limit" configuration of
# every model. On a pull request and in the merge queue: the same, for the models whose directory
# under spec/tla the pull request (or the batch) changes, and the models whose configurations name a changed one in a
# LIBRARY line (all of them when it changes check.sh, tools.lock, shards.sh or this file).
# Nightly (and on demand): the "nightly" configurations, with larger bounds and the liveness checks
# at the larger fault budget (the caps model's in parallel jobs, models-nightly-caps); and, in a job of its own beside it, the Apalache checks (symbolic and
# inductive, spec/tla/README.md "Apalache"), which no pull request runs.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only these nightly jobs: all, tlc or apalache'
        required: false
        default: all
        type: choice
        options: [all, tlc, apalache]

permissions:
  contents: read

# A new push to a pull request cancels the superseded run; main, the merge queue and the nightly never cancel.
concurrency:
  group: models-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The pull-request set runs in parallel shards, one job each, by configuration directory: a model's
# directory, or its regress, findings or limits directory (check.sh's TLC_DIRS). Balanced by the
# measured TLC times; the plan job fails unless every ci, regress, finding and limit configuration
# is in exactly one shard (.github/scripts/shards.sh check-models), so a new model, configuration
# directory or finding must be assigned here before it merges.
env:
  MODEL_SHARDS: |
    claims: claims
    claims-regress: claims/regress claims/limits spend spend/regress probes probes/regress stop stop/regress
    lifecycle: lifecycle lifecycle/regress lifecycle/findings lifecycle/limits
    delegation: delegation delegation/regress delegation/limits
    toolcall-flows: toolcall toolcall/regress toolcall/limits flows flows/regress
    protocol-sessions: protocol protocol/regress protocol/limits sessions sessions/regress sessions/limits
    notify: notify
    notify-live: notify/ci-live
    notify-regress: notify/regress notify/limits
    identity: identity identity/limits
    identity-regress: identity/regress
    caps: caps caps/regress caps/findings

# The caps (model 17) nightly configurations, one per shard line "name: config config ...", each shard
# its own job of models-nightly-caps (the largest takes about an hour at one TLC worker, so they run
# in parallel instead of one after another in models-nightly, which skips the caps model). Every
# nightly configuration of caps must be in exactly one shard: the job fails first otherwise.
  CAPS_NIGHTLY: |
    mixed: caps/deep-mixed-three.cfg
    crash: caps/deep-marked-crash-three.cfg
    cancel: caps/deep-marked-cancel-three.cfg
    reconcile: caps/deep-marked-reconcile-three.cfg caps/deep-marked-reinvoke-three.cfg
    rest: caps/deep-limit-three.cfg caps/deep-race-three.cfg caps/deep-race-stale-three.cfg caps/deep-same-crash1-three.cfg caps/deep-same-crash2-three.cfg caps/deep-window-crash2.cfg caps/deep-window-marked.cfg caps/deep-window-three.cfg

jobs:
  plan:
    name: Models (plan)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the full-ci label check
    outputs:
      run: ${{ steps.shards.outputs.run }}
      models: ${{ steps.changes.outputs.models }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # TLC reads only the model's own directory under spec/tla, the tools and check.sh, so a pull
      # request, and a merge queue batch (against the queue's base), checks the models whose
      # directory it changes (all of them when it changes check.sh,
      # tools.lock, shards.sh or this file) and no others: a change to the Go code a model describes
      # must change the model or carry a Protocol-Impact override (modelsync, in the Lint job), so
      # its model runs whenever its rules change. Pushes to main and the nightly always run every
      # model, and so does any doubt: a failed diff or an unexpected event. This job failing fails
      # the Models check.
      - id: changes
        name: Which models changed?
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          run=true
          models=
          # The full-ci label (read now, so a re-run sees it) checks every model.
          full=false
          if [ "$EVENT" = pull_request ] && labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.labels[].name] | join(",")'); then
            case ",$labels," in *,full-ci,*) full=true ;; esac
          fi
          if [ "$EVENT" != push ] && [ "$full" = false ] && files=$(git diff --name-only "$BASE" "$HEAD") && [ -n "$files" ]; then
            echo "Changed files:"; echo "$files"
            if ! echo "$files" | grep -qE '^(spec/tla/check\.sh|spec/tla/tools\.lock|\.github/workflows/models\.yml|\.github/scripts/shards\.sh)$'; then
              models=$(echo "$files" | sed -n 's|^spec/tla/\([^/]*\)/.*|\1|p' | sort -u | while read -r m; do
                [ -d "spec/tla/$m" ] && echo "$m"; done | tr '\n' ' ' | sed 's/ $//')
              # A model whose configurations name a changed model in a LIBRARY line (model 14's
              # composition with model 10) reads that model's modules, so it is checked too.
              # shellcheck disable=SC2086 # models is a list
              [ -z "$models" ] || models="$models $(.github/scripts/model-libraries.sh $models)"
              models=$(echo $models | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/ $//')
              if [ -z "$models" ]; then
                run=false
                echo "No model changed (spec/tla/<model>/, check.sh, tools.lock, shards.sh, models.yml): the models are not re-checked."
              else
                echo "Models changed: $models (a push to main and the nightly check every model)"
              fi
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
          echo "models=$models" | tee -a "$GITHUB_OUTPUT"
      # Go only for shards.sh's self-test, whose package cases run go list in a scratch module.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: Every configuration is in exactly one shard
        run: |
          .github/scripts/shards.sh --self-test
          .github/scripts/model-libraries.sh --self-test
          SHARDS="$MODEL_SHARDS" .github/scripts/shards.sh check-models .
      # The shards holding a changed model (every shard when no model is named).
      - id: shards
        name: Shards to run
        shell: bash
        env:
          RUN: ${{ steps.changes.outputs.run }}
          MODELS: ${{ steps.changes.outputs.models }}
        # Fails, failing the Models check, when a changed directory under spec/tla is no model with
        # a ci configuration, or no shard holds a changed model; it never turns a failure into run=false.
        run: |
          set -euo pipefail
          shards='[]'
          if [ "$RUN" != false ]; then
            # shellcheck disable=SC2086 # MODELS is a list
            shards=$(SHARDS="$MODEL_SHARDS" .github/scripts/shards.sh select . $MODELS)
          fi
          echo "run=$RUN" | tee -a "$GITHUB_OUTPUT"
          echo "shards=$shards" | tee -a "$GITHUB_OUTPUT"

  shard:
    name: Models (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      # Each shard runs the self-test and the translation check (seconds) as well as its configs.
      - name: Checker self-test (a stale translation and a wrong jar checksum both fail)
        run: spec/tla/check.sh self-test
      # Four configurations at a time, one TLC worker and a 2 GB heap each (the runner has 4 vCPUs
      # and 16 GB); TLC_MODELS empty means every model, and TLC_DIRS is the shard's directories.
      - name: Translation check, then the shard's ci, regress, finding and limit configurations
        shell: bash
        env:
          TLC_JOBS: '4'
          TLC_MODELS: ${{ needs.plan.outputs.models }}
          SHARD: ${{ matrix.shard }}
        run: |
          TLC_DIRS=$(SHARDS="$MODEL_SHARDS" .github/scripts/shards.sh get "$SHARD")
          echo "Shard $SHARD: $TLC_DIRS"
          TLC_DIRS="$TLC_DIRS" spec/tla/check.sh

  # The required check. It always reports, on every event but the schedule: success when the plan
  # job succeeded and either no model needed checking or every shard succeeded; a failed,
  # cancelled or skipped shard, or a failed plan, fails it.
  models:
    name: Models
    needs: [plan, shard]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Every shard passed
        run: .github/scripts/shards.sh verdict "${{ needs.plan.result }}" "${{ needs.plan.outputs.run }}" "shards=${{ needs.shard.result }}"

  models-nightly:
    name: Models (nightly)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.only != 'apalache')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      # Every model but caps, whose nightly configurations run in models-nightly-caps.
      - name: Nightly configurations
        run: |
          models=$(for d in spec/tla/*/; do m=$(basename "$d"); if [ "$m" != caps ] && ls "$d"*MC.tla >/dev/null 2>&1; then echo "$m"; fi; done | tr '\n' ' ')
          TLC_MODELS="$models" spec/tla/check.sh nightly

  models-nightly-caps:
    name: Models (nightly, caps ${{ matrix.shard }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.only != 'apalache')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [mixed, crash, cancel, reconcile, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      - name: Every caps nightly configuration is in exactly one shard
        run: |
          want=$(TLC_MODELS=caps spec/tla/check.sh list nightly | sort)
          have=$(echo "$CAPS_NIGHTLY" | sed -n 's/^ *[A-Za-z0-9_-]*: *//p' | tr ' ' '\n' | grep . | sort)
          if [ "$want" != "$have" ]; then
            echo "::error::CAPS_NIGHTLY (models.yml) does not list each caps nightly configuration exactly once"
            diff <(echo "$want") <(echo "$have") || true
            exit 1
          fi
      - name: Nightly configurations of the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cfgs=$(echo "$CAPS_NIGHTLY" | sed -n "s/^ *$SHARD: *//p")
          [ -n "$cfgs" ] || { echo "::error::no shard $SHARD"; exit 1; }
          paths=()
          for c in $cfgs; do paths+=("spec/tla/$c"); done
          spec/tla/check.sh run "${paths[@]}"

  # One job per Apalache configuration (spec/tla/*/apalache/*.cfg, and the TLC cross-checks in
  # spec/tla/*/apalache/tlc/), in parallel: the largest
  # check takes hours, and a job is capped at 6. The resolver scope's induction step is split by
  # FullNext's disjuncts into four configurations for this reason.
  apalache-list:
    name: Apalache configurations
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.only != 'tlc')
    runs-on: ubuntu-latest
    outputs:
      cfgs: ${{ steps.list.outputs.cfgs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "cfgs=$(ls spec/tla/*/apalache/*.cfg spec/tla/*/apalache/tlc/*.cfg | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  apalache-nightly:
    name: Apalache (nightly)
    needs: apalache-list
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.only != 'tlc')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.apalache-list.outputs.cfgs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # The TLA+ tools and the Apalache archive (about 190 MB) are cached apart, so the pull-request
      # job never restores the archive.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bide-apalache
          key: apalache-${{ hashFiles('spec/tla/tools.lock') }}
      - name: Apalache checks of ${{ matrix.cfg }}
        run: BIDE_APALACHE_CACHE="$HOME/.cache/bide-apalache" spec/tla/check.sh apalache "${{ matrix.cfg }}"
