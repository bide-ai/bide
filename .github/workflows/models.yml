name: Models

# TLA+ models of the coordination protocols (spec/tla/README.md). On a pull request that touches the
# models or the code they describe, in the merge queue, and on main: the PlusCal translation check,
# the checker self-test, and every "ci", "regress" and "finding" configuration. Nightly (and on demand): the "nightly" configurations, with larger
# bounds and the liveness checks at the larger fault budget.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    name: Models
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gated per step, not per job, so the job always reports as "Models" (a required check).
      # A pull request runs the models only when it touches them or the Go code they describe
      # (the model-code maps in spec/tla/README.md: agent/, store/, plan/, internal/journalhook/,
      # internal/toolhook/, and middleware/ for the tool-call model).
      # merge_group and pushes to main always run in full, and so does any doubt: a failed diff,
      # an unexpected event, or this step failing.
      - id: changes
        name: Did the models or the code they describe change?
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ] && files=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "Changed files:"; echo "$files"
            modelled=$(echo "$files" | grep -E '^(spec/tla/|agent/|store/|plan/|internal/journalhook/|internal/toolhook/|middleware/|\.github/workflows/models\.yml$)' || true)
            if [ -n "$files" ] && [ -z "$modelled" ]; then
              run=false
              echo "No modelled code changed (spec/tla, agent, store, plan, internal/journalhook, internal/toolhook, middleware, models.yml): the models are not re-checked."
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run != 'false'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        if: steps.changes.outputs.run != 'false'
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      - name: Checker self-test (a stale translation and a wrong jar checksum both fail)
        if: steps.changes.outputs.run != 'false'
        run: spec/tla/check.sh self-test
      - name: Translation check, then the ci, regress, finding and limit configurations
        if: steps.changes.outputs.run != 'false'
        env:
          TLC_JOBS: '4'
        run: spec/tla/check.sh

  models-nightly:
    name: Models (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      - name: Nightly configurations
        run: spec/tla/check.sh nightly
