name: Models

# TLA+ models of the coordination protocols (spec/tla/README.md). On a pull request and in the
# merge queue: the PlusCal translation check, the checker self-test, and every "ci", "regress" and
# "finding" configuration. Nightly (and on demand): the "nightly" configurations, with larger
# bounds and the liveness checks at the larger fault budget.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    name: Models
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      - name: Checker self-test (a stale translation and a wrong jar checksum both fail)
        run: spec/tla/check.sh self-test
      - name: Translation check, then the ci, regress and finding configurations
        run: spec/tla/check.sh

  models-nightly:
    name: Models (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bide-tla
          key: tla-tools-${{ hashFiles('spec/tla/tools.lock') }}
      - name: Nightly configurations
        run: spec/tla/check.sh nightly
