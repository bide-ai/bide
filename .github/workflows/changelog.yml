name: Changelog

# A pull request that changes code a published module ships adds a changelog fragment
# (changes/unreleased/<slug>.md, see CONTRIBUTING.md). The no-changelog label is only for a pull
# request that changes no such code, and the check fails a labelled pull request that does. Stray
# files (scratch *.work files, go.mod or go.sum of a module whose Go code the pull request leaves
# alone) fail any pull request except Dependabot's and one with the dependencies label. What counts
# as code is defined in internal/tools/changelog (documentation, tests, CI, examples, scripts and
# the repository's tools do not). The check runs again when a label is added or removed. In the
# merge queue it passes: the pull request was checked before it was queued.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels the superseded run; main, the merge queue and the nightly never cancel.
concurrency:
  group: changelog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changelog:
    name: Changelog fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: Fragments are well formed
        run: go run ./internal/tools/changelog lint
      - name: A change to published code adds a fragment
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: go run ./internal/tools/changelog check -base "$BASE" -head "$HEAD" -labels "$LABELS" -author "$AUTHOR"
