name: Release

# Pushing a v* tag builds the bide binaries and publishes a GitHub
# Release with generated notes, an SBOM per archive (syft) and one for the published module set
# (scripts/module-sbom.sh), and a keyless cosign signature for checksums.txt, each archive and each
# SBOM (GitHub OIDC; docs/trust/verify-releases.md). Run manually
# (workflow_dispatch) to dry-run the whole pipeline in snapshot mode without tagging or publishing
# anything; the dry run builds the SBOMs but skips signing, so it writes nothing to the public
# transparency log. Every archive, SBOM, checksums.txt, approve-page.SHA256SUMS and the module
# set SBOM also gets a SLSA v1 build provenance attestation (actions/attest-build-provenance, stored
# by GitHub and verified with `gh attestation verify`; docs/trust/verify-releases.md). The manual
# run's `attest` input rehearses that on the snapshot build, which does write to the public
# transparency log.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      attest:
        description: 'Rehearse build provenance: attest and verify the snapshot artifacts (writes to the public transparency log)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token mints the OIDC token cosign and the provenance attestations are signed with
      # (keyless: no signing key is stored); attestations stores the provenance attestations.
      id-token: write
      attestations: write
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # The exact Go release the binaries are built with (bump it on purpose): it is recorded in
          # each binary, and scripts/repro.sh rebuilds with the version it reads there.
          # GOTOOLCHAIN=local keeps the go command from switching to another toolchain.
          go-version: '1.27.2'
      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Validate config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Resolve release notes
        id: notes
        run: |
          arg=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            arg="--release-notes=docs/releases/${GITHUB_REF_NAME}.md"
          fi
          echo "arg=${arg}" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot --skip=sign' || '' }} ${{ steps.notes.outputs.arg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The approve page's SHA256SUMS (approvals/cmd/approvepage), published and signed with every
      # release. Subresource Integrity in the page's index.html pins its script and stylesheet, but no
      # browser mechanism pins the entry document itself, so an organization that hosts the page checks
      # every file it serves against these sums (docs/trust/verify-releases.md). The bundle is built
      # from the tag, its own SHA256SUMS is checked, and on a tag push the file is signed keylessly like
      # checksums.txt and attached to the release. The manual dry run builds and checks it only.
      - name: Approve page SHA256SUMS
        run: |
          set -euo pipefail
          go run ./approvals/cmd/approvepage -out approve-page
          (cd approve-page && sha256sum --check --strict SHA256SUMS)
          cp approve-page/SHA256SUMS approve-page.SHA256SUMS
          cat approve-page.SHA256SUMS
      # SLSA v1 build provenance for what the release publishes, made by GitHub's attest action from
      # this job's OIDC identity: which workflow, ref and commit built each file, on which runner. It
      # is stored by GitHub (not attached to the release) and checked right away and again from the
      # published release (verify-signatures). A tag push always attests; a manual run does so only
      # when asked, with the snapshot artifacts.
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/bide_*.tar.gz
            dist/bide_*.tar.gz.sbom.json
            dist/checksums.txt
            approve-page.SHA256SUMS
      - name: Verify the attestations just made
        if: github.event_name == 'push' || inputs.attest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Six archives and six archive SBOMs (three systems, two architectures): fewer means the
          # globs above attested less than the release publishes.
          set -- dist/bide_*.tar.gz; [ $# -eq 6 ] || { echo "want 6 archives, got $#: $*"; exit 1; }
          set -- dist/bide_*.tar.gz.sbom.json; [ $# -eq 6 ] || { echo "want 6 archive SBOMs, got $#: $*"; exit 1; }
          scripts/verify-provenance.sh --ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" "${GITHUB_REF_NAME}" \
            dist/bide_*.tar.gz dist/bide_*.tar.gz.sbom.json dist/checksums.txt approve-page.SHA256SUMS
      - name: Publish the approve page SHA256SUMS
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle=approve-page.SHA256SUMS.sigstore.json approve-page.SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" approve-page.SHA256SUMS approve-page.SHA256SUMS.sigstore.json --clobber
      # The bide formula in bide-ai/homebrew-tap, generated from this release's checksums
      # (scripts/brew-formula.sh): a formula, not a cask, so Linux keeps Homebrew. It replaces the
      # bide-audit formula and records the rename, so brew upgrade moves bide-audit users to bide.
      # The formula is always attached to the GitHub Release as bide.rb. With HOMEBREW_TAP_TOKEN (a
      # token that can push to the tap) it is also pushed; without one the maintainer copies bide.rb
      # into the tap by hand (CONTRIBUTING.md, "Releasing").
      - name: Homebrew formula
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          scripts/brew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > bide.rb
          cat bide.rb
          gh release upload "$GITHUB_REF_NAME" bide.rb --clobber
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::bide.rb is attached to the $GITHUB_REF_NAME release; HOMEBREW_TAP_TOKEN is not set, so update bide-ai/homebrew-tap by hand (CONTRIBUTING.md)"
            exit 0
          fi
          git clone --quiet "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bide-ai/homebrew-tap" tap
          cp bide.rb tap/Formula/bide.rb
          git -C tap rm --quiet --ignore-unmatch Formula/bide-audit.rb
          printf '{\n  "bide-audit": "bide"\n}\n' > tap/formula_renames.json
          git -C tap add Formula/bide.rb formula_renames.json
          git -C tap -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -s -m "bide ${GITHUB_REF_NAME}"
          git -C tap push --quiet

  # The SBOM of the published Go module set: what an application gets with `go get`, beside the
  # per-archive SBOMs of the binary (scripts/module-sbom.sh resolves the release's consumer module
  # through the public proxy and lists it with syft). The nested module tags follow the root tag by
  # minutes (scripts/release.sh; the proxy can take an hour or more to serve a tag it was asked about
  # too early), so it waits up to four hours for the proxy to serve them all, asking it sparingly
  # (scripts/proxy-wait.sh), then signs the SBOM like checksums.txt and attaches it. The manual dry run generates it for the latest release and
  # neither signs nor uploads it.
  module-sbom:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "file=bide_${v#v}_modules.sbom.json" >> "$GITHUB_OUTPUT"
      - name: Module SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.version.outputs.file }}
        run: |
          scripts/module-sbom.sh "$VERSION" "$FILE" --wait 240
          jq -r '.packages[] | "\(.name) \(.versionInfo)"' "$FILE" | sort | head -n 40
      - name: Sign and attach the module SBOM
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.version.outputs.file }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle="$FILE.sigstore.json" "$FILE"
          gh release upload "$GITHUB_REF_NAME" "$FILE" "$FILE.sigstore.json" --clobber
      - name: Attest build provenance of the module SBOM
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.version.outputs.file }}

  # Verify what was just published, as a user would (docs/trust/verify-releases.md): the signature
  # of checksums.txt, of every archive and of every per-archive SBOM against the identity of this
  # workflow, and every archive and SBOM against checksums.txt. A release whose signatures do not
  # verify fails here, and so does a file without valid build provenance (scripts/verify-provenance.sh). It needs only goreleaser, so the archives are verified even when the module
  # set SBOM is late or missing; verify-module-sbom checks that one as a job of its own.
  verify-signatures:
    if: github.event_name == 'push'
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p 'bide_*' -p 'checksums.txt*' -p 'approve-page.SHA256SUMS*' -D rel
      - name: Verify signatures and checksums
        run: |
          set -euo pipefail
          cd rel
          id="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          issuer="https://token.actions.githubusercontent.com"
          for f in checksums.txt approve-page.SHA256SUMS bide_*.tar.gz bide_*.tar.gz.sbom.json; do
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$id" --certificate-oidc-issuer "$issuer" "$f"
          done
          sha256sum --check --strict checksums.txt
          ls bide_*.sbom.json >/dev/null
      # Build provenance, from the published files and the attestations GitHub stores: made by this
      # workflow at this tag and commit, on a GitHub-hosted runner, for every archive, every
      # archive SBOM, checksums.txt and the approve page sums.
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -- rel/bide_*.tar.gz; [ $# -eq 6 ] || { echo "want 6 archives, got $#: $*"; exit 1; }
          set -- rel/bide_*.tar.gz.sbom.json; [ $# -eq 6 ] || { echo "want 6 archive SBOMs, got $#: $*"; exit 1; }
          scripts/verify-provenance.sh --source-digest "$GITHUB_SHA" "${GITHUB_REF_NAME}" \
            rel/bide_*.tar.gz rel/bide_*.tar.gz.sbom.json rel/checksums.txt rel/approve-page.SHA256SUMS

  # Verify the module set SBOM as a user would: it is on the release, its signature verifies against
  # this workflow's identity for the tag, and it lists the published bide modules at the release's
  # version. A missing or unsigned module SBOM is this job failing, on its own.
  verify-module-sbom:
    if: github.event_name == 'push'
    needs: module-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download the module set SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p 'bide_*_modules.sbom.json*' -D rel
      - name: Verify its signature and contents
        run: |
          set -euo pipefail
          want=$(( $(scripts/release.sh --list-published | wc -l) + 1 ))
          cd rel
          f="bide_${GITHUB_REF_NAME#v}_modules.sbom.json"
          cosign verify-blob --bundle "$f.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$f"
          n=$(jq --arg v "${GITHUB_REF_NAME}" '[.packages[] | select((.name == "github.com/bide-ai/bide" or (.name | startswith("github.com/bide-ai/bide/"))) and .versionInfo == $v)] | length' "$f")
          echo "$f: $n bide modules at ${GITHUB_REF_NAME}, want $want (the core and every published module)"
          [ "$n" -eq "$want" ]
      - name: Verify its build provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/verify-provenance.sh --source-digest "$GITHUB_SHA" "${GITHUB_REF_NAME}" "rel/bide_${GITHUB_REF_NAME#v}_modules.sbom.json"

  # Rebuild every published binary from the tag on another OS and compare the bytes, so the claim
  # that anyone can reproduce the release is checked on every release (scripts/repro.sh).
  repro:
    if: github.event_name == 'push'
    needs: goreleaser
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Rebuild and compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/repro.sh "${GITHUB_REF_NAME}"
      # The approve page bundle is deterministic: rebuilt from the tag on another OS, its SHA256SUMS
      # must equal the published one byte for byte, and the files must match it.
      - name: Rebuild the approve page and compare its sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: 'off'
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p approve-page.SHA256SUMS -D published
          go run ./approvals/cmd/approvepage -out approve-page
          cmp approve-page/SHA256SUMS published/approve-page.SHA256SUMS
          (cd approve-page && shasum -a 256 --check --strict SHA256SUMS)
