name: Release

# Pushing a v* tag builds the bide-audit binaries and publishes a GitHub
# Release with generated notes. Run manually (workflow_dispatch) to dry-run the
# whole pipeline in snapshot mode without tagging or publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Validate config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Resolve release notes
        id: notes
        run: |
          arg=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            arg="--release-notes=docs/releases/${GITHUB_REF_NAME}.md"
          fi
          echo "arg=${arg}" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }} ${{ steps.notes.outputs.arg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
