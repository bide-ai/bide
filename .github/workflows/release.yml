name: Release

# Pushing a v* tag builds the bide binaries and publishes a GitHub
# Release with generated notes. Run manually (workflow_dispatch) to dry-run the
# whole pipeline in snapshot mode without tagging or publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # The exact Go release the binaries are built with (bump it on purpose): it is recorded in
          # each binary, and scripts/repro.sh rebuilds with the version it reads there.
          # GOTOOLCHAIN=local keeps the go command from switching to another toolchain.
          go-version: '1.27.2'
      - name: Pin the toolchain
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Validate config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Resolve release notes
        id: notes
        run: |
          arg=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            arg="--release-notes=docs/releases/${GITHUB_REF_NAME}.md"
          fi
          echo "arg=${arg}" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }} ${{ steps.notes.outputs.arg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The bide formula in bide-ai/homebrew-tap, generated from this release's checksums
      # (scripts/brew-formula.sh): a formula, not a cask, so Linux keeps Homebrew. It replaces the
      # bide-audit formula and records the rename, so brew upgrade moves bide-audit users to bide.
      # The formula is always attached to the GitHub Release as bide.rb. With HOMEBREW_TAP_TOKEN (a
      # token that can push to the tap) it is also pushed; without one the maintainer copies bide.rb
      # into the tap by hand (CONTRIBUTING.md, "Releasing").
      - name: Homebrew formula
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          scripts/brew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > bide.rb
          cat bide.rb
          gh release upload "$GITHUB_REF_NAME" bide.rb --clobber
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::bide.rb is attached to the $GITHUB_REF_NAME release; HOMEBREW_TAP_TOKEN is not set, so update bide-ai/homebrew-tap by hand (CONTRIBUTING.md)"
            exit 0
          fi
          git clone --quiet "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bide-ai/homebrew-tap" tap
          cp bide.rb tap/Formula/bide.rb
          git -C tap rm --quiet --ignore-unmatch Formula/bide-audit.rb
          printf '{\n  "bide-audit": "bide"\n}\n' > tap/formula_renames.json
          git -C tap add Formula/bide.rb formula_renames.json
          git -C tap -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -s -m "bide ${GITHUB_REF_NAME}"
          git -C tap push --quiet

  # Rebuild every published binary from the tag on another OS and compare the bytes, so the claim
  # that anyone can reproduce the release is checked on every release (scripts/repro.sh).
  repro:
    if: github.event_name == 'push'
    needs: goreleaser
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Rebuild and compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/repro.sh "${GITHUB_REF_NAME}"
