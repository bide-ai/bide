name: Benchmark
run-name: Benchmark ${{ (inputs.base != '' || inputs.head != '') && format('{0} vs {1}', inputs.base, inputs.head) || github.ref_name }}

# Runs cmd/bench on a standard GitHub-hosted runner, so the published numbers come from an
# environment anyone can reproduce: Actions -> Benchmark -> Run workflow. Each scenario runs
# several times and the job summary reports the median of each metric, the runner's CPU model,
# and the raw output. The scenarios and the summary live in .github/scripts/bench.sh.
#
# Two modes:
#   - Single ref (base and head empty): benchmarks the ref the workflow runs on. Published numbers
#     come from this mode, with the CPU model stated.
#   - A/B (base and head set): builds cmd/bench at both refs and runs the two binaries interleaved
#     (base, head, base, head, ...) in one job, so both run on the same machine. Runner CPU models
#     vary between jobs (AMD EPYC 7763, 9V74, ...), so numbers from separate runs are not
#     comparable; use this mode to compare two refs.
#
#   gh workflow run bench.yml -R bide-ai/bide --ref main -f base=v0.8.0 -f head=main
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Runs per scenario (and per ref, in A/B mode); the median is reported
        default: '21'
      base:
        description: 'A/B mode: the baseline ref (tag, branch or commit). Leave base and head empty for a single-ref run.'
        default: ''
      head:
        description: 'A/B mode: the ref compared with base'
        default: ''

permissions:
  contents: read

jobs:
  bench:
    name: cmd/bench (ubuntu-latest)
    if: inputs.base == '' && inputs.head == ''
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      REPEATS: ${{ inputs.repeats }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Runner
        run: |
          .github/scripts/bench.sh cpu
          go version
      - name: Build
        run: go build -o bench ./cmd/bench
      - name: Run scenarios
        run: .github/scripts/bench.sh run "$REPEATS" out run=./bench
      - name: Summarize (medians)
        run: |
          {
            echo "## cmd/bench on ubuntu-latest"
            echo
            echo "Ref: \`$GITHUB_REF_NAME\` ($GITHUB_SHA). Runner: $(.github/scripts/bench.sh cpu), $(go version | cut -d' ' -f3-4)."
            echo
            .github/scripts/bench.sh summary out run "$REPEATS"
            echo
            echo "<details><summary>Raw output</summary>"
            echo
            echo '```'
            for f in out/run/*.txt; do echo "== $f"; cat "$f"; done
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: out/

  ab:
    name: cmd/bench A/B (ubuntu-latest)
    if: inputs.base != '' || inputs.head != ''
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      REPEATS: ${{ inputs.repeats }}
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Runner
        run: |
          .github/scripts/bench.sh cpu
          go version
      - name: Build cmd/bench at base and head
        run: |
          [ -n "$BASE" ] && [ -n "$HEAD" ] || { echo "::error::A/B mode needs both base and head"; exit 1; }
          resolve() { # ref: its commit, as given or as a branch of origin
            git rev-parse --verify --quiet "$1^{commit}" || git rev-parse --verify --quiet "origin/$1^{commit}" ||
              { echo "::error::$1 is not a tag, branch or commit of this repository" >&2; return 1; }
          }
          base_sha=$(resolve "$BASE"); head_sha=$(resolve "$HEAD")
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"; echo "HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/src-base" "$base_sha"
          git worktree add --detach "$RUNNER_TEMP/src-head" "$head_sha"
          (cd "$RUNNER_TEMP/src-base" && go build -o "$GITHUB_WORKSPACE/bench-base" ./cmd/bench)
          (cd "$RUNNER_TEMP/src-head" && go build -o "$GITHUB_WORKSPACE/bench-head" ./cmd/bench)
      - name: Run scenarios, interleaved
        run: .github/scripts/bench.sh run "$REPEATS" out base=./bench-base head=./bench-head
      - name: Go benchmarks, interleaved (benchstat)
        # The agent's per-call cost, measured without the closed-loop harness: allocations and
        # ns/op of a tool-calling run (BenchmarkRunTurns, ReadOnly calls) and of a side-effect
        # call (BenchmarkToolCallSideEffect). Ten runs per ref, alternating, on this machine.
        run: |
          mkdir -p out/gobench
          for i in $(seq 1 10); do
            for side in base head; do
              (cd "$RUNNER_TEMP/src-$side" && go test ./agent -run '^$' -bench '^Benchmark(RunTurns|ToolCallSideEffect)$' -benchmem -count=1) |
                grep '^Benchmark' >> "out/gobench/$side.txt"
            done
          done
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260929162123-406019bb8b68 base=out/gobench/base.txt head=out/gobench/head.txt | tee out/gobench/benchstat.txt
      - name: Summarize (medians and change)
        run: |
          {
            echo "## cmd/bench A/B on ubuntu-latest"
            echo
            echo "base: \`$BASE\` ($BASE_SHA); head: \`$HEAD\` ($HEAD_SHA)."
            echo
            echo "Runner: $(.github/scripts/bench.sh cpu), $(go version | cut -d' ' -f3-4). Both binaries ran on this machine in one job."
            echo
            .github/scripts/bench.sh compare out base head "$REPEATS"
            echo
            echo "### Go benchmarks (benchstat, 10 runs per ref)"
            echo
            echo '```'
            cat out/gobench/benchstat.txt
            echo '```'
            echo
            echo "<details><summary>Raw output</summary>"
            echo
            echo '```'
            for f in out/base/*.txt out/head/*.txt; do echo "== $f"; cat "$f"; done
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-ab-output
          path: out/
