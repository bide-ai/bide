name: Queue guard

# A pull request is reviewed and given auto-merge at one commit. GitHub keeps auto-merge enabled
# when a new commit is pushed, and merges the new commit as soon as its checks pass, so unreviewed
# code could merge (three times on 2026-10-26, each a pull request waiting on its checks). This
# workflow turns auto-merge off on every push and says so in a comment: a push after queueing needs
# a new review and a new queueing. Once a pull request is in the merge queue GitHub already
# rejects a push to its branch ("queued branches cannot be updated"), so that case needs no guard.
#
# It acts only on the pull request it runs for, with GITHUB_TOKEN, and checks nothing out. It runs
# on the pull request event only, so the merge queue's own branches (merge_group) never start it.
# A pull request from a fork gets a read-only token and is skipped.
on:
  pull_request:
    types: [synchronize]

# contents: write is what GitHub requires to disable auto-merge: with pull-requests: write alone
# the mutation fails with "Resource not accessible by integration" (tried on a probe pull request).
permissions:
  contents: write
  pull-requests: write

# One run per pull request; a newer push supersedes a run that has not finished.
concurrency:
  group: queue-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Queue guard
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          NEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          owner="${REPO%/*}"
          name="${REPO#*/}"
          read -r id auto < <(gh api graphql \
            -f owner="$owner" -f name="$name" -F number="$NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){
              repository(owner:$owner,name:$name){
                pullRequest(number:$number){
                  id
                  autoMergeRequest{enabledAt}
                }
              }
            }' \
            --jq '.data.repository.pullRequest | [.id, (.autoMergeRequest != null)] | @tsv')
          echo "pull request $NUMBER: auto-merge=$auto"
          if [ "$auto" != true ]; then
            echo "Auto-merge is off: nothing to do."
            exit 0
          fi
          gh api graphql -f id="$id" -f query='mutation($id:ID!){
            disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}
          }' >/dev/null
          echo "Auto-merge disabled."
          gh pr comment "$NUMBER" --repo "$REPO" --body "A commit (\`${NEW_SHA:0:9}\`) was pushed after auto-merge was enabled, so auto-merge is now off. The new commit needs a review, then auto-merge or the queue again."
