name: Docs

# Builds the VitePress site (docs-site/, sourcing docs/) and deploys it to
# GitHub Pages at bide-ai.com. One-time setup: Settings -> Pages -> Source:
# GitHub Actions, then set the custom domain to bide-ai.com. Until Pages is
# enabled, the build job still runs; only the deploy job needs Pages on.
#
# A pull request that touches the docs builds the site too (nothing is uploaded or
# deployed), so a page VitePress cannot build fails the pull request instead of the
# deploy from main. The job "Docs build" reports on every pull request and every merge queue
# batch, building only when the docs changed (a step decides, not a path filter on the workflow,
# which would leave the check missing on other pull requests), so it can be a required check.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys queue one after another; a pull request's build only replaces its own older run.
  group: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A pull request or a merge queue batch builds only when it touches what the site is built
      # from (the paths the push trigger lists); any doubt builds.
      - id: changed
        name: Did the docs change?
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          build=true
          if { [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; } && files=$(git diff --name-only "$BASE" "$HEAD") && [ -n "$files" ]; then
            echo "$files"
            echo "$files" | grep -qE '^(docs/|docs-site/|CHANGELOG\.md$|\.github/workflows/docs\.yml$)' || build=false
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.build != 'false'
        with:
          node-version: 20
      - name: Install
        if: steps.changed.outputs.build != 'false'
        working-directory: docs-site
        run: npm install
      - name: Build
        if: steps.changed.outputs.build != 'false'
        working-directory: docs-site
        run: npm run docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
