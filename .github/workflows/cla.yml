name: CLA Assistant

# Requires a repository secret PERSONAL_ACCESS_TOKEN (a classic PAT with repo
# scope) so the action can commit contributor signatures. GITHUB_TOKEN is used
# for PR comments/statuses.
#
# Note: contributor-assistant/github-action was archived in 2026 (still
# functional). For long-term use, pin to a commit SHA instead of the tag, or
# migrate to the hosted CLA Assistant (https://cla-assistant.io). The CLA text
# lives in CLA.md on the default branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/blackwell-systems/bide/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot]'
          custom-notsigned-prcomment: 'Thank you for your contribution. Before we can merge it, please sign the Contributor License Agreement by posting the statement below as a comment.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
