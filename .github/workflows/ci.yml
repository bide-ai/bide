name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Multi-module repo: the core module plus one module per heavy adapter. Each is
# built/tested in its own directory (its go.mod resolves the core via a replace
# directive; a root go.work also ties them together for local dev).
env:
  MODULES: ". mcp trace store/sqlite store/postgres govern/redislog govern/sqlitelog govern/postgreslog"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: gofmt
        run: |
          # gofmt is file-based, so one pass from the root covers every module.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: go vet (all modules)
        run: |
          for m in $MODULES; do
            echo "== vet $m =="
            ( cd "$m" && go vet ./... )
          done

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build & test (all modules)
        shell: bash
        # The race detector needs a C toolchain (absent on the Windows runner), so run
        # it on Linux/macOS and a plain test on Windows. Postgres/Redis integration tests
        # self-skip unless PG_DSN / REDIS_ADDR are set, so no service containers here.
        run: |
          race="-race"
          [ "${{ runner.os }}" = "Windows" ] && race=""
          for m in $MODULES; do
            echo "== $m =="
            ( cd "$m" && go build ./... && go test $race -count=1 ./... )
          done
