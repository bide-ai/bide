name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The merge queue tests each batch on a temporary branch; the required checks must run there.
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels the superseded run; pushes to main and merge queue batches
# are never cancelled (each one is a distinct commit that must report its own result).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Multi-module repo: the core module plus one module per heavy adapter. Each is
# built/tested in its own directory (its go.mod resolves the core via a replace
# directive; a root go.work also ties them together for local dev). The Lint job
# fails if a module in the tree is missing from this list or from go.work;
# benchmarks is the one module left out of both (bench.yml runs it on demand).
env:
  MODULES: ". mcptools trace flowedit store/sqlite store/postgres govern govern/redislog govern/sqlitelog govern/postgreslog codec/gcf anchor/awss3 anchor/gcs signer/pkcs11 signer/awskms signer/azurekv signer/gcpkms signer/gcpkms/emulatortest signer/awskms/emulatortest cmd/bide cmd/bide-anchor cmd/bide/bide-hsm cmd/bide/bide-hsm/emulatortest cmd/bide/bide-hsm/azuretest cmd/bide-view examples/approval examples/plan examples/mcp examples/observability examples/govern examples/stripe-refund examples/sso-certs examples/hsm-signing integration"
  UNLISTED_MODULES: "benchmarks"
  # The Linux test shards, one job each, balanced by measured time: the core's agent package alone
  # (".:agent", the package in the core's agent directory, not its subpackages; the longest -race
  # suite), the rest of the core (a module entry covers the packages no package entry names), and
  # the other modules. The Changes job fails unless every module in MODULES is in exactly one shard
  # and every package entry in one (.github/scripts/shards.sh check-modules), and Lint unless every
  # package of a split module is in exactly one shard's plan (check-packages).
  TEST_SHARDS: |
    agent: .:agent
    core: .
    rest: mcptools trace flowedit store/sqlite store/postgres govern govern/redislog govern/sqlitelog govern/postgreslog codec/gcf anchor/awss3 anchor/gcs signer/pkcs11 signer/awskms signer/azurekv signer/gcpkms signer/gcpkms/emulatortest signer/awskms/emulatortest cmd/bide cmd/bide-anchor cmd/bide/bide-hsm cmd/bide/bide-hsm/emulatortest cmd/bide/bide-hsm/azuretest cmd/bide-view examples/approval examples/plan examples/mcp examples/observability examples/govern examples/stripe-refund examples/sso-certs examples/hsm-signing integration

jobs:
  # Decides what a run needs. The merge queue is where the full matrix runs, once per batch of
  # pull requests, because GitHub Free allows 20 concurrent jobs and one pull request's full run is
  # about 20. A pull request runs the fast subset: this job, Lint, the Linux race tests, dco, the
  # changelog check, and Models and the gsm machine gate when their inputs changed. The other
  # required checks (Test (macos-latest), Test (windows-latest), Integration (Postgres, Redis))
  # are skipped on a pull request, which satisfies them, and run in the merge queue and on main.
  # The "full-ci" label on a pull request (then re-run the workflow, or push) runs everything on
  # the pull request too. Outputs:
  #   code    false when the change touches only documentation (and the like, changed-code.sh):
  #           the Go jobs' steps are skipped, but every job still reports under its usual name
  #   full    true on a push, in the merge queue, with the full-ci label, and on any doubt
  #   heavy   code and full: the macOS, Windows and Integration jobs, the json/v2 job and Lint's
  #           reproducible-build check run
  #   shards  the Linux test shards: all, or only "rest" for a pull request that changes the
  #           example modules and nothing else (no other module imports them)
  # Any doubt (a failed diff, an unexpected event, this job failing) counts as a code change and as
  # full: the gated jobs run unless this job succeeded and said otherwise (the Linux test shards,
  # which it plans, fail Test (ubuntu-latest) instead).
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the label check reads the pull request
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
      heavy: ${{ steps.diff.outputs.heavy }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          code=true
          full=true
          examples=false
          if [ "$EVENT" = pull_request ]; then
            # The label is read now, not from the event, so re-running the workflow after adding it works.
            if labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.labels[].name] | join(",")'); then
              case ",$labels," in *,full-ci,*) ;; *) full=false ;; esac
            fi
          fi
          # A pull request and a merge queue batch are diffed against their base; a push to main is not.
          if [ "$EVENT" != push ] && files=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "Changed files:"; echo "$files"
            # Paths no Go build or test reads are listed in changed-code.sh (shared with the
            # gsm machine gate); everything else is code.
            echo "$files" | .github/scripts/changed-code.sh >/dev/null || code=false
            # Code that only the example modules contain: no other module imports them.
            if [ "$code" = true ] && echo "$files" | .github/scripts/changed-code.sh --examples-only >/dev/null; then examples=true; fi
          fi
          heavy=false
          [ "$code" = true ] && [ "$full" = true ] && heavy=true
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"
          echo "examples=$examples" | tee -a "$GITHUB_OUTPUT"
      - id: shards
        name: Every module is in exactly one Linux test shard
        env:
          SHARDS: ${{ env.TEST_SHARDS }}
        run: |
          .github/scripts/shards.sh check-modules
          if [ "${{ steps.diff.outputs.examples }}" = true ] && [ "${{ steps.diff.outputs.full }}" = false ]; then
            # Only the example modules changed: the shard that holds them.
            echo 'shards=["rest"]' | tee -a "$GITHUB_OUTPUT"
          else
            echo "shards=$(.github/scripts/shards.sh json)" | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    # Gated per step, not per job: the docs snippet check runs on every change, documentation
    # included, and the rest only when code changed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the modelsync step reads the descriptions of the pull requests it checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the modelsync step diffs against the merge base and reads commit messages
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      - name: Code and models in step (modelsync, TestProtocolVocabulary)
        # Runs on every change, documentation and spec-only ones included. modelsync checks that
        # every region marker ("// protocol:<model> begin <Action> ...") names an action the
        # model's spec defines and its map in spec/tla/README.md lists, and that every mapped
        # action is marked. On a pull request and in the merge queue it also fails a change that
        # touches a marked region of a model and changes nothing under spec/tla/<model>/, unless
        # a commit message or the pull request's description holds a line
        # "Protocol-Impact: none (<reason>)" (or "Protocol-Impact: <model>[,<model>] none
        # (<reason>)"); each override used is printed as a warning annotation. The descriptions
        # are read through the API when the step runs, so re-running the job picks up an edited
        # one. See spec/tla/README.md and CONTRIBUTING.md.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          MQ_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          # -count=1: cheap, and it reads the spec files and the marked regions, so it always runs.
          go test -count=1 -run '^TestProtocolVocabulary' ./agent/
          body() { # body N: write pull request N's description to a file and print its path
            gh api "repos/$REPO/pulls/$1" --jq '.body // ""' > "$RUNNER_TEMP/pr-$1.txt"
            echo "$RUNNER_TEMP/pr-$1.txt"
          }
          case "$EVENT" in
            pull_request)
              go run ./internal/tools/modelsync -base "$PR_BASE" -head HEAD -body "$(body "$PR")"
              ;;
            merge_group)
              # Every pull request in the batch: the queue's branch names the last one, and each
              # squashed commit's title ends in "(#N)".
              prs=$( { echo "$MQ_REF" | grep -oE 'pr-[0-9]+' | cut -d- -f2 || true
                       git log --format=%s "$MQ_BASE..$MQ_HEAD" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9\n' || true; } | sort -u)
              args=()
              for n in $prs; do args+=(-body "$(body "$n")"); done
              echo "Pull requests in this batch: $(echo $prs)"
              go run ./internal/tools/modelsync -base "$MQ_BASE" -head "$MQ_HEAD" "${args[@]}"
              ;;
            *)
              go run ./internal/tools/modelsync
              ;;
          esac
      - name: Every module is built, tested and in go.work
        if: needs.changes.outputs.code != 'false'
        run: |
          # A module missing from MODULES would never be built or tested here, so its tests could
          # not fail. Every go.mod in the tree must be listed, in MODULES and in go.work, unless it
          # is named in UNLISTED_MODULES; a go.mod under testdata/ or vendor/ is ignored, as the go
          # tool ignores it. The self-test proves the check ignores those and still catches a new
          # module.
          .github/scripts/check-modules.sh --self-test
          .github/scripts/check-modules.sh .
          # Every package of a module split by package entries (the core) is in exactly one Linux
          # test shard; the self-test proves a missing, doubled or unknown entry fails.
          .github/scripts/shards.sh --self-test
          SHARDS="$TEST_SHARDS" .github/scripts/shards.sh check-packages
          # Every test file that starts a process is in a package of the list of tests that always
          # run, or in the list of those whose result depends only on the test binary.
          .github/scripts/check-uncached.sh --self-test
          .github/scripts/check-uncached.sh
          .github/scripts/check-pinned-actions.sh --self-test
          .github/scripts/check-pinned-actions.sh
          # The docs-only test (changed-code.sh) is what lets a pull request or a queue batch skip
          # the Go jobs: its cases include the documents the Go tests read.
          .github/scripts/changed-code.sh --self-test
      - name: Every module is published or repo-only
        if: needs.changes.outputs.code != 'false'
        run: |
          # scripts/release.sh tags the published modules at each release and never the repo-only
          # ones; a module in neither list, or a published module requiring a repo-only one, fails.
          # The self-test proves the release-time go.mod check refuses a v0.0.0 requirement and a
          # replace directive, and that no push carries more than three tags (GitHub runs no
          # workflow for the tags of a larger push). The same go.mod check runs on every pushed
          # nested tag (release-modules.yml).
          scripts/release.sh --self-test
          # The module SBOM script writes its output where the caller names it, from any directory.
          scripts/module-sbom.sh --self-test
          scripts/release.sh --check-classification
          # The Homebrew formula the release workflow writes pins a sha256 per archive and refuses
          # a checksums file that lacks one.
          scripts/brew-formula.sh --self-test
          # The release's provenance check passes gh the repository, builder workflow and commit, ref and predicate
          # to enforce, and fails on one file that does not verify or on no files at all.
          scripts/verify-provenance.sh --self-test
          # The pinned gh the release verifies provenance with is installed only if its checksum
          # matches.
          scripts/install-gh.sh --self-test
      - name: Release builder pin
        if: needs.changes.outputs.code != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml pins the release builder by commit; GitHub runs any commit of a fork network
          # named by SHA, so each pin must be on bide-ai/release-builder's main.
          scripts/verify-provenance.sh --check-pin
      - name: Benchmark summary script
        if: needs.changes.outputs.code != 'false'
        run: |
          # bench.yml's medians, percentage changes and interleaved A/B runs come from this script.
          .github/scripts/bench.sh --self-test
      - name: gofmt
        if: needs.changes.outputs.code != 'false'
        run: |
          # gofmt is file-based, so one pass from the root covers every module.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: go vet (all modules)
        if: needs.changes.outputs.code != 'false'
        run: |
          for m in $MODULES; do
            echo "== vet $m =="
            ( cd "$m" && go vet ./... )
          done
          # The verifier's build of the bide command (audit, version and help only) must build and
          # pass its own tests; TestAuditOnlyBuildIsCore checks its import graph in every build.
          # -count=1: the architecture test runs go list, whose result the test cache cannot see change.
          echo "== vet and test cmd/bide -tags bide_audit_only =="
          ( cd cmd/bide && go vet -tags bide_audit_only ./... && go test -tags bide_audit_only -count=1 . )
      - name: go mod tidy leaves no diff (all modules)
        if: needs.changes.outputs.code != 'false'
        # The release runs go mod tidy on each published module, and TestDirectRequires (cmd/bide)
        # checks the direct requires after it. A direct import of a module that go.mod marks
        # // indirect (a test importing pgx, say) builds and tests fine on main, and only the release's
        # tidy exposes it, so main must already be tidy. Tidy ignores go.work, so each module is
        # tidied on its own, as the release does.
        run: |
          for m in $MODULES; do
            echo "== tidy $m =="
            ( cd "$m" && go mod tidy )
          done
          if ! git diff --exit-code -- '*go.mod' '*go.sum'; then
            echo "go mod tidy changes the files above. Run go mod tidy in each module and commit the result."
            exit 1
          fi
      - name: Reproducible bide builds
        # In the merge queue and on main (heavy), not on a pull request.
        if: needs.changes.outputs.heavy != 'false'
        # Two builds of cmd/bide from copies of the tree at different paths are byte-identical, and
        # .goreleaser.yaml builds with the flags scripts/repro.sh rebuilds a release with.
        run: scripts/repro.sh --self-test
      - name: doccheck (all modules)
        if: needs.changes.outputs.code != 'false'
        # Every exported identifier has a doc comment that starts with its name, and every package
        # has a package comment. One parse-only pass from the root covers every module. The
        # allowlist only shrinks: doccheck fails on an entry that is now documented, and a pull
        # request may not add entries.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          go run ./internal/tools/doccheck -root . -allow .doccheck-allow
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            if base=$(git show "$BASE:.doccheck-allow" 2>/dev/null); then
              added=$(LC_ALL=C comm -13 <(echo "$base" | grep -v '^#' | LC_ALL=C sort) <(grep -v '^#' .doccheck-allow | LC_ALL=C sort) | grep -v '^$' || true)
              if [ -n "$added" ]; then
                echo "::error::this pull request adds .doccheck-allow entries; document these identifiers instead:"
                echo "$added"
                exit 1
              fi
            fi
          fi
      - name: docs snippets compile
        # Every ```go block in README.md and docs/ compiles against the current code (api listings
        # match the packages' declarations), resolving bide's modules through go.work. A block
        # annotates its free identifiers with <!-- docsnip: setup ... -->, or is pseudo-code with
        # <!-- docsnip: skip reason -->; see CONTRIBUTING.md. Runs on documentation-only changes.
        run: go run ./internal/tools/docsnip
      - name: docs links resolve
        # Every relative link in README.md, examples/README.md and docs/ names a file that exists
        # and, with a #fragment, a heading that exists. The docs site sets ignoreDeadLinks, so this
        # is the check. Runs on documentation-only changes, which skip the doccheck step above.
        run: go run ./internal/tools/doccheck -root . -links
      - name: no removed API names
        # No name the pre-1.0 redesign removed (docs/design/api-v1.md, section 10.2: RunSaga,
        # ResolveHaltRef, agent.Durable, the pause aliases, ...) appears in Go code, godoc or docs,
        # outside the historical records (CHANGELOG.md, docs/releases, docs/design). -godoc checks `go doc -all` of every public package too.
        run: go run ./internal/tools/oldnames -godoc
      - name: no result sent before its bookkeeping
        # A goroutine that sends or closes a result and only then runs a deferred decrement, release
        # or unlock lets the receiver act on state it has not yet put right (a flaky test at best, a
        # lost attempt at worst). The order is checked in every .go file, tests included; a safe
        # order goes in .sendcheck-allow with its reason. See internal/tools/sendcheck.
        run: go run ./internal/tools/sendcheck
      - name: govulncheck (all modules)
        if: needs.changes.outputs.code != 'false'
        # Known vulnerabilities in dependencies or the standard library that bide's code can reach
        # fail the build.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          for m in $MODULES; do
            echo "== govulncheck $m =="
            ( cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./... )
          done

  # Linux: the modules in shards, one job each, under the race detector, which finds the same races
  # on Linux as it would on macOS. Test (ubuntu-latest), the required check, stands for the shards
  # and the json/v2 job. Postgres/Redis integration tests self-skip unless PG_DSN / REDIS_ADDR are
  # set, so no service containers here.
  test-linux:
    name: Test (ubuntu-latest, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false # the go-cache action below restores the build and test cache
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          name: linux-${{ matrix.shard }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the approve page's script tests (approvals/page) run under Node: Ed25519 in WebCrypto needs 20 or later
      - name: Build & test (the shard's modules and packages)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        # For each line of the shard's plan (a module's directory, then "./..." or the packages of
        # it this shard owns): go build the packages with non-test Go files, as go build ./...
        # does, then go test -race every package. No -count=1: a package whose test binary and
        # inputs are unchanged reuses its cached result (gocache.sh, shards.sh run), except the
        # packages in .github/uncached-tests.txt, which always run. A push to main starts from an
        # empty test cache, so main runs every test.
        run: SHARDS="$TEST_SHARDS" .github/scripts/shards.sh run "$SHARD" -race
      # Only a push to main saves the cache: a cache saved on a pull request or a merge queue branch
      # is not readable by other runs, and would only evict the useful ones.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: go-${{ runner.os }}-linux-${{ matrix.shard }}-${{ github.sha }}


  test-nojsonv2:
    name: Test (ubuntu-latest, without encoding/json/v2)
    needs: changes
    if: needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false # the go-cache action below restores the build and test cache
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          name: linux-nojsonv2
      - name: Test without encoding/json/v2 (core, govern and integration modules)
        shell: bash
        # encoding/json/v2 is a Go experiment in Go 1.27, on by default. bide does not depend on it,
        # and the journal encoding must be identical with and without it, so the core module is
        # also tested with the experiment off, as are govern and the core's tests that moved to
        # the integration module.
        env:
          GOEXPERIMENT: nojsonv2
          MODULES: . govern integration
        run: .github/scripts/shards.sh run-modules
      # Only a push to main saves the cache: a cache saved on a pull request or a merge queue branch
      # is not readable by other runs, and would only evict the useful ones.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: go-${{ runner.os }}-linux-nojsonv2-${{ github.sha }}

  # The required check for Linux. It always reports: success when the Changes job succeeded and
  # either only documentation changed or every shard and the json/v2 job succeeded; a failed,
  # cancelled or skipped one, or a failed Changes job, fails it.
  test-linux-result:
    name: Test (ubuntu-latest)
    needs: [changes, test-linux, test-nojsonv2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Every shard passed
        env:
          HEAVY: ${{ needs.changes.outputs.heavy }}
        run: |
          # The json/v2 job runs in the merge queue and on main, not on a pull request.
          jobs=("shards=${{ needs.test-linux.result }}")
          [ "$HEAVY" = false ] || jobs+=("nojsonv2=${{ needs.test-nojsonv2.result }}")
          .github/scripts/shards.sh verdict "${{ needs.changes.result }}" "${{ needs.changes.outputs.code }}" "${jobs[@]}"

  # macOS and Windows: every module in one job each, without -race, which also runs the scale
  # tests at full size (they run smaller under -race). About 3 to 4 minutes on macOS and 6 to 9 on
  # Windows (store/sqlite alone is 4). Skipped on a pull request (see Changes), run in the merge
  # queue and on main; a skipped job satisfies its required check, as Integration's does. One job
  # each, not sharded: each extra job costs a runner start and about 70 s of setup.
  test-macos:
    name: Test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false # the go-cache action below restores the build and test cache
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          name: macos
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the approve page's script tests (approvals/page) run under Node: Ed25519 in WebCrypto needs 20 or later
      - name: Build & test (all modules)
        shell: bash
        # No -count=1 (see the Linux shards).
        run: .github/scripts/shards.sh run-modules
      # Only a push to main saves the cache: a cache saved on a pull request or a merge queue branch
      # is not readable by other runs, and would only evict the useful ones.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: go-${{ runner.os }}-macos-${{ github.sha }}

  test-windows:
    name: Test (windows-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false # the go-cache action below restores the build and test cache
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          name: windows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the approve page's script tests (approvals/page) run under Node: Ed25519 in WebCrypto needs 20 or later
      - name: Build & test (all modules)
        shell: bash
        # No -count=1 (see the Linux shards).
        run: .github/scripts/shards.sh run-modules
      # Only a push to main saves the cache: a cache saved on a pull request or a merge queue branch
      # is not readable by other runs, and would only evict the useful ones.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: ${{ steps.gocache.outputs.paths }}
          key: go-${{ runner.os }}-windows-${{ github.sha }}

  integration:
    # Also runs the PKCS#11 signer's SoftHSM2 tests (signer/pkcs11, examples/hsm-signing) and
    # bide-hsm's (cmd/bide/bide-hsm: approvals signed through SoftHSM2, and the real binary); the
    # name stays, as it is a required check.
    name: Integration (Postgres, Redis)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pulls the private MinIO fixture image from ghcr.io
    # Skipped on a pull request, like the macOS and Windows jobs.
    # The Postgres store (cross-instance at-most-once, leases) and the shared governed-event logs
    # need real services; their tests skip without PG_DSN / REDIS_ADDR, so the Test jobs above
    # never run them. This job does, against service containers.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bide
          POSTGRES_PASSWORD: bide
          POSTGRES_DB: bide_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bide" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PG_DSN: postgres://bide:bide@localhost:5432/bide_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      BIDE_REQUIRE_SOFTHSM: "1" # signer/pkcs11 and bide-hsm fail, not skip, without SoftHSM2
      BIDE_REQUIRE_OPENSSL: "1" # the certificate request tests (cmd/bide, bide-hsm) fail, not skip, without openssl
      BIDE_REQUIRE_OBJECTLOCK: "1" # anchor/awss3's Object Lock tests fail, not skip, without the MinIO server below
      BIDE_S3_ENDPOINT: http://127.0.0.1:19000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      - name: Install SoftHSM2 (the PKCS#11 signer's token)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q softhsm2
          ls /usr/lib/softhsm /usr/lib/*/softhsm 2>/dev/null
      - name: Start MinIO (an S3 server with Object Lock, for anchor/awss3)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A service container cannot be given a command, so the server is started here. MinIO no
          # longer publishes images on Docker Hub or Quay. The image is a private, CI-only mirror of
          # Chainguard's build of the AGPL-licensed MinIO server (cgr.dev/chainguard/minio), pinned by
          # digest and used only as a test fixture: nothing of it is distributed, and the package is
          # not public. The repository needs Actions read access to the package (package settings).
          # To refresh the mirror, a maintainer runs
          #   docker buildx imagetools create -t ghcr.io/bide-ai/minio-fixture:<date> cgr.dev/chainguard/minio@<digest>
          # and puts the digest here. The tests create their own buckets.
          image=ghcr.io/bide-ai/minio-fixture@sha256:c93745c56fccdaf0e5dcb88999a96a65a136428beb045ef5d546255a80d747a7
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker pull -q "$image"; then
            echo "::error::The MinIO fixture image $image could not be pulled. A 403 means this repository has no Actions read access to the private package ghcr.io/bide-ai/minio-fixture (package settings, Manage Actions access). If the digest is gone, mirror a MinIO image with Object Lock again (see the comment in this step), run anchor/awss3's tests against it (BIDE_S3_ENDPOINT, BIDE_REQUIRE_OBJECTLOCK=1; docs/guides/anchoring.md), and replace the digest."
            exit 1
          fi
          docker run -d --name minio -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin-ci-only \
            "$image" server /data --address :9000
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:19000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs minio
          echo "::error::MinIO did not become ready"
          exit 1
      - name: Integration tests (twice each; a skip fails the job)
        run: |
          # -count=2 runs each suite twice against the same services, so a test that only passes
          # on a fresh database fails here. A skip means the services were not reached, which
          # would silently test nothing, so it fails the job.
          for m in store/postgres govern/postgreslog govern/redislog cmd/bide cmd/bide/bide-hsm signer/pkcs11 examples/hsm-signing anchor/awss3; do
            echo "== $m =="
            out=$(cd "$m" && go test -race -count=2 -v ./... 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -E '^(ok|FAIL|--- (PASS|FAIL|SKIP))'
            if echo "$out" | grep -q -- '--- SKIP'; then
              echo "::error::integration tests were skipped in $m (services not reachable?)"
              exit 1
            fi
          done
      - name: SSO certificate recipe (step-ca and a mock IdP in containers)
        # examples/sso-certs runs the recipe in docs/guides/sso-certificates.md against pinned
        # images: login, request, issue, approve, revoke, refresh the CRL. Once, not twice (-count=2
        # would start the containers twice for nothing), and BIDE_REQUIRE_STEPCA makes a missing
        # Docker a failure; a skip fails the step like the others.
        timeout-minutes: 10
        env:
          BIDE_REQUIRE_STEPCA: "1"
        run: |
          out=$(cd examples/sso-certs && go test -count=1 -v ./... 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -E '^(ok|FAIL|--- (PASS|FAIL|SKIP))'
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::the SSO recipe test was skipped"
            exit 1
          fi
