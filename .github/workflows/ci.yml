name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The merge queue tests each batch on a temporary branch; the required checks must run there.
  merge_group:

permissions:
  contents: read

# Multi-module repo: the core module plus one module per heavy adapter. Each is
# built/tested in its own directory (its go.mod resolves the core via a replace
# directive; a root go.work also ties them together for local dev). The Lint job
# fails if a module in the tree is missing from this list or from go.work;
# benchmarks is the one module left out of both (bench.yml runs it on demand).
env:
  MODULES: ". mcptools trace store/sqlite store/postgres govern govern/redislog govern/sqlitelog govern/postgreslog codec/gcf examples/approval examples/plan examples/mcp examples/observability examples/govern integration"
  UNLISTED_MODULES: "benchmarks"
  # The Linux test shards, one job each, balanced by measured time: the core's agent package alone
  # (".:agent", the package in the core's agent directory, not its subpackages; the longest -race
  # suite), the rest of the core (a module entry covers the packages no package entry names), and
  # the other modules. The Changes job fails unless every module in MODULES is in exactly one shard
  # and every package entry in one (.github/scripts/shards.sh check-modules), and Lint unless every
  # package of a split module is in exactly one shard's plan (check-packages).
  TEST_SHARDS: |
    agent: .:agent
    core: .
    rest: mcptools trace store/sqlite store/postgres govern govern/redislog govern/sqlitelog govern/postgreslog codec/gcf examples/approval examples/plan examples/mcp examples/observability examples/govern integration

jobs:
  # Decides whether a pull request touches anything the Go jobs test. A PR that changes only
  # documentation skips their steps (except Lint's docs snippet check, which compiles the Go
  # blocks of the docs), but every job still runs and reports under its usual name, so the
  # required checks pass instead of waiting forever. Pushes to main always run everything,
  # and any doubt (a failed diff, an unexpected event, this job failing) counts as a code change:
  # the gated jobs run unless this job succeeded and said otherwise (the Linux test shards, which
  # it plans, fail Test (ubuntu-latest) instead).
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ] && files=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "Changed files:"; echo "$files"
            # Paths no Go build or test reads (the TLA+ models have their own workflow, models.yml).
            # Everything else is code.
            other=$(echo "$files" | grep -vE '^(docs/|docs-site/|assets/|spec/tla/|\.github/ISSUE_TEMPLATE/)|\.md$|^(LICENSE|NOTICE|DCO)$|^\.github/workflows/(docs|bench|models|explore)\.yml$' || true)
            [ -n "$files" ] && [ -z "$other" ] && code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
      - id: shards
        name: Every module is in exactly one Linux test shard
        env:
          SHARDS: ${{ env.TEST_SHARDS }}
        run: |
          .github/scripts/shards.sh check-modules
          echo "shards=$(.github/scripts/shards.sh json)" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    # Gated per step, not per job: the docs snippet check runs on every change, documentation
    # included, and the rest only when code changed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the modelsync step reads the descriptions of the pull requests it checks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the modelsync step diffs against the merge base and reads commit messages
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Code and models in step (modelsync, TestProtocolVocabulary)
        # Runs on every change, documentation and spec-only ones included. modelsync checks that
        # every region marker ("// protocol:<model> begin <Action> ...") names an action the
        # model's spec defines and its map in spec/tla/README.md lists, and that every mapped
        # action is marked. On a pull request and in the merge queue it also fails a change that
        # touches a marked region of a model and changes nothing under spec/tla/<model>/, unless
        # a commit message or the pull request's description holds a line
        # "Protocol-Impact: none (<reason>)" (or "Protocol-Impact: <model>[,<model>] none
        # (<reason>)"); each override used is printed as a warning annotation. The descriptions
        # are read through the API when the step runs, so re-running the job picks up an edited
        # one. See spec/tla/README.md and CONTRIBUTING.md.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          MQ_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          go test -count=1 -run '^TestProtocolVocabulary' ./agent/
          body() { # body N: write pull request N's description to a file and print its path
            gh api "repos/$REPO/pulls/$1" --jq '.body // ""' > "$RUNNER_TEMP/pr-$1.txt"
            echo "$RUNNER_TEMP/pr-$1.txt"
          }
          case "$EVENT" in
            pull_request)
              go run ./internal/tools/modelsync -base "$PR_BASE" -head HEAD -body "$(body "$PR")"
              ;;
            merge_group)
              # Every pull request in the batch: the queue's branch names the last one, and each
              # squashed commit's title ends in "(#N)".
              prs=$( { echo "$MQ_REF" | grep -oE 'pr-[0-9]+' | cut -d- -f2 || true
                       git log --format=%s "$MQ_BASE..$MQ_HEAD" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9\n' || true; } | sort -u)
              args=()
              for n in $prs; do args+=(-body "$(body "$n")"); done
              echo "Pull requests in this batch: $(echo $prs)"
              go run ./internal/tools/modelsync -base "$MQ_BASE" -head "$MQ_HEAD" "${args[@]}"
              ;;
            *)
              go run ./internal/tools/modelsync
              ;;
          esac
      - name: Every module is built, tested and in go.work
        if: needs.changes.outputs.code != 'false'
        run: |
          # A module missing from MODULES would never be built or tested here, so its tests could
          # not fail. Every go.mod in the tree must be listed, in MODULES and in go.work, unless it
          # is named in UNLISTED_MODULES; a go.mod under testdata/ or vendor/ is ignored, as the go
          # tool ignores it. The self-test proves the check ignores those and still catches a new
          # module.
          .github/scripts/check-modules.sh --self-test
          .github/scripts/check-modules.sh .
          # Every package of a module split by package entries (the core) is in exactly one Linux
          # test shard; the self-test proves a missing, doubled or unknown entry fails.
          .github/scripts/shards.sh --self-test
          SHARDS="$TEST_SHARDS" .github/scripts/shards.sh check-packages
      - name: Every module is published or repo-only
        if: needs.changes.outputs.code != 'false'
        run: |
          # scripts/release.sh tags the published modules at each release and never the repo-only
          # ones; a module in neither list, or a published module requiring a repo-only one, fails.
          # The self-test proves the release-time go.mod check refuses a v0.0.0 requirement and a
          # replace directive, and that no push carries more than three tags (GitHub runs no
          # workflow for the tags of a larger push). The same go.mod check runs on every pushed
          # nested tag (release-modules.yml).
          scripts/release.sh --self-test
          scripts/release.sh --check-classification
      - name: Benchmark summary script
        if: needs.changes.outputs.code != 'false'
        run: |
          # bench.yml's medians, percentage changes and interleaved A/B runs come from this script.
          .github/scripts/bench.sh --self-test
      - name: gofmt
        if: needs.changes.outputs.code != 'false'
        run: |
          # gofmt is file-based, so one pass from the root covers every module.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: go vet (all modules)
        if: needs.changes.outputs.code != 'false'
        run: |
          for m in $MODULES; do
            echo "== vet $m =="
            ( cd "$m" && go vet ./... )
          done
      - name: doccheck (all modules)
        if: needs.changes.outputs.code != 'false'
        # Every exported identifier has a doc comment that starts with its name, and every package
        # has a package comment. One parse-only pass from the root covers every module. The
        # allowlist only shrinks: doccheck fails on an entry that is now documented, and a pull
        # request may not add entries.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          go run ./internal/tools/doccheck -root . -allow .doccheck-allow
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            if base=$(git show "$BASE:.doccheck-allow" 2>/dev/null); then
              added=$(LC_ALL=C comm -13 <(echo "$base" | grep -v '^#' | LC_ALL=C sort) <(grep -v '^#' .doccheck-allow | LC_ALL=C sort) | grep -v '^$' || true)
              if [ -n "$added" ]; then
                echo "::error::this pull request adds .doccheck-allow entries; document these identifiers instead:"
                echo "$added"
                exit 1
              fi
            fi
          fi
      - name: docs snippets compile
        # Every ```go block in README.md and docs/ compiles against the current code (api listings
        # match the packages' declarations), resolving bide's modules through go.work. A block
        # annotates its free identifiers with <!-- docsnip: setup ... -->, or is pseudo-code with
        # <!-- docsnip: skip reason -->; see CONTRIBUTING.md. Runs on documentation-only changes.
        run: go run ./internal/tools/docsnip
      - name: govulncheck (all modules)
        if: needs.changes.outputs.code != 'false'
        # Known vulnerabilities in dependencies or the standard library that bide's code can reach
        # fail the build.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          for m in $MODULES; do
            echo "== govulncheck $m =="
            ( cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./... )
          done

  # Linux: the modules in shards, one job each, under the race detector, which finds the same races
  # on Linux as it would on macOS. Test (ubuntu-latest), the required check, stands for the shards
  # and the json/v2 job. Postgres/Redis integration tests self-skip unless PG_DSN / REDIS_ADDR are
  # set, so no service containers here.
  test-linux:
    name: Test (ubuntu-latest, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build & test (the shard's modules and packages)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        # For each line of the shard's plan (a module's directory, then "./..." or the packages of
        # it this shard owns): go build the packages with non-test Go files, as go build ./...
        # does, then go test -race -count=1 every package.
        run: SHARDS="$TEST_SHARDS" .github/scripts/shards.sh run "$SHARD" -race -count=1

  test-nojsonv2:
    name: Test (ubuntu-latest, without encoding/json/v2)
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Test without encoding/json/v2 (core, govern and integration modules)
        shell: bash
        # encoding/json/v2 is a Go experiment in Go 1.27, on by default. bide does not depend on it,
        # and the journal encoding must be identical with and without it, so the core module is
        # also tested with the experiment off, as are govern and the core's tests that moved to
        # the integration module.
        run: |
          for m in . govern integration; do
            echo "== $m =="
            ( cd "$m" && GOEXPERIMENT=nojsonv2 go test -count=1 ./... )
          done

  # The required check for Linux. It always reports: success when the Changes job succeeded and
  # either only documentation changed or every shard and the json/v2 job succeeded; a failed,
  # cancelled or skipped one, or a failed Changes job, fails it.
  test-linux-result:
    name: Test (ubuntu-latest)
    needs: [changes, test-linux, test-nojsonv2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Every shard passed
        run: .github/scripts/shards.sh verdict "${{ needs.changes.result }}" "${{ needs.changes.outputs.code }}" "shards=${{ needs.test-linux.result }}" "nojsonv2=${{ needs.test-nojsonv2.result }}"

  # macOS and Windows: every module in one job each (about 3 and 4 minutes, under the Linux core
  # shard), without -race, which also runs the scale tests at full size (they run smaller under
  # -race).
  test:
    name: Test
    needs: changes
    # Gated per step, not per job: a skipped matrix job never reports its per-OS checks.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.code == 'false'
        run: echo "Only documentation changed; the Go build and tests are skipped."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.code != 'false'
        with:
          go-version: '1.27'
      - name: Build & test (all modules)
        if: needs.changes.outputs.code != 'false'
        shell: bash
        run: |
          for m in $MODULES; do
            echo "== $m =="
            ( cd "$m" && go build ./... && go test -count=1 ./... )
          done

  integration:
    name: Integration (Postgres, Redis)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # The Postgres store (cross-instance at-most-once, leases) and the shared governed-event logs
    # need real services; their tests skip without PG_DSN / REDIS_ADDR, so the Test jobs above
    # never run them. This job does, against service containers.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bide
          POSTGRES_PASSWORD: bide
          POSTGRES_DB: bide_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bide" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PG_DSN: postgres://bide:bide@localhost:5432/bide_test?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Integration tests (twice each; a skip fails the job)
        run: |
          # -count=2 runs each suite twice against the same services, so a test that only passes
          # on a fresh database fails here. A skip means the services were not reached, which
          # would silently test nothing, so it fails the job.
          for m in store/postgres govern/postgreslog govern/redislog; do
            echo "== $m =="
            out=$(cd "$m" && go test -race -count=2 -v ./... 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -E '^(ok|FAIL|--- (PASS|FAIL|SKIP))'
            if echo "$out" | grep -q -- '--- SKIP'; then
              echo "::error::integration tests were skipped in $m (services not reachable?)"
              exit 1
            fi
          done
