name: Coverage

# Test coverage of the published modules, uploaded to Codecov. Not a required check, and an upload
# failure never fails it. It authenticates with GitHub's OIDC token, so no Codecov secret is stored;
# the id-token permission is on this one job only. Fork pull requests cannot get an OIDC token, so
# they skip the upload (the tests still run).

on:
  push:
    branches: [ main ]
  # Not on pull requests: a pull request's runner budget goes to the required checks. Run it from
  # the Actions tab on the branch (workflow_dispatch) when a patch's coverage is wanted.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # The Postgres store and the shared governed-event logs have tests that skip without these
    # services; running them here is what puts those packages' code in the profile. Same services,
    # env and health checks as the Integration job in ci.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bide
          POSTGRES_PASSWORD: bide
          POSTGRES_DB: bide_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bide" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PG_DSN: postgres://bide:bide@localhost:5432/bide_test?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      - name: Test with coverage (published modules, merged into coverage.out)
        run: scripts/coverage.sh coverage.out
      - name: Upload to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # Pinned to a commit: this workflow holds an OIDC token. v7.1.1.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.out
          fail_ci_if_error: false
          disable_search: true
