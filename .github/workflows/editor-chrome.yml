name: Editor (Chrome)

# The flow editor's page (bide edit, package flowedit) in real Chrome: it draws what the server
# computed, selects a node by pointer and by keyboard alone, edits through the forms, the assertions
# panel and the source, saves through the dialog, runs axe-core in light and dark, and makes no request
# off its origin, no failed request and no console message (a Content-Security-Policy violation is
# one). The tests are the *InChrome tests of flowedit/browser_test.go; this workflow installs Chrome's
# driver (puppeteer-core and axe-core, from the lockfile) around them. Runs on pull requests that touch the editor or the viewer assets it serves,
# and in the merge queue (which does not filter by path).
on:
  pull_request:
    paths:
      - 'flowedit/**'
      - 'internal/runview/**'
      - '.github/workflows/editor-chrome.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-chrome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chrome:
    name: Editor (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install puppeteer-core (from the lockfile)
        working-directory: flowedit/browser
        run: |
          google-chrome-stable --version
          npm ci --ignore-scripts
      - name: Drive the editor page in Chrome
        working-directory: flowedit
        env:
          GOWORK: 'off'
          BIDE_EDIT_BROWSER: '1' # with CI set, a missing Chrome or tool fails the test instead of skipping it
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: go test . -run 'InChrome' -count=1 -v
