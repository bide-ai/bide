scaffolds:
    - file_path: plan/handle.go
      contents: |-
        Package declaration `package plan` with the shared, cross-agent type surface every
        downstream agent compiles against. Exact signatures (Go 1.27, generic methods legal):

          // Producer[M] is the output side of a wired step: it yields a value of type M.
          // Handle[I,O] satisfies Producer[O]. The method is unexported so only handles
          // (and internal types) can be producers; it carries no runtime behavior.
          type Producer[M any] interface{ producerMarker(M) }

          // Consumer[M] is the input side of a wired step: it accepts a value of type M.
          // Handle[I,O] satisfies Consumer[I]. Unexported marker method (phantom).
          type Consumer[M any] interface{ consumerMarker(M) }

          // Handle[I,O] is a compile-time name for a durable step consuming I and producing O.
          // It satisfies Producer[O] and Consumer[I]. It carries the step's journal key (name)
          // and its declared kind; the value it stands for lives in the journal at run time.
          type Handle[I, O any] struct {
              name string
              b    *builderCore // back-reference to the owning builder's spec (internal)
          }

          func (Handle[I, O]) producerMarker(O) {}
          func (Handle[I, O]) consumerMarker(I) {}

          // Name returns the durable journal-step key this handle names.
          func (h Handle[I, O]) Name() string { return h.name }

        Do NOT put Builder, Flow, Step/Tool/Model constructors, Edge/Switch, Arm, When/Else, or
        Build here; those are owned by later agents. This scaffold provides ONLY: Producer,
        Consumer, Handle (with its two phantom methods and Name), and the forward-declared
        internal `builderCore` type name that plan/spec.go fully defines. To avoid a
        duplicate-declaration merge conflict, `builderCore` is fully declared in spec.go
        (Wave 1 Agent A owns both handle.go and spec.go), and handle.go only references it.
      import_path: github.com/dayna/go-agents/plan
      status: committed (4d5b687)
    - file_path: plan/spec.go
      contents: |-
        `package plan`. The internal reified topology model (the IR) that Handle back-references
        and that Build walks. Unexported except where a field must be read by RenderMermaid (same
        package, so unexported is fine). Exact shape:

          // nodeKind classifies a lowered step for rendering and validation.
          type nodeKind int
          const (
              kindStep nodeKind = iota // arbitrary func(I)(O,error)
              kindTool                 // an agent.Tool
              kindModel                // a model call built from a prompt
              kindSwitch               // a journaled branch choice
          )

          // node is one declared step in the topology. inType/outType are reflect.Type captured
          // at construction so Build can validate whole-graph coherence and RenderMermaid can label.
          type node struct {
              name    string
              kind    nodeKind
              inType  reflect.Type
              outType reflect.Type
              // run is the type-erased lowering closure the constructor installs; Build wraps it
              // in an agent.Step call keyed by name. It takes the decoded input (as any) and
              // returns the output (as any) or an error. nil for kindSwitch.
              run func(ctx context.Context, in any) (any, error)
          }

          // edge is a declared connection producer.Out -> consumer.In (names, not values).
          type edge struct{ from, to string }

          // arm is a resolved Switch arm: a predicate over the switched node's output (nil for Else)
          // and the target node name. Stored type-erased; the typed When/Else builders (Agent B)
          // populate these.
          type arm struct {
              isElse bool
              pred   func(v any) bool
              target string
          }

          // branch is a declared Switch: the switched-over producer node and its ordered arms.
          type branch struct {
              over string
              arms []arm
          }

          // builderCore is the mutable spec a Builder accumulates and Build freezes. It is the
          // reified value RenderMermaid walks. Handle holds a *builderCore back-reference.
          type builderCore struct {
              flowName        string
              entry           string       // set to the first constructed node's name (entry step)
              inType, outType reflect.Type // pinned by New[In,Out]
              nodes           []*node
              byName          map[string]*node
              edges           []edge
              branches        []branch
              errs            []error      // deferred construction errors surfaced at Build
          }

        Include a package-level helper `func typeOf[T any]() reflect.Type` returning
        reflect.TypeFor[T]() for the constructors to capture I/O types. Do NOT declare Builder,
        Flow, or any exported constructor here.
      import_path: github.com/dayna/go-agents/plan
      status: committed (4d5b687)
