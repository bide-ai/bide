completion_date: "2026-09-26"
title: 'plan rung-1: handle-based flow builder that lowers to the journal-backed runtime'
feature_slug: plan-rung1
verdict: SUITABLE
suitability_assessment: |-
    Verdict: SUITABLE (5/5 gate questions resolve cleanly).

    1. File decomposition. The feature is a brand-new package (github.com/dayna/go-agents/plan)
       with a natural compiler-style layering: shared types/spec model (front-end IR), constructors +
       wiring (the authoring surface), Build lowering + whole-graph validation (the backend that emits
       agent.Step calls), and RenderMermaid (a pure walk of the reified value). These are >=4 distinct
       concerns with disjoint files. The only shared surface is the type/spec model, which is
       scaffolded in Wave 1 so every downstream agent compiles against one definition. Disjoint
       ownership is achievable.

    2. Investigation-first items. None. The runtime primitives are already built and understood
       (agent.Do / agent.Step memoization, the ~40-line loop, StepValue journaling, Safety
       classification). The design doc (docs/design/expression-surfaces.md) is a complete spec. There
       is no crash to reproduce or race to root-cause; this is greenfield construction against a stable
       substrate.

    3. Interface discoverability. Fully discoverable. The design doc pins the constructor and wiring
       signatures verbatim (New / Step / Tool / Model / Edge / Switch / Build), and the lowering target
       (agent.Step[T], agent.Durable, agent.Record/StepValue) is a frozen existing API. Contracts can
       be written before any implementation starts. The two open design points (Switch arm API, and the
       sequential-lowering confirmation) are decisions, not unknowns, and both have a recommended
       default encoded below; neither blocks contract definition.

    4. Pre-implementation status check. Nothing exists yet: no plan/ directory. All work is TODO.
       No docs/CONTEXT.md is present, so there are no established_interfaces to reconcile against; the
       established runtime interfaces (agent.Durable, agent.Tool, agent.Safety, agent.Step) are read
       from source and referenced, not redefined.

    5. Parallelization value. High. Generic Go with race-enabled test cycles (go test -race), 3-6 files
       per agent, non-trivial logic (type-parameterized handles, whole-graph validation, DST crash
       sweep). Wave 2 has 3 independent agents (constructors, RenderMermaid, plus the Build/lowering
       agent depends on constructors so it is Wave 3). Waves are sequential but Wave 2 parallelizes
       three substantial agents.

    Estimated times:
    - Scout phase: ~8 min (done)
    - Agent execution: ~28 min (Wave 1 scaffold ~4 min; Wave 2 three agents in parallel ~12 min;
      Wave 3 lowering+build ~12 min; tests fold into their owning agents)
    - Merge and verification: ~5 min
    Total Polywave time: ~41 min

    Sequential baseline: ~70 min (one agent building types -> constructors -> Build -> render -> tests
    serially, each waiting on the prior).
    Time savings: ~29 min (~40% faster), plus the IMPL doc is a durable interface spec and conformance
    audit trail for the rung-2/rung-3 surfaces that will build on this value.

    Recommendation: Clear speedup. Proceed as SUITABLE.

    TWO OPEN DESIGN POINTS the wave must resolve (recommended defaults given; see interface_contracts
    arm entries and the pre_mortem):
    (a) Switch arm/reconvergence API and type signatures. RECOMMENDED DEFAULT (encoded in the Arm[M]
        contract below): a package-level When[M](pred func(M) bool, to Consumer[M]) Arm[M] and
        Else[M](to Consumer[M]) Arm[M], with Builder.Switch[M](over Producer[M], arms ...Arm[M]). Arms
        do NOT reconverge in rung-1: each arm terminates a path, and Build validates that every arm's
        target eventually produces Out. Reconvergence (a join after a branch) is deferred with Join2/Join3
        to a later wave. Wave 2 Agent B owns this and must confirm the signature at implementation start.
    (b) Sequential-vs-concurrent lowering. RECOMMENDED DEFAULT (and the substrate invariant REQUIRES
        it): branches lower to sequential journaled agent.Step calls. The Switch predicate is evaluated
        once, its chosen branch label is journaled as its own agent.Step (StepValue), and only the taken
        arm's steps execute. NO errgroup, NO goroutines, NO concurrent scheduler in plan. Wave 3
        Agent D owns Build/Run and must uphold this; the architecture/substrate test (Agent E) asserts
        plan introduces no new executor.
test_command: GOWORK=off go test -race -count=1 ./...
lint_command: GOWORK=off go vet ./...
