pre_mortem:
    overall_risk: medium
    rows:
        - scenario: |-
            Agent D introduces goroutines/errgroup to run Switch arms or steps "in parallel", creating a
            second execution model and violating the substrate invariant (the one thing the design forbids).
          likelihood: medium
          impact: high
          mitigation: |-
            Encoded as a hard constraint in Agent D's prompt and OPEN DESIGN POINT (b). Agent E's
            architecture_test.go scans plan source for errgroup/go func/make(chan)/WaitGroup and fails
            the build if present. Postcondition on D asserts zero concurrency primitives in build.go/flow.go.
        - scenario: |-
            Duplicate declaration at merge: two agents declare Flow, Build, Conform, or RenderMermaid, or
            Agent A puts a constructor in the scaffold. Same-package files, isolated worktrees cannot see
            each other, so it compiles in isolation and fails at merge.
          likelihood: medium
          impact: high
          mitigation: |-
            Strict single-owner rule per symbol, spelled out in each prompt: Flow type is Agent D only;
            Conform method is Agent E only (D explicitly disowns it); RenderMermaid logic is Agent C on
            builderCore, D adds the 1-line forwarder; constructors are Agent B only. Scaffold (A) declares
            ONLY the shared type surface. builderCore is declared once (spec.go, Agent A).
        - scenario: |-
            Agent B or D reaches into the frozen scaffold to add a field (e.g. Safety passthrough on node,
            or a name accessor) because the exact field it needs is missing, editing a file it does not own.
          likelihood: medium
          impact: medium
          mitigation: |-
            The scaffold (node, builderCore) is defined generously in spec.go including a run closure and
            room for Safety. Agent B's prompt explicitly says a missing field is a scaffold gap to REPORT,
            not patch, and gives a fallback (rung-1 Tool lowers to a plain Step with a documented
            follow-up). Handle exposes exported Name() so wiring extracts names without touching the scaffold.
        - scenario: |-
            Switch predicate is not pure (reads a clock/map), so a resumed run re-decides and routes
            differently, the exact non-deterministic-control-flow bug the project positions against.
          likelihood: low
          impact: high
          mitigation: |-
            Agent D journals the branch CHOICE as its own agent.Step (StepValue) and replays it on resume
            rather than re-evaluating (design doc requirement, postcondition greps for "switch:" step). The
            purity requirement is documented on When/Else and Switch. Conformance (Agent E) checks the
            journaled branch against the declared arms, catching a divergence.
        - scenario: |-
            The generic-method constructors (Step[I,O] on *Builder[In,Out]) do not compile on the toolchain,
            or the phantom marker methods do not make Handle satisfy Producer/Consumer as expected.
          likelihood: low
          impact: high
          mitigation: |-
            Go 1.27 is the workspace floor (go.mod: go 1.27; go.work: go 1.27.0) and generic methods on
            concrete generic types are legal there. Agent A's scaffold gate builds handle.go in isolation
            first, proving Handle[I,O] satisfies Producer[O]/Consumer[I] before any wiring depends on it.
            The design doc confirms the pattern is intended and legal.
        - scenario: |-
            Whole-graph validation (Build) is too weak (misses an unreachable step or a terminal path that
            does not produce Out), so an invalid flow builds and fails only at Run, undermining the
            build-time-validation value proposition of reification.
          likelihood: medium
          impact: medium
          mitigation: |-
            Build validation criteria are enumerated explicitly in Agent D's prompt (entry consumes In,
            every terminal path produces Out, unique names, reachability, one Else per Switch). build_test.go
            must cover each negative case (dup name, unreachable, In/Out mismatch). Errors name the offending
            step per the contract.
        - scenario: |-
            plan transitively drags an adapter into the core dependency graph (e.g. an agent
            constructor path pulls a store), breaking the existing core TestCoreHasNoAdapterImports.
          likelihood: low
          impact: medium
          mitigation: |-
            plan imports only the core agent primitives (agent.Durable, agent.Tool, agent.Step),
            which are ports, not adapters. Agent A's scaffold imports only stdlib. Agent E's
            architecture_test.go asserts plan's own dep graph has no adapter, and the post-merge
            checklist re-runs the core's TestCoreHasNoAdapterImports from the root.
        - scenario: |-
            Cross-file same-wave test compilation: Agent C's render_test.go or Agent B's builder_test.go
            constructs builderCore literals whose field set drifts from Agent A's scaffold, failing to
            compile after merge even though each passed in isolation.
          likelihood: low
          impact: medium
          mitigation: |-
            builderCore's exact field set is frozen in the scaffolds section and referenced by every agent.
            Tests build against the frozen shape. The post-merge full build (GOWORK=off go build ./...)
            catches any drift immediately; the risk is low because the scaffold is the single source of truth.
