interface_contracts:
    - name: Producer / Consumer / Handle
      description: |-
        The shared handle surface. Handle[I,O] satisfies Producer[O] and Consumer[I] via unexported
        phantom methods, so wiring calls unify the connecting type at compile time and only handles
        can be endpoints. Frozen in scaffold plan/handle.go (Wave 1). Do not redefine downstream.
      definition: |-
        type Producer[M any] interface{ producerMarker(M) }
        type Consumer[M any] interface{ consumerMarker(M) }
        type Handle[I, O any] struct { name string; b *builderCore }
        func (Handle[I, O]) producerMarker(O) {}
        func (Handle[I, O]) consumerMarker(I) {}
        func (h Handle[I, O]) Name() string
      location: plan/handle.go
    - name: New / Builder
      description: |-
        Entry constructor. New pins In and Out once so the flow boundary is checked at construction.
        Returns the concrete *Builder[In,Out] (generic methods on it are legal on Go 1.27). Builder
        wraps *builderCore. Owned by Agent B (Wave 2).
      definition: |-
        // New constructs a flow builder whose input is In and output is Out, both pinned here.
        // name is the flow's label (used by RenderMermaid and conformance). Later Build validates
        // the entry step consumes In and every terminal path produces Out.
        func New[In, Out any](name string) *Builder[In, Out]
        type Builder[In, Out any] struct { core *builderCore }
      location: plan/builder.go
    - name: Builder.Step / Builder.Tool / Builder.Model
      description: |-
        Generic-method constructors returning typed handles. Each string name is the durable
        agent.Do step key: it MUST be unique across the flow (validated: duplicate is recorded as a
        deferred error surfaced at Build, per builderCore.errs). Step and Tool infer I,O; Model
        restates I,O because a prompt string infers nothing. Each installs a type-erased node.run
        closure into the spec. Owned by Agent B (Wave 2).
      definition: |-
        // Step registers an arbitrary func(I)(O,error) as a durable step named name.
        // The func body is the escape hatch: a non-idempotent side effect inside it must
        // declare its own Safety or wrap its own agent.Do (documented; see design doc).
        func (b *Builder[In, Out]) Step[I, O any](name string, fn func(I) (O, error)) Handle[I, O]
        // Tool registers an agent.Tool as a durable step. Its Safety classification is carried
        // to the journal boundary by the lowering (Build). t is invoked with JSON-encoded I and
        // its result JSON-decoded to O.
        func (b *Builder[In, Out]) Tool[I, O any](name string, t agent.Tool) Handle[I, O]
        // Model registers a model call built from prompt. I is the input rendered into the prompt,
        // O is the structured result. I,O explicit (a prompt infers nothing). rung-1 lowers this to
        // a Step whose body is author-provided or a documented stub; see Agent B task for the exact
        // rung-1 model-call shape (recommended: accept a model via a Builder option, deferred if not).
        func (b *Builder[In, Out]) Model[I, O any](name, prompt string) Handle[I, O]
      location: plan/builder.go
    - name: Builder.Edge / Builder.Switch / Arm / When / Else
      description: |-
        Wiring. Edge[M] type-checks producer.Out == consumer.In at the call site (M unifies both).
        Switch[M] routes on a producer's output; arms are When (predicate) / Else (default). Arms do
        NOT reconverge in rung-1 (OPEN DESIGN POINT a, recommended default: each arm terminates a
        path that Build checks produces Out; reconvergence deferred with Join). Owned by Agent B
        (Wave 2). The predicate MUST be pure over the switched node's output (documented constraint;
        Build lowers the choice to its own journaled step so replay is deterministic).
      definition: |-
        // Edge connects a producer to a consumer, unifying the connecting type M at the call site.
        // A type mismatch does not compile; the error names the handles, not an erased list entry.
        func (b *Builder[In, Out]) Edge[M any](from Producer[M], to Consumer[M])
        // Arm is one branch of a Switch, produced by When or Else.
        type Arm[M any] struct { isElse bool; pred func(M) bool; target string }
        // When routes to `to` when pred(over.Out) is true. pred must be pure over the value.
        func When[M any](pred func(M) bool, to Consumer[M]) Arm[M]
        // Else routes to `to` when no When arm matched. At most one Else per Switch (Build validates).
        func Else[M any](to Consumer[M]) Arm[M]
        // Switch routes on over.Out to exactly one arm. The branch choice is journaled as its own
        // agent.Step at Build/Run time, so a resumed run replays the recorded branch (design doc).
        func (b *Builder[In, Out]) Switch[M any](over Producer[M], arms ...Arm[M])
      location: plan/wiring.go
    - name: Builder.Build / Flow / Flow.Run
      description: |-
        Build lowers the reified spec to journaled steps and validates whole-graph coherence:
        entry step consumes In, every terminal path produces Out, names unique, no unreachable step,
        at most one Else per Switch, Switch predicates typed to the switched output. Returns
        *Flow[In,Out] or an error naming the offending step. Flow.Run drives the lowered flow on the
        core runtime: each node -> agent.Step(ctx, store, runID, name, fn); each Switch choice ->
        its own agent.Step (StepValue) recording the chosen arm label; ONLY the taken arm executes;
        SEQUENTIAL, no goroutines/errgroup (OPEN DESIGN POINT b: substrate invariant, no new executor).
        Owned by Agent D (Wave 3).
      definition: |-
        func (b *Builder[In, Out]) Build() (*Flow[In, Out], error)
        type Flow[In, Out any] struct { core *builderCore /* frozen */ }
        // Run executes the lowered flow durably for runID against store, resuming from the journal
        // if steps already exist. In goes to the entry step; Out comes from the terminal step.
        // Same guarantees as plain agent.Step control flow (at-most-once, halt, resume).
        func (f *Flow[In, Out]) Run(ctx context.Context, store agent.Durable, runID string, in In) (Out, error)
      location: plan/flow.go
    - name: RenderMermaid (declaration-derived)
      description: |-
        Renders the AUTHORED topology from the reified *Flow value (contrast agent.RenderMermaid,
        which renders the ACTUAL path from the journal). Walks builderCore.nodes/edges/branches,
        labels each node by its journal key and I,O types. Pure, no runtime, no store. Owned by
        Agent C (Wave 2). Signature is a method on Flow to access the frozen spec.
      definition: |-
        // RenderMermaid returns a Mermaid flowchart of the DECLARED topology (the reified value),
        // each node labelled by its journal key and its I,O types. This is the authored diagram;
        // agent.RenderMermaid derives the actual-ran diagram from the journal, and conformance
        // compares them.
        func (f *Flow[In, Out]) RenderMermaid() string
      location: plan/render.go
    - name: Conformance (declared vs journal-derived path)
      description: |-
        Compares the declared topology (from the *Flow) against the actual path derived from the
        journal for a runID, at step-visitation granularity and, because the branch choice is
        journaled, against the declared routing. Returns whether the run followed the declared graph
        or where it diverged. Owned by Agent E (Wave 3). Reads history via agent.Durable.History.
      definition: |-
        // Conform checks the journaled path for runID against f's declared topology. ok is true iff
        // every journaled step name maps to a declared node and the journaled Switch choices are
        // reachable arms. diffs lists divergences (unexpected step, unreachable arm taken) by name.
        func (f *Flow[In, Out]) Conform(ctx context.Context, store agent.Durable, runID string) (ok bool, diffs []string, err error)
      location: plan/conformance.go
waves:
    - number: 1
      agents:
        - id: A
          task: |-
            Create the plan package's shared type surface and internal spec model. These are the
            scaffolds every downstream agent compiles against, so correctness and exact signatures
            matter more than behavior; most methods here are phantom/marker or plain accessors.

            Files you own (create all three):
            - plan/handle.go  -- Producer[M], Consumer[M], Handle[I,O] (see scaffold spec)
            - plan/spec.go     -- internal IR: nodeKind, node, edge, arm, branch, builderCore,
                                       and helper typeOf[T]() reflect.Type (see scaffold spec)
            - plan/doc.go      -- package doc comment for `package plan`

            Implement EXACTLY the signatures in the scaffolds section for handle.go and spec.go. Key
            points:
            - Producer[M] and Consumer[M] are interfaces with a single UNEXPORTED marker method
              (producerMarker(M) / consumerMarker(M)). Handle[I,O] implements both. Because the method
              is unexported, only types in this package can be producers/consumers. This is the phantom
              method: it has an empty body and carries no runtime behavior.
            - Handle[I,O] carries `name string` and `b *builderCore`. Add exported `Name() string`.
            - builderCore is fully DECLARED in spec.go (not handle.go) to avoid a duplicate declaration.
              handle.go only references *builderCore in the Handle struct field.
            - Capture types with reflect.TypeFor via `func typeOf[T any]() reflect.Type { return reflect.TypeFor[T]() }`.
            - doc.go: write a package doc comment on `package plan` explaining this is rung-1 of the
              expression-surfaces stack: a handle-based flow builder that lowers to the journal-backed
              runtime and adds NO new executor. Reference docs/design/expression-surfaces.md. Every
              exported symbol across all your files gets a doc comment. No em dashes. Never the word
              "honest".

            The package imports ONLY the standard library here (context, reflect). Do NOT import the
            core agent package in these three files (the constructors in Wave 2 import agent; the type
            surface itself does not need to). This keeps the scaffold buildable in isolation.

            ### Verification gate
            - GOWORK=off go build ./plan/...   (must compile as a standalone package)
            - GOWORK=off go vet ./plan/...
            - gofmt -l plan  (must print nothing)
            - Postconditions:
              - grep -c "producerMarker\|consumerMarker" plan/handle.go  # expect >= 4 (2 defs on interfaces, 2 methods on Handle)
              - grep -c "type builderCore struct" plan/spec.go            # expect 1
              - grep -rn "errgroup\|go func\|goroutine" plan/             # expect 0 (no concurrency in the type layer)

            ### Constraints
            - Do NOT declare Builder, Flow, New, Step/Tool/Model, Edge/Switch, Arm, When/Else, or Build
              in these files. Those are owned by Agents B and D. Declaring them here causes duplicate
              declarations at merge.
            - Do NOT import github.com/dayna/go-agents (the core agent package) in the scaffold files.
            - Do NOT modify any file outside your ownership list.
          files:
            - plan/handle.go
            - plan/spec.go
            - plan/doc.go
          context_source: prepared-brief
    - number: 2
      agents:
        - id: B
          task: |-
            Implement the authoring surface: the New constructor, the generic-method constructors on
            Builder (Step/Tool/Model), and the wiring calls (Edge/Switch with When/Else arms). You
            compile against the frozen scaffolds handle.go and spec.go (Agent A, Wave 1). Do not modify
            them; if you need a field they do not expose, that is a scaffold gap to report, not to patch.

            Files you own:
            - plan/builder.go  -- New, Builder[In,Out], Step, Tool, Model
            - plan/wiring.go   -- Edge, Arm, When, Else, Switch
            - plan/builder_test.go -- unit tests for construction, name-uniqueness, type unification

            Implement EXACTLY the signatures in interface_contracts (New/Builder, Step/Tool/Model,
            Edge/Switch/Arm/When/Else). Key requirements:
            - New[In,Out](name) pins inType=typeOf[In](), outType=typeOf[Out]() into a fresh builderCore
              and returns *Builder[In,Out]. The FIRST constructor call sets core.entry to that node's name.
            - Each constructor (Step/Tool/Model) appends a *node with kind, inType=typeOf[I](),
              outType=typeOf[O](), and a type-erased run closure. It MUST check name uniqueness against
              core.byName; a duplicate name appends an error to core.errs (surfaced at Build) rather than
              panicking. Return Handle[I,O]{name: name, b: core}.
            - Step's run closure: decode `in any` as I, call fn, return (O, error) boxed as any. Tool's
              run: JSON-encode the I input, call agent.Tool.Call, JSON-decode the result to O; carry the
              tool's Safety() so Build can lower it correctly (store the agent.Tool on the node or a
              closure that preserves it -- coordinate the exact field with Agent D via the node.run
              contract: node.run returns (any, error) and Build wraps it in agent.Step, so Safety
              handling that needs a raw agent.Do wrap should be expressed by the node exposing its Safety;
              add an optional `safety agent.Safety` field to node IF spec.go already has room -- if not,
              keep rung-1 Tool lowering as a plain Step and note the Safety-passthrough as a follow-up in
              a code comment). Model's rung-1 shape: OPEN DESIGN POINT -- recommended default is that
              Model requires a model to be supplied on the Builder (add a WithModel option) OR lowers to
              a Step whose body returns an error "Model requires a bound model (rung-1 stub)"; pick the
              WithModel option if it is <30 min, else the documented stub. Document the choice.
            - Edge[M]: append edge{from: from.(Handle).Name via a small internal accessor, to: to....}.
              Since Producer[M]/Consumer[M] are satisfied only by Handle, use a type switch or add an
              unexported interface method to extract the name. RECOMMENDED: add an unexported method
              `nodeName() string` to Handle in... NO -- handle.go is frozen. Instead: Handle already
              exposes Name(); define unexported package interfaces `producerNamed interface{ Producer[M]; ... }`
              is not expressible generically. Simplest correct approach: since only Handle implements the
              markers, and Handle.Name() is exported, wire via a helper that type-asserts the Producer to
              an interface{ Name() string }. Add that tiny interface in wiring.go. Edge records names only.
            - When[M]/Else[M] build Arm[M] carrying the typed predicate and the target's name (extract
              via the same Name() accessor). Switch[M] appends a branch{over, arms} to core.branches,
              type-erasing each arm's predicate into func(any)bool at this boundary.
            - OPEN DESIGN POINT (a): confirm the Arm/When/Else signatures above at the start of your
              work. If you diverge from the recommended default (e.g. you want reconvergence), STOP and
              flag it; reconvergence is deferred to a later wave and would break Agent D's Build.

            Tests (builder_test.go): construct a small flow (Step -> Tool -> Switch(When/Else)); assert
            handles carry the right names; assert a duplicate name is recorded in core.errs; assert
            Edge type-checks (this is a compile-time property, so include a comment-documented negative
            case that you verified does not compile, plus positive wiring that does).

            ### Verification gate
            - GOWORK=off go build ./plan/...
            - GOWORK=off go vet ./plan/...
            - GOWORK=off go test -race -count=1 ./plan/... -run 'TestBuilder|TestWiring'
            - gofmt -l plan  (must print nothing)
            - Postconditions:
              - grep -c "func New\[" plan/builder.go                 # expect 1
              - grep -c "func (b \*Builder" plan/builder.go plan/wiring.go  # expect >= 5 (Step,Tool,Model,Edge,Switch)
              - grep -rn "errgroup\|go func" plan/builder.go plan/wiring.go  # expect 0

            ### Constraints
            - Do NOT modify plan/handle.go or plan/spec.go (frozen scaffolds owned by Agent A).
            - Do NOT implement Build, Flow, or Flow.Run (Agent D, Wave 3). Constructors record spec only.
            - Do NOT introduce any goroutine, errgroup, channel, or scheduler. Construction is pure.
            - Do NOT add stub definitions for Flow or Build to make your file compile; your files must
              compile without them (they only exist after Wave 3, which is fine).
            - No em dashes in code or comments. Never the word "honest". Doc-comment every exported symbol.
          files:
            - plan/builder.go
            - plan/wiring.go
            - plan/builder_test.go
          dependencies:
            - A
        - id: C
          task: |-
            Implement declaration-derived Mermaid rendering: walk the reified spec (*Flow's frozen
            builderCore) and emit a Mermaid flowchart labelled by each node's journal key and its I,O
            types. This is the AUTHORED diagram; contrast agent.RenderMermaid (render.go in the core),
            which derives the ACTUAL-ran diagram from the journal. Read the core render.go for the
            Mermaid string format to stay consistent (flowchart TD, node[label], prev --> id).

            Files you own:
            - plan/render.go       -- Flow[In,Out].RenderMermaid() string (see contract)
            - plan/render_test.go  -- golden-ish assertions on the emitted Mermaid

            IMPORTANT dependency note: RenderMermaid is a method on Flow[In,Out], but Flow is defined by
            Agent D in Wave 3 (plan/flow.go), which runs AFTER you. To keep waves clean, you have
            two options; pick option 2:
            1. (rejected) define Flow yourself -- would collide with Agent D.
            2. (use this) Implement RenderMermaid as a method on the internal *builderCore in render.go
               with signature `func (c *builderCore) renderMermaid() string`, fully tested against
               builderCore values you construct directly in render_test.go (you own builderCore's package,
               you can build one). Agent D's Flow.RenderMermaid() will be a one-line forwarder to
               c.renderMermaid(). Document this split in a code comment so Agent D wires it. This keeps
               your file free of any dependency on Flow and testable in isolation in Wave 2.

            Render requirements:
            - Header: "flowchart TD\n" then a start node for the entry.
            - One Mermaid node per builderCore.node, labelled `name : InType -> OutType` using the
              captured reflect.Type names (use .String()). A kindSwitch node renders as a diamond/branch.
            - Emit edges from builderCore.edges. For branches, emit an edge from the switched node to
              each arm target, labelled with the arm (When/Else). Because handles express branches, the
              output is a real DAG shape, not just a linear chain.
            - Pure function: no context, no store, no I/O. Deterministic output (iterate nodes/edges in
              insertion order, not map order).

            Tests: build a builderCore with 3-4 nodes and a branch directly (call the unexported
            constructors is not available to you cleanly since Agent B owns them -- instead construct
            the builderCore struct literal in the test, appending *node and branch values; you are in
            the same package). Assert the emitted string contains each node label and each edge, and that
            output is stable across two calls.

            ### Verification gate
            - GOWORK=off go build ./plan/...
            - GOWORK=off go vet ./plan/...
            - GOWORK=off go test -race -count=1 ./plan/... -run 'TestRender'
            - gofmt -l plan  (must print nothing)
            - Postconditions:
              - grep -c "flowchart TD" plan/render.go   # expect 1
              - grep -c "func (c \*builderCore) renderMermaid" plan/render.go  # expect 1
              - grep -rn "context.Context\|Durable\|History" plan/render.go    # expect 0 (declaration-derived, no journal)

            ### Constraints
            - Do NOT define Flow, Build, or any constructor (Agents B and D own those).
            - Do NOT read the journal or take a Durable; this renders the DECLARATION, not the run.
            - Do NOT use Go map iteration for output order; use the insertion-ordered slices in builderCore.
            - No em dashes. Never the word "honest". Doc-comment exported symbols.
          files:
            - plan/render.go
            - plan/render_test.go
          dependencies:
            - A
      base_commit: 642a33a2e3637e22ff955429a442686a62f8e8b1
    - number: 3
      agents:
        - id: D
          task: |-
            Implement the backend: Build (lowering + whole-graph validation) and Flow with Run that
            drives the lowered flow on the core journal-backed runtime. This is the load-bearing agent;
            it upholds the substrate invariant (NO new executor). You compile against handle.go, spec.go
            (Agent A) and builder.go, wiring.go (Agent B, merged in Wave 2).

            Read first: agent.go (the ~40-line loop, note it is NOT what you drive here), store.go
            (agent.Step[T], agent.Durable, agent.Record, StepValue), pause.go (for the resume model),
            dst_test.go (the crash-sweep pattern you will mirror). You lower to agent.Step, not to the
            Agent loop: a flow is plain Go control flow over agent.Step calls, exactly like the rung-0
            example in docs/design/expression-surfaces.md section "A. Plain Go (rung 0)".

            Files you own:
            - plan/build.go        -- Builder.Build() (*Flow[In,Out], error): validation + freeze
            - plan/flow.go         -- Flow[In,Out], Flow.Run, Flow.RenderMermaid (1-line forwarder
                                           to c.renderMermaid from Agent C), Flow accessor for conformance
            - plan/build_test.go   -- unit tests for validation (dup name, unreachable, In/Out coherence)
            - plan/flow_dst_test.go-- crash/DST test proving resume + at-most-once

            Build requirements (whole-graph coherence, errors name the step):
            - Drain core.errs first (duplicate names etc. recorded during construction).
            - entry node's inType == core.inType (entry consumes In). Error names entry.
            - Every terminal path's last node outType == core.outType (produces Out). A terminal node is
              one with no outgoing edge and not a Switch-over source. Every Switch arm target must lead to
              a terminal producing Out. Error names the offending step.
            - Names unique (already from errs, re-assert).
            - No unreachable step: every node reachable from entry via edges/branches. Error names the
              orphan.
            - At most one Else per Switch; Switch predicate typed to the switched node's outType.
            - On success, freeze the spec into *Flow[In,Out] (copy or seal core so post-Build mutation is
              impossible) and return it.

            Flow.Run requirements (THE substrate invariant, OPEN DESIGN POINT b -- sequential, no executor):
            - Walk the topology from entry. For each node, call:
                out, err := agent.Step(ctx, store, runID, node.name, func(context.Context)(O, error){
                   return node.run(ctx, currentInput) ...decode... })
              Actually node.run returns (any, error); use agent.Step with a concrete typed closure OR use
              store.Do directly with StepValue and JSON. Simplest correct: since node.run is type-erased,
              drive via store.Do recording Record{Kind: StepValue, Result: json(out)}, mirroring how
              agent.Step works internally (see store.go Step[T]). Each node is at-most-once by name.
            - At a Switch: evaluate the predicate ONCE over the switched node's journaled output, then
              journal the chosen arm label as its OWN durable step (store.Do, name e.g. "switch:"+over,
              Kind StepValue, Result = chosen target name). On resume, read the recorded branch and replay
              it rather than re-deciding (this is why the predicate must be pure -- documented). Execute
              ONLY the taken arm's downstream path.
            - STRICTLY SEQUENTIAL. NO goroutine, NO errgroup, NO channel, NO concurrent scheduler in
              plan. If real parallelism is ever needed it is expressed as concurrent agent.Do steps
              by the runtime, not here (design doc). Agent E's architecture test will fail the build if
              you introduce a scheduler.
            - Run resumes from the journal: an existing step returns its recorded value without re-running
              (inherited from agent.Step / store.Do memoization). In goes to entry, Out returned from the
              terminal step.

            flow_dst_test.go: mirror dst_test.go. Build a flow whose entry Step performs a NON-idempotent
            side effect (increment a counter), wire it through a Switch, run it against a crashStore-style
            wrapper (you can reuse the pattern: a Durable that fails to persist the Kth write), sweep the
            crash point, and assert the side effect fires AT MOST ONCE across crash+resume and the run
            ends completed or halted. Also assert a plain resume (no crash) reuses journaled steps
            (at-most-once: counter == 1 after a re-run with the same runID).

            ### Verification gate
            - GOWORK=off go build ./plan/...
            - GOWORK=off go vet ./plan/...
            - GOWORK=off go test -race -count=1 ./plan/... -run 'TestBuild|TestFlow|TestDST'
            - gofmt -l plan  (must print nothing)
            - Postconditions:
              - grep -c "func (b \*Builder\[In, Out\]) Build" plan/build.go   # expect 1
              - grep -c "func (f \*Flow\[In, Out\]) Run" plan/flow.go          # expect 1
              - grep -rn "errgroup\|go func\|make(chan\|sync.WaitGroup" plan/build.go plan/flow.go  # expect 0 (NO new executor)
              - grep -c "store.Do\|agent.Step" plan/flow.go                    # expect >= 1 (lowers to the journal)
              - grep -c "switch:" plan/flow.go                                 # expect >= 1 (branch choice journaled as its own step)

            ### Constraints
            - Do NOT modify handle.go, spec.go, builder.go, or wiring.go (owned by A and B).
            - Do NOT introduce ANY concurrency primitive (goroutine, errgroup, channel, WaitGroup,
              Mutex-guarded scheduler). Branches lower to SEQUENTIAL journaled steps. This is the
              substrate invariant and is checked by Agent E's architecture test. If you feel you need
              concurrency, STOP and flag it as a design deviation.
            - Do NOT define a new Durable, a new store, or any alternate execution/durability model.
              You drive the EXISTING agent.Durable via store.Do / agent.Step only.
            - Do NOT re-decide a Switch on resume; replay the journaled branch.
            - Do NOT declare Conform (Agent E owns it). Do NOT declare renderMermaid logic (Agent C owns
              it); you only add the one-line Flow.RenderMermaid forwarder to c.renderMermaid.
            - No em dashes. Never the word "honest". Doc-comment every exported symbol.
          files:
            - plan/build.go
            - plan/flow.go
            - plan/build_test.go
            - plan/flow_dst_test.go
          dependencies:
            - A
            - B
          context_source: prepared-brief
    - number: 4
      agents:
        - id: E
          task: |-
            Implement the conformance surface and the architecture/substrate guard. Conformance compares
            the DECLARED topology (from the *Flow) against the ACTUAL path derived from the journal for a
            runID -- the accountability property from docs/design/expression-surfaces.md: prove the run
            followed the declared graph, or flag where it diverged. The architecture test locks the
            substrate invariant: plan introduces NO new executor and imports NO adapter.

            Files you own:
            - plan/conformance.go       -- Flow[In,Out].Conform (see contract)
            - plan/conformance_test.go  -- smoke test comparing declared topology to journal-derived path
            - plan/architecture_test.go -- substrate + import guards for the plan package

            Conform requirements:
            - Read the journal via store.History(ctx, runID) (agent.Durable.History).
            - Map each journaled StepValue/StepModel/StepToolResult name back to a declared node in the
              frozen spec. A journaled step name with no declared node is a divergence (unexpected step).
            - For each journaled "switch:"+over step, read the recorded chosen arm and assert it is a
              declared arm of that Switch (an unreachable/undeclared arm taken is a divergence).
            - ok is true iff no divergences. diffs lists each divergence by name. Do NOT panic on a
              partial/in-flight journal; report what is observable.
            - The blind spot (documented in a comment): conformance sees THAT a Step ran, not what the
              arbitrary Go inside it did.

            IMPORTANT dependency: Conform is a method on Flow[In,Out] (the Flow type is defined by Agent D
            in flow.go, merged in Wave 3 before your Wave 4 runs). To keep a single owner per symbol, implement
            Conform's LOGIC against the internal *builderCore with an unexported
            `func (c *builderCore) conform(ctx context.Context, store agent.Durable, runID string) (bool, []string, error)`,
            and declare the exported forwarder `func (f *Flow[In, Out]) Conform(...)` in YOUR file
            conformance.go (methods can live in any file of the package; Agent D's task explicitly does
            NOT declare Conform, so there is no collision). Your conformance.go declares BOTH c.conform
            and the exported Flow.Conform forwarder.

            architecture_test.go requirements (package plan, external or internal test):
            - Assert `go list -deps github.com/dayna/go-agents/plan` does NOT contain any adapter
              path: dayna/go-agents/model/, dayna/go-agents/store/, dayna/go-agents/trace,
              dayna/go-agents/middleware, dayna/go-agents/govern. Mirror the core's
              architecture_test.go (read it: /Users/dayna/code/go-agents/architecture_test.go). plan
              importing the core (github.com/dayna/go-agents) is ALLOWED; pulling adapters transitively is
              NOT. Also forbid the heavy infra list (opentelemetry, modernc.org/sqlite, jackc/pgx,
              temporal, weaviate, blackwell-systems/gsm). Skip the test (t.Skipf) if `go list` is
              unavailable, exactly as the core test does.
            - Assert plan introduces NO new executor: scan the plan package source (excluding
              _test.go) for concurrency primitives that would constitute a second execution model
              (errgroup, "go func", "make(chan", "sync.WaitGroup") and fail if found. Use os.ReadDir plus
              reading .go files. IMPORTANT: match only real CODE, not comments or string literals. Strip
              Go comments before scanning (parse each file with go/parser + go/token and walk tokens, or
              use a comment stripper) so documentation prose that names these tokens does not trip the
              guard. This matters concretely: plan/doc.go line 14 states the package runs "with no
              goroutines or errgroup", which is prose, not code, and MUST NOT fail the test. A naive
              grep over raw file bytes would give a false positive here. This is the machine-checkable
              form of the substrate invariant. Document that concurrent agent.Do in the CORE runtime is
              fine; a scheduler IN plan is not.

            conformance_test.go: build a small flow, Run it against a MemStore to produce a journal, then
            call Conform and assert ok == true and diffs is empty for a clean run. Add a negative case:
            hand-craft a journal (via store.Do) containing a step name NOT in the declared topology and
            assert Conform reports it as a divergence.

            ### Verification gate
            - GOWORK=off go build ./plan/...
            - GOWORK=off go vet ./plan/...
            - GOWORK=off go test -race -count=1 ./plan/... -run 'TestConform|TestArchitecture|TestPlanNoAdapter|TestNoNewExecutor'
            - gofmt -l plan  (must print nothing)
            - Postconditions:
              - grep -c "func (f \*Flow\[In, Out\]) Conform" plan/conformance.go   # expect 1
              - grep -c "go list -deps" plan/architecture_test.go                   # expect 1
              - grep -rn "errgroup\|go func" plan/conformance.go                    # expect 0

            ### Constraints
            - Do NOT declare Flow, Build, Run, or RenderMermaid (Agents C and D own those). You declare
              ONLY Conform (exported forwarder + unexported c.conform) and the architecture tests.
            - Do NOT weaken the architecture guard to make a failing import pass; if plan genuinely
              needs an adapter, that is a design violation to flag, not to allow-list.
            - Do NOT introduce concurrency in conformance.go (it is a pure read of the journal).
            - No em dashes. Never the word "honest". Doc-comment exported symbols.
          files:
            - plan/conformance.go
            - plan/conformance_test.go
            - plan/architecture_test.go
          dependencies:
            - A
            - D
          context_source: prepared-brief
