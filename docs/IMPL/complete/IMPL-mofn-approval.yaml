title: m-of-n human approval
feature_slug: mofn-approval
verdict: SUITABLE
suitability_assessment: |-
    Decomposes cleanly into disjoint file ownership across three sequential waves.
    All five suitability questions resolve.

    1. File decomposition: the feature touches five distinct source files
       (agent/tool.go, agent/store.go, agent/agent.go, audit/evidence.go +
       one new audit file, plan/config.go) plus test files. No two implementation
       tasks require conflicting edits to the same file once the shared additive
       work in agent/tool.go and agent/store.go lands in wave 1. >=2 agents with
       disjoint ownership is achievable.

    2. Investigation-first items: none. The design doc is a settled spec; there is
       no crash to root-cause or race to reproduce. Two open points needed
       resolution during scouting and are now resolved (see below), so no
       investigation blocks implementation.

    3. Interface discoverability: all cross-agent interfaces are definable up
       front. The tally types, ApproveAs signature, the ApproverVerifier hook,
       the canonical signing-bytes function, and the new audit prover are all
       specified in interface_contracts. Agents implement against them without
       seeing each other's code.

    4. Pre-implementation status check: none of this exists yet. Safety has no
       Approval field, store.go has only the 1-of-1 Approve, agent.go gates only
       on RequiresApproval, audit has no approval-decision prover, plan/config.go
       has no approval block. All items are TODO. The 1-of-1 denied-tool-result
       path DOES already exist (agent/agent.go:376-387) and is reused verbatim.

    5. Parallelization value: the go test cycle for this repo runs per-module and
       with -race in CI (well over 30s), each agent runs it independently, and the
       wave-2 agents (gate, audit, config) are fully independent of each other.
       Files per agent land in the 2-4 range. High parallelization value.

    RESOLVED OPEN POINTS (were bracketed at scout start):

    A. Which signing API to reuse, and where approver keys are looked up.
       The signing machinery is audit.Signer/audit.Verifier (signing.go): a
       scheme-agnostic pair (Ed25519/ML-DSA/hybrid) where Sign(message []byte)
       and Verify(message, sig []byte) bool operate over canonical bytes. Grants
       sign SignGrant(g, Signer) over g.Bytes(); verification resolves a Verifier
       by principal via the issuerVerifier func(issuer string)(Verifier,bool)
       lookup pattern in VerifyDelegationChain (grant.go:144). THERE IS NO
       centralized key registry: the caller supplies verifier lookup from its own
       PKI. Approver decisions reuse exactly this pattern.

       CRITICAL IMPORT CONSTRAINT: audit imports agent; agent does NOT import
       audit (verified). Therefore agent/agent.go and agent/store.go CANNOT call
       audit.Verify directly without creating an import cycle. Resolution: agent
       defines a minimal local hook interface ApproverVerifier { Verify(message,
       sig []byte) bool } that audit.Ed25519Verifier / MLDSAVerifier /
       HybridVerifier already satisfy structurally (their Verify(message, sig
       []byte) bool method matches). The deployment supplies a resolver
       func(approverID string)(ApproverVerifier, bool) via a run option; the gate
       verifies each decision's signature over the canonical bytes with it. This
       reuses the SAME signature schemes and the SAME resolver-by-principal shape
       as grants, with zero new cryptography and no import cycle. Approvers sign
       with any audit.Signer; the caller wires audit verifiers into the resolver.

    B. Denied-tool-result path for 1-of-1: it ALREADY EXISTS in agent/agent.go
       (the `const denied = "tool call denied by human"` block at lines 376-387).
       The m-of-n deny branch feeds the model the identical denied tool-result,
       so no new denial-result plumbing is added; the gate branch reuses it.
test_command: GOWORK=off go test ./...
lint_command: GOWORK=off go vet ./...
