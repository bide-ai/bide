interface_contracts:
    - name: ApprovalPolicy
      description: |-
        Declares a k-of-n human gate over a bounded, named approver set.
        Owned by Agent A in agent/tool.go. nil Safety.Approval keeps exact 1-of-1
        behavior (backward compatible).
      definition: |
        // ApprovalPolicy declares a k-of-n human gate. Need is k; the eligible
        // approvers are the bounded set (n = len(Approvers)). A tool with a
        // non-nil Approval requires approval whether or not RequiresApproval is
        // also set.
        type ApprovalPolicy struct {
            Need      int      // decisions required to proceed (k), 1 <= Need <= len(Approvers)
            Approvers []string // eligible approver ids; the bounded set (n)
        }

        // Safety gains one optional field:
        //   Approval *ApprovalPolicy
        // The gate predicate becomes: RequiresApproval || Approval != nil
      location: agent/tool.go
    - name: ApproveAs
      description: |-
        Records one named approver's decision, idempotent per
        (runID, toolUseID, approverID) via step key
        "approval:"+toolUseID+":"+approverID. Owned by Agent B in agent/store.go.
        Existing Approve stays UNCHANGED for the 1-of-1 path.
      definition: |
        // ApproveAs records one named approver's decision for a tool call,
        // idempotent per (runID, toolUseID, approverID). sig is the approver's
        // signature over the canonical decision bytes; the gate verifies it
        // against the approver's registered verifier and ignores unverifiable or
        // ineligible decisions in the tally. After enough decisions land, re-run
        // with the same runID.
        func ApproveAs(ctx context.Context, d Durable, runID, toolUseID, approverID string, approved bool, sig []byte) error

        // Record gains two fields (additive, omitempty), set on the StepApproval
        // record ApproveAs writes:
        //   Approver  string `json:"approver,omitempty"`
        //   Signature []byte `json:"signature,omitempty"`
      location: agent/store.go
    - name: ApprovalTally
      description: |-
        The k-of-n running tally. Owned by Agent B in agent/store.go. Carried on
        PendingApproval and journaled as its own durable step by the gate (Agent C).
      definition: |
        type ApprovalTally struct {
            Need     int      // k
            Approved int      // distinct eligible approvals recorded so far
            Denied   int      // distinct eligible denials recorded so far
            Pending  []string // eligible approvers who have not yet decided
        }

        // PendingApproval gains one optional field:
        //   Quorum *ApprovalTally // non-nil for an m-of-n gate: running tally at pause
      location: agent/store.go
    - name: ApproverVerifier
      description: |-
        Minimal signature-verification hook DEFINED IN PACKAGE agent so the gate
        can verify approver signatures WITHOUT importing audit (audit imports
        agent; the reverse would be a cycle). audit.Ed25519Verifier,
        audit.MLDSAVerifier, and audit.HybridVerifier already satisfy this
        interface structurally (their Verify(message, sig []byte) bool matches).
        Owned by Agent B in agent/store.go.
      definition: |
        // ApproverVerifier checks an approver's signature over the canonical
        // decision bytes. Any audit.Verifier satisfies it structurally, so a
        // deployment reuses the existing ed25519/ML-DSA/hybrid verifiers with no
        // new cryptography and no agent->audit import.
        type ApproverVerifier interface {
            Verify(message, sig []byte) bool
        }

        // ApproverVerifierFor resolves the verifier for an approver id (the
        // caller's PKI, mirroring audit's issuerVerifier lookup). Reports ok=false
        // for an unknown approver; the gate treats such decisions as unverifiable
        // and ignores them in the tally.
        type ApproverVerifierFor func(approverID string) (ApproverVerifier, bool)
      location: agent/store.go
    - name: ApprovalDecisionBytes
      description: |-
        Canonical, domain-separated byte encoding of a decision that both the
        approver signs and the gate verifies over. Owned by Agent B in
        agent/store.go so both ApproveAs callers (out of band) and the gate use
        one definition. Deterministic across replays.
      definition: |
        // ApprovalDecisionBytes returns the canonical, domain-separated bytes an
        // approver signs and the gate verifies: a version tag plus
        // (runID, toolUseID, approverID, approved). Deterministic and stable
        // across replays. Approvers produce sig = signer.Sign(
        // ApprovalDecisionBytes(runID, toolUseID, approverID, approved)).
        func ApprovalDecisionBytes(runID, toolUseID, approverID string, approved bool) []byte
      location: agent/store.go
    - name: tallyApprovals
      description: |-
        Pure, deterministic tally over journaled decisions for one toolUseID:
        keep eligible + valid-signature, dedupe by approver (first wins), count.
        Owned by Agent B in agent/store.go (unexported helper) so the gate
        (Agent C) and unit tests share ONE implementation. Reuses only the
        count>=k semantics of govern.tally; does NOT call govern.Quorum.
      definition: |
        // tallyApprovals computes the deterministic k-of-n tally from a run's
        // journaled StepApproval records for toolUseID, given the policy and a
        // verifier resolver. It keeps only decisions from eligible approvers whose
        // signature verifies, dedupes by approver (first decision in journal order
        // wins), and reports counts. Pure and order-stable across replays.
        //
        // Signature (unexported, package agent):
        //   func tallyApprovals(recs []Record, runID, toolUseID string,
        //       policy *ApprovalPolicy, verifierFor ApproverVerifierFor) ApprovalTally
      location: agent/store.go
    - name: WithApproverVerifiers
      description: |-
        Run option that wires the approver-verifier resolver into an Agent so the
        m-of-n gate can verify signatures. Owned by Agent C (gate) in
        agent/agent.go. BRACKETED: the exact option surface (functional option on
        the Agent constructor vs. a field) must match the existing option style in
        agent/agent.go; Agent C confirms the existing New/Option pattern before
        finalizing the name and shape. If no resolver is configured, an m-of-n
        gated tool with a non-nil Approval must error clearly rather than silently
        count zero eligible decisions.
      definition: |
        // WithApproverVerifiers configures how the m-of-n gate resolves an
        // approver id to the verifier for its signature. Required whenever any
        // tool carries a non-nil Safety.Approval.
        //   func WithApproverVerifiers(fn ApproverVerifierFor) Option
        // (exact Option type name to match agent/agent.go's existing option style)
      location: agent/agent.go
    - name: ProveApproval
      description: |-
        New audit prover that proves one approver-decision record (a StepApproval,
        NOT a StepValue, so ProveStep cannot find it) is included under an STH.
        Owned by Agent D in audit/approval.go. Needed because the k-of-n evidence
        bundle must include Need distinct signed eligible approver-decision
        inclusion proofs.
      definition: |
        // ProveApproval builds a ProofBundle proving the approver-decision record
        // keyed "approval:"+toolUseID+":"+approverID (a StepApproval) is committed
        // in the tree sth signs. Resolves the record by its step name and delegates
        // to ProveRecord. Fan-in counterpart to ProveToolCall for approvals.
        func ProveApproval(ctx context.Context, store agent.Durable, runID, toolUseID, approverID string, sth SignedTreeHead) (ProofBundle, error)
      location: audit/approval.go
waves:
    - number: 1
      agents:
        - id: A
          task: |
            Add the m-of-n approval POLICY type to the tool safety surface.
            Pure additive change to agent/tool.go; the existing 1-of-1 behavior
            must stay byte-for-byte unchanged when Safety.Approval is nil.

            What to implement (in agent/tool.go):
            1. Add a new field to the Safety struct, after RequiresApproval:

                 // Approval, when non-nil, upgrades the approval gate from one
                 // decision to an m-of-n human gate over a bounded, named set of
                 // approvers. nil = the existing 1-of-1 RequiresApproval behavior.
                 Approval *ApprovalPolicy

            2. Add the ApprovalPolicy type (see interface_contracts: ApprovalPolicy),
               with the Need and Approvers fields and the documented comment.

            Do NOT change Safety.retriableOnResume, Func, funcTool, or any other
            symbol. Do NOT wire the gate here (that is Agent C). Do NOT add
            validation of Need vs len(Approvers) here; the gate and config lowering
            own validation.

            Interfaces: implement exactly the ApprovalPolicy definition in
            interface_contracts.

            Verification gate:
              gofmt -l agent/tool.go   # expect empty
              GOWORK=off go build ./agent/...
              GOWORK=off go vet ./agent/...
            Postconditions:
              grep -c 'Approval \*ApprovalPolicy' agent/tool.go   # expect 1
              grep -c 'type ApprovalPolicy struct' agent/tool.go  # expect 1

            ### Constraints
            - Do NOT modify files outside agent/tool.go.
            - Do NOT define ApprovalTally, ApproveAs, or the verifier interface;
              those are Agent B's (agent/store.go).
            - Do NOT touch the gate logic in agent/agent.go.
            - Use the go1.27 toolchain: export PATH="$(go env GOROOT)/bin:$PATH"
              and set GOWORK=off for all build/test commands.
          files:
            - agent/tool.go
        - id: B
          task: |
            Add the m-of-n COLLECTION + VERIFICATION surface to agent/store.go:
            per-approver decision recording, the tally types, the canonical
            signing bytes, the verifier hook, and the pure tally helper. The
            existing 1-of-1 Approve must stay byte-for-byte unchanged.

            What to implement (all in agent/store.go):

            1. Record fields (additive, both omitempty), set by ApproveAs on the
               StepApproval record it writes. Add after the existing Approved field
               in the Record struct:
                 Approver  string `json:"approver,omitempty"`
                 Signature []byte `json:"signature,omitempty"`

            2. ApproveAs (see interface_contracts: ApproveAs). Journal the decision
               under step key "approval:"+toolUseID+":"+approverID via d.Do, mirroring
               the existing Approve. The record is Kind: StepApproval, ToolUseID set,
               Approved set, Approver=approverID, Signature=sig. Idempotent per
               (runID,toolUseID,approverID): first write wins (d.Do gives this).
               Validate empty runID / toolUseID / approverID with a wrapped ErrConfig
               error, matching the existing Approve style.

               Insert ApproveAs immediately after the existing Approve function. The
               existing Approve ends with this exact text; add the new function after
               its closing brace:
               ```go
               	_, err := d.Do(ctx, runID, "approval:"+toolUseID, func(context.Context) (Record, error) {
               		return Record{Kind: StepApproval, ToolUseID: toolUseID, Approved: approved}, nil
               	})
               	return err
               }
               ```

            3. ApprovalTally type and the optional PendingApproval.Quorum field
               (see interface_contracts: ApprovalTally). Add Quorum *ApprovalTally
               to the existing PendingApproval struct (do not change its existing
               fields or Error method).

            4. ApproverVerifier interface + ApproverVerifierFor func type
               (see interface_contracts: ApproverVerifier). These live in package
               agent so the gate can verify without importing audit.

            5. ApprovalDecisionBytes (see interface_contracts: ApprovalDecisionBytes).
               Domain-separated (a "bide.approval.v1\n" style prefix), deterministic
               encoding of (runID, toolUseID, approverID, approved). This is the
               message approvers sign and the gate verifies.

            6. tallyApprovals unexported helper (see interface_contracts:
               tallyApprovals). Iterate the run's Records in journal order; for
               records with Kind==StepApproval and step name
               "approval:"+toolUseID+":"+<approverID>, keep only approvers listed in
               policy.Approvers whose Signature verifies via
               verifierFor(approverID) over ApprovalDecisionBytes(...); dedupe by
               approver (first in journal order wins); count Approved/Denied; Pending
               = eligible approvers with no counted decision. This reuses ONLY the
               count>=k arithmetic idea from govern.tally; do NOT import govern and
               do NOT call govern.Quorum. Keep it pure and deterministic.

               Note the step key parse: the record Name is
               "approval:"+toolUseID+":"+approverID. toolUseID may itself contain a
               colon in principle, so match by the exact prefix "approval:"+toolUseID+":"
               and treat the remainder as approverID. Skip the legacy 1-of-1 key
               "approval:"+toolUseID (no trailing ":"+approverID), which belongs to
               Approve, not ApproveAs.

            Include focused unit tests for ApprovalDecisionBytes determinism and
            tallyApprovals (eligibility, dedupe-first-wins, signature rejection,
            approve/deny counting) in agent/store.go's existing test file ONLY IF
            that file is not owned by another agent -- it is not owned here, so put
            these unit tests instead inside the wave-2/3 test agents. For wave 1,
            you may add a small internal sanity test in a NEW file
            agent/store_mofn_test.go IF you keep ownership; but to stay within your
            declared ownership (agent/store.go only), do NOT create new files.
            Leave thorough tally unit tests to Agent C (agent/mofn_gate_test.go).

            Verification gate:
              gofmt -l agent/store.go   # expect empty
              GOWORK=off go build ./agent/...
              GOWORK=off go vet ./agent/...
            Postconditions:
              grep -c 'func ApproveAs' agent/store.go              # expect 1
              grep -c 'func Approve(' agent/store.go               # expect 1 (unchanged)
              grep -c 'type ApprovalTally struct' agent/store.go   # expect 1
              grep -c 'ApproverVerifier' agent/store.go            # expect >=2
              grep -c 'func ApprovalDecisionBytes' agent/store.go  # expect 1
              grep -c 'func tallyApprovals' agent/store.go         # expect 1

            ### Constraints
            - Do NOT modify the existing Approve function body or signature; the
              1-of-1 path must be unchanged.
            - Do NOT modify files outside agent/store.go. In particular do NOT add
              Safety.Approval (that is Agent A's agent/tool.go) -- tallyApprovals
              takes *ApprovalPolicy as a parameter, so you reference the type by
              forward name; it will resolve once Agent A merges. Your branch builds
              in isolation only if you do NOT dereference a Safety value; you take
              the policy as a plain *ApprovalPolicy argument. (ApprovalPolicy is
              defined by Agent A and merges before Agent C consumes tallyApprovals;
              in your isolated branch, referencing the type name ApprovalPolicy will
              fail to compile because agent/tool.go is not yet merged. To keep your
              branch self-compiling, define tallyApprovals to accept the concrete
              fields it needs rather than the ApprovalPolicy type: e.g.
              func tallyApprovals(recs []Record, runID, toolUseID string, need int,
              approvers []string, verifierFor ApproverVerifierFor) ApprovalTally.
              The gate (Agent C) passes policy.Need and policy.Approvers. This
              removes the cross-file type dependency entirely and keeps wave 1
              agents fully independent.)
            - Do NOT import github.com/bide-ai/bide/audit (import cycle) or
              github.com/bide-ai/bide/govern.
            - Use the go1.27 toolchain and GOWORK=off.
          files:
            - agent/store.go
      base_commit: ac97f5d9801fc09fe2c41ae14b05261fea20246e
    - number: 2
      agents:
        - id: C
          task: |
            Implement the m-of-n GATE in agent/agent.go and its unit tests. This is
            the enforcement point. Depends on Agent A (Safety.Approval,
            ApprovalPolicy) and Agent B (ApproveAs, ApprovalTally, ApproverVerifier,
            ApprovalDecisionBytes, tallyApprovals) -- both merged from wave 1.

            Current 1-of-1 gate is in agent/agent.go. Find this exact block (the
            approval pre-pass) and extend it:
            ```go
            			if t.Safety().RequiresApproval {
            				if !decided[tu.ID] {
            					fire(ApprovalRequired{ToolUseID: tu.ID, Name: tu.Name, Args: tu.Args})
            					return Message{}, totalUsage, liveTurns, &PendingApproval{RunID: runID, ToolUseID: tu.ID, ToolName: tu.Name, Args: tu.Args}
            				}
            ```

            What to implement:
            1. Change the gate predicate to fire for m-of-n too. The condition
               becomes t.Safety().RequiresApproval || t.Safety().Approval != nil.
               When Safety.Approval == nil, the EXISTING 1-of-1 path must run
               unchanged (byte-for-byte behavior): decided[]/approvals[] maps,
               PendingApproval without Quorum, the existing denied-tool-result block
               at the deny branch.

            2. When Safety.Approval != nil (m-of-n): read the run's journaled
               decisions (you already have recs during resume; for the live loop,
               call a.store.History(ctx, runID) once when needed, or thread the
               tally off the replay maps -- but the authoritative source is the
               journal, so re-read history to build the tally deterministically).
               Build the tally via the wave-1 helper:
                 tally := tallyApprovals(recs, runID, tu.ID, policy.Need, policy.Approvers, a.<resolver>)
               where a.<resolver> is the configured ApproverVerifierFor.
               Then:
                 - tally.Approved >= policy.Need  -> proceed (append to toRun).
                 - len(policy.Approvers) - tally.Denied < policy.Need -> DENY: reuse
                   the EXISTING denied-tool-result block verbatim (the
                   `const denied = ...` StepToolResult write and results[i]
                   assignment) so the model gets the identical denied result it gets
                   from a denied 1-of-1.
                 - otherwise -> raise &PendingApproval{... , Quorum: &tally} with the
                   running tally attached; the run stays paused.

            3. Journal the tally as its own durable step named
               "approval-tally:"+tu.ID (a StepValue via a.store.Do / agent.Step) so
               the tally is provable as a single record, not only reconstructable.
               This step is written at the point the gate evaluates the tally (both
               on a proceed and on a pause, so the latest tally is always recorded).
               Because d.Do is at-most-once by name, use a name that reflects the
               CURRENT tally state deterministically, OR overwrite semantics are not
               available (records are append-once by name). RESOLUTION: name it
               "approval-tally:"+tu.ID and write it ONLY at the terminal gate
               decisions (proceed or deny), where the tally is final for that
               toolUseID; on a still-pending pause, do NOT write the tally step (it
               would freeze a non-final count). This keeps the journaled tally step
               a single, final, provable record per resolved gate. Document this in
               a comment.

            4. Add the run option to configure the resolver. Confirm the existing
               option style in agent/agent.go (functional Option on the constructor,
               or Agent field) by reading the file, then add WithApproverVerifiers
               (see interface_contracts: WithApproverVerifiers) matching that style.
               If a tool has a non-nil Approval but no resolver is configured, return
               a clear wrapped ErrConfig error rather than silently tallying zero.

            Tests (agent/mofn_gate_test.go): use MemStore and a fake in-package
            ApproverVerifier. Cover:
              - tally proceeds at exactly Need approvals; pauses below Need with
                Quorum populated (Approved/Denied/Pending correct).
              - auto-deny when n-denied < Need, feeding the denied tool-result.
              - ineligible approver (not in Approvers) ignored.
              - bad signature ignored.
              - dedupe: same approver's second (flipped) decision ignored.
              - Safety.Approval == nil path is unchanged 1-of-1 (a RequiresApproval
                tool still pauses and resumes via Approve).
              - the "approval-tally:"+toolUseID step is journaled and readable.

            Verification gate:
              gofmt -l agent/agent.go agent/mofn_gate_test.go   # expect empty
              GOWORK=off go build ./agent/...
              GOWORK=off go vet ./agent/...
              GOWORK=off go test ./agent/ -run 'Mofn|Approval'
            Postconditions:
              grep -c 'approval-tally:' agent/agent.go            # expect >=1
              grep -c 'tallyApprovals' agent/agent.go             # expect >=1
              grep -c 'Quorum:' agent/agent.go                    # expect >=1

            ### Constraints
            - Do NOT modify agent/tool.go or agent/store.go (owned by wave 1).
            - Do NOT change the nil-Approval 1-of-1 behavior in ANY observable way.
            - Do NOT import audit or govern from package agent (import cycle /
              forbidden reuse). Verify signatures only through the injected
              ApproverVerifier resolver.
            - Do NOT call govern.Quorum.
            - Use the go1.27 toolchain and GOWORK=off.
          files:
            - agent/agent.go
            - agent/mofn_gate_test.go
          dependencies:
            - A
            - B
        - id: D
          task: |
            Add the audit prover for approver-decision records. Depends on Agent B
            (the "approval:"+toolUseID+":"+approverID step key and the
            Approver/Signature Record fields) -- merged from wave 1.

            Problem this solves: approver decisions are journaled as StepApproval
            records, NOT StepValue, so the existing audit.ProveStep (which matches
            only StepValue) cannot prove them. The k-of-n evidence bundle needs
            inclusion proofs of the individual signed approver decisions.

            What to implement in a NEW file audit/approval.go (package audit):
            1. ProveApproval (see interface_contracts: ProveApproval). Load
               store.History, find the record whose Name ==
               "approval:"+toolUseID+":"+approverID (Kind agent.StepApproval), and
               delegate to ProveRecord for its index against sth. Error clearly if
               absent. Mirror the shape of ProveToolCall / ProveStep.
            2. A convenience that gathers proofs for all eligible signed approvals
               for a toolUseID under one STH, for the evidence bundle. Suggested:

                 // ApprovalEvidence builds, under one STH, the inclusion proof for
                 // the tool-result action plus one ProofBundle per approver in
                 // approvers that recorded a decision, so an offline verifier can
                 // confirm k distinct signed eligible approvers decided before the
                 // action. Ordered approver-decisions-first, action-last.
