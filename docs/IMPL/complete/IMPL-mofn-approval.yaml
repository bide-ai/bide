pre_mortem:
    overall_risk: medium
    rows:
        - scenario: |
            Agent B references the ApprovalPolicy type (owned by Agent A) in
            tallyApprovals, so B's isolated branch fails to compile because
            agent/tool.go is not yet merged.
          likelihood: high
          impact: high
          mitigation: |
            B's brief mandates tallyApprovals accept (need int, approvers []string)
            rather than *ApprovalPolicy, removing the cross-file type dependency.
            The gate (Agent C, wave 2, after A merges) passes policy.Need /
            policy.Approvers. This keeps wave-1 agents fully independent and
            self-compiling.
        - scenario: |
            Agent C or B tries to verify approver signatures by importing
            github.com/bide-ai/bide/audit, creating an import cycle (audit imports
            agent).
          likelihood: high
          impact: high
          mitigation: |
            The ApproverVerifier interface is defined in package agent (Agent B);
            the gate verifies through the injected resolver only. Both briefs
            explicitly forbid importing audit or govern from package agent. The
            deployment wires audit verifiers into the resolver from outside.
        - scenario: |
            The journaled "approval-tally:"+toolUseID step is written on a
            still-pending pause, freezing a non-final count; because d.Do is
            at-most-once by name, a later resume with more decisions cannot update
            it, so the provable tally disagrees with the real one.
          likelihood: medium
          impact: high
          mitigation: |
            Agent C brief mandates writing the tally step ONLY at terminal gate
            decisions (proceed or auto-deny), never on a still-pending pause, so the
            single at-most-once record is always the FINAL tally for that toolUseID.
            The DST test (Agent F) asserts the journaled tally step is not doubled
            and matches the resolved outcome across resume.
        - scenario: |
            Agent D must expose approval proofs but the k-of-n evidence bundle needs
            them wired into audit.EvidencePackage, tempting an edit to
            audit/evidence.go which D does not own.
          likelihood: medium
          impact: medium
          mitigation: |
            D provides standalone ProveApproval + ApprovalEvidence building blocks
            and is forbidden from editing evidence.go; Agent G's test composes them
            (and uses the existing ProveStep for the tally record). If a real gap
            exists, D reports it as an integration gap rather than editing outside
            ownership. A follow-up integration wave can wire it into EvidencePackage
            if desired; the offline-verify property (design point 7) is provable from
            the standalone bundles under one STH without modifying evidence.go.
        - scenario: |
            The nil-Approval 1-of-1 path drifts (behavior changes) when Agent C
            restructures the approval pre-pass, breaking backward compatibility.
          likelihood: medium
          impact: high
          mitigation: |
            Agent C brief requires the nil-Approval branch to run the EXISTING code
            unchanged and to reuse the existing denied-tool-result block verbatim.
            Agent C's unit tests include an explicit nil-Approval 1-of-1
            pause/resume-via-Approve case; the full agent test suite runs at the
            post-merge gate.
        - scenario: |
            The step-key parse in tallyApprovals mis-handles a toolUseID that itself
            contains a colon, or confuses the 1-of-1 key "approval:"+toolUseID with
            an m-of-n key.
          likelihood: low
          impact: medium
          mitigation: |
            Agent B brief specifies matching the exact prefix
            "approval:"+toolUseID+":" and treating the remainder as approverID, and
            skipping the legacy key with no trailing ":"+approverID. Agent C's unit
            tests exercise mixed keys.
known_issues:
    - title: Plan executor does not enforce approval gating
      description: |
        The plan flow executor (plan/flow.go) does not currently enforce approval
        gating at all (no RequiresApproval handling in the plan runtime). This
        feature only LOWERS the config approval block to agent.Safety.Approval on
        the built node, matching the design scope. Enforcing the m-of-n gate inside
        the plan executor is out of scope here and would be a separate feature.
    - title: Deferred m-of-n extensions not built
