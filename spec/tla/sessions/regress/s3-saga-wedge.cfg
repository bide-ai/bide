\* #138 review, finding 6: under S3's rule as P14 first built it (CancelRule = "close"), a saga
\* turn's Cancel writes only its rollback request, which the closing check does not act on: the
\* turn stays open and every other message is refused until the cancelled one is sent again.
\* GROUP: regress
\* EXPECT: invariant NoFalseRefusal
CONSTANTS
  h1 = h1  h2 = h2  c1 = c1  c2 = c2  c3 = c3
  Sess = {"chat"}
  Handles <- H2
  ProcOf <- Proc2
  HSess <- OnChat2
  Callers <- C2
  CH <- TwoMsgH
  COp <- SendTwo
  CMsg <- MsgXY
  CKey <- NoKey2
  CRoot <- NoRoot2
  Keys = {}
  NCalls = 1
  Budget = 0
  MaxErr = 0
  MaxCrash = 0
  MaxPause = 0
  MaxCancel = 1
  MaxTry = 2
  MaxStarts = 4
  MaxClaims = 10
  CancelRule = "close"
  SagaTurns = TRUE
  TurnLease = FALSE
  Fix = {"S1", "S2"}
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS NoFalseRefusal
CHECK_DEADLOCK FALSE
