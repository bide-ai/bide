\* The recovery rule since #126 (PassRule "split"): a second loop per worker visits only the
\* runs whose lease lapsed, every interval, with a slot of its own. Two halted runs listed before
\* a leased primary's run; the primary dies. Takeover within Bound ticks of the lapse.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  NRuns = 3
  Halted0 = {1, 2}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "split"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim"}
  Timed = TRUE
  TTL = 2
  Interval = 2
  Bound = 4
  MaxAmbig = 0
  MaxCrash = 1
  MaxStall = 0
  Bug = "none"
  Api <- ApiP14
SPECIFICATION FullSpec
INVARIANTS BoundedPickup
CHECK_DEADLOCK FALSE
