\* The tool filter (D3): the primary filters call 2's tool out, two workers recover the run
\* passing no filter; an error reply, a crash.
\* GROUP: nightly
\* EXPECT: pass
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 2
  Workers <- W2
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 1
  MaxCrash = 1
  MaxStall = 0
  Bug = "none"
  Api <- ApiFilter
SPECIFICATION FullSpec
INVARIANTS OneDriverPerEpoch OneLiveDriver NoDoubleCompletion VerdictAgreement FinishedFinal CancelFinal AtMostOnce EndMarked OutcomeRecorded FilterHonoured RunOptionsDurable CancelRollsBack NotStartedOnce
CHECK_DEADLOCK FALSE
