\* Status (D8, Gets and the re-read) on a saga of two calls: a plain Run, a worker, Cancel racing
\* completion and the rollback, a crash.
\* GROUP: nightly
\* EXPECT: pass
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {1}
  NCalls = 2
  Workers <- W1
  Name <- NameOwn
  Primary = "plain"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = TRUE
  CancelRule = "claim"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 1
  MaxStall = 0
  Bug = "none"
  Api <- ApiStatusRegets
SPECIFICATION FullSpec
INVARIANTS StatusTruthful VerdictAgreement CancelFinal CancelRollsBack NotStartedOnce
CHECK_DEADLOCK FALSE
