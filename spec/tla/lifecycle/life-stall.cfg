\* One run: a leased primary Run and a worker; a lease holder stalls past its TTL and wakes;
\* a crash. A stalled holder may resume a run that ended (limits/stall-resume-finished) and may
\* drive beside the run's new holder (limits/stall-two-drivers); every other property holds.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 1
  MaxStall = 1
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS OneDriverPerEpoch NoDoubleCompletion OneEnd VerdictAgreement FinishedFinal AtMostOnce EndMarked OutcomeRecorded
CHECK_DEADLOCK FALSE
