\* #114's other residual: a plain Run holds no lease, so it can finish the run between a
\* worker's re-check and resume.
\* GROUP: limit
\* EXPECT: invariant NoResumeOfFinished
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "plain"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 0
  Bug = "none"
  Api <- ApiP14
SPECIFICATION FullSpec
INVARIANTS NoResumeOfFinished
CHECK_DEADLOCK FALSE
