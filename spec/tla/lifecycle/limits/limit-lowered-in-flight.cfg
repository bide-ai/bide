\* A limit amendment binds the drives that load the run after it: a later Resume lowers the limit
\* while a plain primary is past its turn check, and the primary's call fires past the new limit.
\* GROUP: limit
\* EXPECT: invariant NoFireOverLimit
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 2
  Workers <- W0
  Name <- NameOwn
  Primary = "plain"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 0
  Bug = "none"
  Api <- ApiLower
SPECIFICATION FullSpec
INVARIANTS NoFireOverLimit
CHECK_DEADLOCK FALSE
