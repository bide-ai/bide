\* #114's documented residual: a worker stalls past its TTL between the re-check and resume; the
\* primary takes the lapsed lease and finishes the run; the worker wakes and resumes it.
\* GROUP: limit
\* EXPECT: invariant NoResumeOfFinished
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 1
  Bug = "none"
  Api <- ApiP14
SPECIFICATION FullSpec
INVARIANTS NoResumeOfFinished
CHECK_DEADLOCK FALSE
