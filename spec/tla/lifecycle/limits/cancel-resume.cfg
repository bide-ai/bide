\* Cancel takes no lease, so it can land between a worker's re-check and resume; the drive's
\* start check then returns the run cancelled without a write.
\* GROUP: limit
\* EXPECT: invariant NoResumeOfFinished
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "none"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = TRUE
  CancelRule = "claim"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 0
  Bug = "none"
  Api <- ApiP14
SPECIFICATION FullSpec
INVARIANTS NoResumeOfFinished
CHECK_DEADLOCK FALSE
