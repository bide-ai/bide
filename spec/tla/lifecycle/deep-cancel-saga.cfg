\* Cancel (P14) on a saga of two calls under the adopted rules, with an operator resolving
\* halts: a leased primary, a worker, an error reply, a crash.
\* GROUP: nightly
\* EXPECT: pass
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {1}
  NCalls = 2
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = TRUE
  Canceller = TRUE
  CancelRule = "claim"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 1
  MaxCrash = 1
  MaxStall = 0
  Bug = "none"
  Api <- ApiP14
SPECIFICATION FullSpec
INVARIANTS OneDriverPerEpoch OneLiveDriver NoDoubleCompletion VerdictAgreement FinishedFinal CancelFinal AtMostOnce EndMarked OutcomeRecorded CancelRollsBack
CHECK_DEADLOCK FALSE
