\* An erased end marker (a tombstone of run:complete or run:cancelled) is still an end: a run that
\* ended and was then redacted is never driven again, never reported open or started by Status,
\* and Status still reports how it ended (by the marker's name, not its content).
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W0
  Name <- NameOwn
  Primary = "plain"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = TRUE
  CancelRule = "claim"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 0
  Bug = "none"
  Api <- ApiRedactStatus
SPECIFICATION FullSpec
INVARIANTS StatusTruthful VerdictAgreement CancelFinal CancelRollsBack RedactedIsEnded
CHECK_DEADLOCK FALSE
