\* #58, RecoverLoop's first version: a pass that found every slot busy stopped, and the next
\* began from the top, so runs listed after halted ones starved (Bug = "SkipWhenBusy").
\* GROUP: regress
\* EXPECT: liveness
CONSTANTS
  NRuns = 2
  Halted0 = {1}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 1
  MaxStall = 0
  Bug = "SkipWhenBusy"
  Api <- ApiP14
SPECIFICATION LiveSpec
PROPERTIES PickedUp
CHECK_DEADLOCK FALSE
