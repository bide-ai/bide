\* #114 as TestHA_MultiProcessStallPastTTL caught it: the primary stalls past its TTL, the
\* worker takes the run over and finishes it, and the worker's next pass, which listed the run
\* before, resumes it (Bug = "NoRecheck"; no crash).
\* GROUP: regress
\* EXPECT: invariant NoResumeOfFinished
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W2
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 1
  Bug = "NoRecheck"
SPECIFICATION FullSpec
INVARIANTS NoResumeOfFinished
CONSTRAINT WorkersWaitForStall
CHECK_DEADLOCK FALSE
