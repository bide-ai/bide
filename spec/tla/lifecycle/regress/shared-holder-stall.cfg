\* #58 finding 4 in the HA harness: a worker stalls holding a run, a restarted worker under the
\* same name renews the stalled worker's live lease and drives the run (Bug = "SharedHolder").
\* GROUP: regress
\* EXPECT: invariant OneDriverPerEpoch
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W2
  Name <- NameShared
  Primary = "none"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 1
  Bug = "SharedHolder"
  Api <- ApiP14
SPECIFICATION FullSpec
INVARIANTS OneDriverPerEpoch
CONSTRAINT RestartAfterStall
CHECK_DEADLOCK FALSE
