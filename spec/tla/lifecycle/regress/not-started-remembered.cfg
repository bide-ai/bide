\* L7: recovery remembers a run it found with no run:start and skips it for good; the primary
\* starts the run after the pass and dies, and the run is never recovered.
\* GROUP: regress
\* EXPECT: liveness
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "first"
  Crashable = {"prim"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 1
  MaxStall = 0
  Bug = "none"
  Api <- ApiNSRemember
SPECIFICATION LiveSpec
PROPERTIES StartedRunSettles
CHECK_DEADLOCK FALSE
