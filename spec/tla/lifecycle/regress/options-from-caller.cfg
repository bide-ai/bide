\* B1, the rule before P14: a drive runs under its own caller's options, so a recovery drive,
\* which passes none, runs the agent's defaults: a tool the run filtered out fires.
\* GROUP: regress
\* EXPECT: invariant FilterHonoured
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 2
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "first"
  Crashable = {"prim"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 1
  MaxStall = 0
  Bug = "none"
  Api <- ApiFilterCaller
SPECIFICATION FullSpec
INVARIANTS FilterHonoured
CHECK_DEADLOCK FALSE
