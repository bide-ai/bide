\* L4: D1 as written: Cancel writes run:cancelled on a saga too. Recovery excludes the run, so a
\* saga cancelled with no drive running it (or completed after the marker) is never rolled back.
\* GROUP: regress
\* EXPECT: invariant CancelRollsBack
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {1}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "plain"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = TRUE
  CancelRule = "claim"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 0
  Bug = "none"
  Api <- ApiSagaMarker
SPECIFICATION FullSpec
INVARIANTS CancelRollsBack
CHECK_DEADLOCK FALSE
