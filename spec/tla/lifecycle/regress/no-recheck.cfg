\* #114: recovery checked the end markers when it listed a run, not again under the lease; a run
\* the primary finished in between was handed to resume (Bug = "NoRecheck").
\* GROUP: regress
\* EXPECT: invariant NoResumeOfFinished
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 0
  Bug = "NoRecheck"
SPECIFICATION FullSpec
INVARIANTS NoResumeOfFinished
CHECK_DEADLOCK FALSE
