\* L2: D1 checks run:cancelled when a drive starts and at turn boundaries; a drive past its check
\* claims and fires after Cancel landed (CancelRule "turn").
\* GROUP: finding
\* EXPECT: invariant CancelFinal
CONSTANTS
  NRuns = 1
  Halted0 = {}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "plain"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = TRUE
  CancelRule = "turn"
  VerdictRule = "first"
  Crashable = {"prim", "workers"}
  Timed = FALSE
  TTL = 1
  Interval = 1
  Bound = 0
  MaxAmbig = 0
  MaxCrash = 0
  MaxStall = 0
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS CancelFinal
CHECK_DEADLOCK FALSE
