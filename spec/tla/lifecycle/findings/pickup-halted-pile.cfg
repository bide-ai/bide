\* L1: v0.9.0's RecoverLoop visits every unfinished run in id order, halted ones included, so a
\* dead holder's run listed after two halted runs is taken over more than Bound ticks after its
\* lease lapsed.
\* GROUP: finding
\* EXPECT: invariant BoundedPickup
CONSTANTS
  NRuns = 3
  Halted0 = {1, 2}
  Paused0 = {}
  SagaRuns = {}
  NCalls = 1
  Workers <- W1
  Name <- NameOwn
  Primary = "leased"
  PrimName = "p"
  Loop = TRUE
  PassRule = "all"
  Resolver = FALSE
  Canceller = FALSE
  CancelRule = "none"
  VerdictRule = "none"
  Crashable = {"prim"}
  Timed = TRUE
  TTL = 2
  Interval = 2
  Bound = 6
  MaxAmbig = 0
  MaxCrash = 1
  MaxStall = 0
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS BoundedPickup
CHECK_DEADLOCK FALSE
