\* OPEN FINDING P1 (spec/tla/README.md, "Model 2"): revision 2's BeginTask checks the dispatch
\* table before it reads the stored begin record, so a worker whose begin landed and whose answer
\* was lost is refused on retry once its lease lapsed or the engine restarted, and never runs: the
\* call halts worker_lost for an effect that never started. Bug = "CheckBeforeRead".
\* GROUP: finding
\* EXPECT: invariant BeginIdempotent
CONSTANTS
  w1 = w1  w2 = w2
  Workers = {w1}
  MaxAttempts = 2
  MaxDeliveries = 2
  MaxAmbig = 1
  MaxLoss = 1
  MaxDup = 0
  MaxEngineCrash = 0
  MaxWorkerCrash = 0
  HasResolver = FALSE
  Bug = "CheckBeforeRead"
SPECIFICATION FullSpec
INVARIANTS BeginIdempotent
CHECK_DEADLOCK FALSE
