\* Finding P2 (fixed in #95's text, 10.9 and 6.3): revision 2 recorded DELIVERY_EXHAUSTED for an
\* idempotent retry-safe call whose deliveries were only lost, but a lost delivery may have run its
\* handler (the worker died, or its report was lost, after the downstream effect): the error tells
\* the model the effect did not happen, and its next call runs under a new once-key scope. A refusal
\* (not_started) proves nothing either: a duplicate of the delivery may run. Bug = "LostIsExhausted".
\* GROUP: regress
\* EXPECT: invariant ExhaustedTruthful
CONSTANTS
  w1 = w1  w2 = w2
  Workers = {w1, w2}
  MaxAttempts = 1
  MaxDeliveries = 2
  MaxAmbig = 0
  MaxLoss = 0
  MaxDup = 0
  MaxEngineCrash = 0
  MaxWorkerCrash = 1
  HasResolver = FALSE
  Kind = "retry_safe"
  SafeKind = "idempotent"
  Bug = "LostIsExhausted"
SPECIFICATION FullSpec
INVARIANTS ExhaustedTruthful
CHECK_DEADLOCK FALSE
