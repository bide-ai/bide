\* Finding P1 (fixed in #95's text, 10.4 step 0): revision 2's BeginTask checked the dispatch
\* table before it read the stored begin record, so a worker whose begin landed and whose answer
\* was lost was refused on retry once its lease lapsed or the engine restarted, and never ran: the
\* call halted worker_lost for an effect that never started. Bug = "CheckBeforeRead".
\* GROUP: regress
\* EXPECT: invariant BeginIdempotent
CONSTANTS
  w1 = w1  w2 = w2
  Workers = {w1}
  MaxAttempts = 2
  MaxDeliveries = 2
  MaxAmbig = 1
  MaxLoss = 1
  MaxDup = 0
  MaxEngineCrash = 0
  MaxWorkerCrash = 0
  HasResolver = FALSE
  Kind = "side_effect"
  SafeKind = "idempotent"
  Bug = "CheckBeforeRead"
SPECIFICATION FullSpec
INVARIANTS BeginIdempotent
CHECK_DEADLOCK FALSE
