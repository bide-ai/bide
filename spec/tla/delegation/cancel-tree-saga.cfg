  defaultInitValue = defaultInitValue
  Tree <- TNested
  RootSaga = TRUE
  Orig = "none"
  PExp = 1
  MaxTime = 0
  Legacy = {}
  Foreign = {}
  MErr = {}
  MaxAmbig = 0
  MaxReadErr = 0
  MaxCrash = 1
  MaxWrong = 0
  MaxLost = 0
  MaxCancel = 1
  Bug = "none"
  Fix = {"ChainBind", "GuardRerun", "RecurseFailed"}
SPECIFICATION FullSpec
INVARIANTS TypeOK NoFireAfterRootCancel RollbackSound HaltPropagates NoForgedSubRun
CHECK_DEADLOCK FALSE
