\* D1, fixed in #133 (Fix without "ChainBind" reverts it): delegations minted under different bound
\* grants (P expired between them, and the Unrecorded refusal of the second mint asks for a live
\* one) cannot both pass BindRollback, which verifies each journaled grant against the one grant
\* bound now: the rollback never ends.
\* GROUP: regress
\* EXPECT: liveness
CONSTANTS
  defaultInitValue = defaultInitValue
  Tree <- TTwo
  RootSaga = TRUE
  Orig = "P"
  PExp = 1
  MaxTime = 2
  Legacy = {}
  Foreign = {}
  MErr = {}
  MaxAmbig = 0
  MaxReadErr = 0
  MaxCrash = 0
  MaxWrong = 0
  MaxLost = 0
  MaxCancel = 0
  Bug = "none"
  Fix = {"GuardRerun", "RecurseFailed"}
SPECIFICATION LiveSpec
PROPERTIES RollbackEnds
CHECK_DEADLOCK FALSE
