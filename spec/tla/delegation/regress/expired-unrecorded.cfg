\* #117 round 5, F2: an expired journaled grant was an Unrecorded refusal, which no binding can
\* put right, so the saga stopped on every drive (Bug = "ExpiredUnrecorded").
\* GROUP: regress
\* EXPECT: liveness
CONSTANTS
  defaultInitValue = defaultInitValue
  Tree <- TDelegNeOnly
  RootSaga = TRUE
  Orig = "P"
  PExp <- Inf
  MaxTime = 2
  Legacy = {}
  Foreign = {}
  MErr = {}
  MaxAmbig = 0
  MaxReadErr = 0
  MaxCrash = 1
  MaxWrong = 0
  MaxLost = 0
  MaxCancel = 0
  Bug = "ExpiredUnrecorded"
  Fix = {"ChainBind", "GuardRerun", "RecurseFailed"}
SPECIFICATION LiveSpec
PROPERTIES UnrecordedContinues
CHECK_DEADLOCK FALSE
