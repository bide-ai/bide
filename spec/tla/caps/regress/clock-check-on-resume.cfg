\* The clock bound is checked again when a call resumes with an intent: a call resumed after another driver recorded a later window is refused, though it only reads the window its intent fixed.
\* GROUP: regress
\* EXPECT: invariant ResumedNeverClockRefused
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  a1 = a1  a2 = a2  a3 = a3  l1 = l1  l2 = l2  l3 = l3
  Drivers = {d1, d2}
  Loops = {}
  LoopAtt <- NoLoop
  Attempts = {a1, a2}
  AttOf <- DiffAtt
  Amt <- AmtOne
  Limit = 2
  WaiverOf = {}
  Marked = {}
  ReleaseUnmarked = FALSE
  MaxWin = 1
  Clock0 <- ClockSkew
  MaxTick = 0
  Bound = 1
  MaxSlots = 3
  MaxCrash = 1
  MaxCancel = 0
  MaxStray = 0
  MaxRecon = 0
  MaxReinv = 0
  MaxResolve = 0
  StaleReads = FALSE
  Bug = "check-on-resume"
SPECIFICATION Spec
INVARIANTS ResumedNeverClockRefused
CHECK_DEADLOCK FALSE
