  d1 = d1  d2 = d2  d3 = d3  a1 = a1  a2 = a2  a3 = a3
  Drivers = {d1}
  Attempts = {a1}
  AttOf <- DiffAtt
  Amt <- AmtOne
  Limit = 2
  WaiverOf = {}
  Marked = {}
  ReleaseUnmarked = FALSE
  MaxWin = 0
  Clock0 <- ClockSame
  MaxTick = 0
  Bound = 1
  MaxSlots = 2
  MaxCrash = 0
  MaxCancel = 0
  MaxStray = 0
  MaxRecon = 0
  Bug = "index-after"
SPECIFICATION Spec
INVARIANTS IndexCoversIntents
CHECK_DEADLOCK FALSE
