\* ACCEPTED LIMIT: a decision written into the journal before its gate's request (a record
\* written directly; Approve and SubmitDecision refuse one) is final for that approver and never
\* counts, so a gate that needs every approver (here 2 of 2) can never pass and the run stays
\* paused until it is cancelled. One driver, no faults. Expected: Completes violated.
\* GROUP: limit
\* EXPECT: liveness
CONSTANTS
  d1 = d1  d2 = d2  defaultInitValue = defaultInitValue
  Drivers = {d1}
  SideEffects = {"E", "H", "T"}
  MaxIter = 2
  MaxAmbig = 0
  MaxCrash = 0
  HasResolver = FALSE
  RFlows = {"F"}
  Gated = {"T"}  Approvers = {"a1", "a2"}  Need = 2  Early = TRUE
  Bug = "none"
SPECIFICATION FullSpec
PROPERTIES Completes
CHECK_DEADLOCK FALSE
