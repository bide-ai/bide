\* Was limits/gate-early-stuck: a decision written directly before its gate's request never
\* counts, and under bide.approval.v2 it was final for its approver, so a 2 of 2 gate could never
\* pass. Since bide.approval.v3 the approver signs again at a new decided_at, a new decision
\* recorded after the request, which counts: the gate passes and the run completes. One driver, no
\* faults.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  d1 = d1  d2 = d2  defaultInitValue = defaultInitValue
  Drivers = {d1}
  SideEffects = {"E", "H", "T"}
  MaxIter = 2
  MaxAmbig = 0
  MaxCrash = 0
  HasResolver = FALSE
  RFlows = {"F"}
  Gated = {"T"}  Approvers = {"a1", "a2"}  Need = 2  Early = TRUE
  Bug = "none"
  Sources = {}  Exempt = {}  Idempotent = {}  Inherited = FALSE  Parent = FALSE  Revocable = FALSE  MarkNodes = {}  DeclNames = {"none"}  TNeed = 1  Separate = FALSE
SPECIFICATION FullSpec
INVARIANTS AtMostOncePerIteration NestedOncePerIteration Conform RoutesFollowDeclared ResultsTyped GateHeld GatedResults TallySound
PROPERTIES Completes
CHECK_DEADLOCK FALSE
