\* GROUP: regress
\* EXPECT: invariant OutcomeTrue
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3
  Drivers = {d1, d2}
  MaxAtt = 2
  MaxCrash = 1
  Mode = "void"
  PerAttempt = FALSE
  UnfencedAttempts = {}
  CheckStamp = TRUE
  Cap = 1
  MaxGrant = 1
  MonotoneVoid = TRUE
SYMMETRY DriverSym
SPECIFICATION Spec
INVARIANTS TypeOK OutcomeTrue
CHECK_DEADLOCK FALSE
