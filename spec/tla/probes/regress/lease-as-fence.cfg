\* Counterexample (docs/design/probes.md, section 2): NotHappened from a lookup, with the lease
\* lapsed and the attempt past its minimum age as the only fence. The original driver, stalled
\* past its lease, sends its request after the probe; the effect lands twice.
\* GROUP: regress
\* EXPECT: invariant AtMostOnce
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3
  Drivers = {d1, d2}
  MaxAtt = 2
  MaxCrash = 1
  Mode = "lookup"
  PerAttempt = TRUE
  UnfencedAttempts = {}
  CheckStamp = TRUE
  Cap = 1
  MaxGrant = 1
  MonotoneVoid = TRUE
SYMMETRY DriverSym
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOnce
CHECK_DEADLOCK FALSE
