\* Liveness modulo eviction: with an eviction, every call still ends with a recorded outcome
\* unless its effect fired, a crash, or the eviction forgot the only record that a live attempt
\* never started. Step path, 2 in 1. Faults: 1 error reply, 1 crash, 1 cancellation, 1 eviction.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1}
  Calls = {c1}
  ProcOf <- SameProc
  CallOf <- OneCall
  Kind <- AllStep
  NextOf <- NoNext
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 2
  MaxIds = 8
  MaxAmbig = 1
  MaxCrash = 1
  MaxCancel = 1
  MaxEvict = 1
  LateCommit = FALSE
  HasResolver = FALSE
  LiveCheck = "none"
  LeasedDrivers = {}
  ResolveClaim = FALSE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS BoundNotHit
PROPERTIES ProgressModuloEviction
CHECK_DEADLOCK FALSE
