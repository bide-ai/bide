\* TLC checks IndInv (ClaimsInductive) as a plain invariant on every reachable state: an inductive
\* invariant must also be a true one. Halt resolution with the minimum-age check in p1, the
\* drivers' process; c1 is a Step, c2 a tool call; weak A3.
\* SPEC: ClaimsInductive.tla
CONSTANTS
  Drivers = {"d1", "d2"}
  Procs = {"p1", "p2"}
  Calls = {"c1", "c2"}
  ProcOf <- ApSameProc
  CallOf <- ApOneCall
  Kind <- ApStepTool
  PauseCalls <- ApNoStrs
  NextOf <- ApC1ThenC2
  FirstCalls = {"c1"}
  MaxGen = 3
  MaxIds = 6
  MaxAmbig = 2
  MaxCrash = 1
  MaxCancel = 0
  MaxEvict = 0
  LateCommit = TRUE
  HasResolver = TRUE
  LiveCheck = "minAge"
  LeasedDrivers <- ApNoStrs
  ResolveClaim = TRUE
  ResolverProc = "p1"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = TRUE
  Policy0 <- ApNoGate
  Policies <- ApPols
  PolicyChoices <- ApNoStrs
  ApproverIds <- ApNoStrs
  Actors <- ApNoStrs
  KeyOf <- ApNoKeys
  KeyOf2 <- ApNoKeys
  MaxResolverChange = 0
  Holder <- ApNoHolder
  FoldSame <- ApNoPairs
  Subjects = {"this"}
  MaxApprove1 = 0
  MaxSubmit = 0
  MaxRedeploy = 0
  KeyCheck = TRUE
  Bug = "none"
INIT Init
NEXT FullNext
INVARIANT IndInv
CHECK_DEADLOCK FALSE
