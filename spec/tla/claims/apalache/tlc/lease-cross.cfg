\* TLC checks IndInv (ClaimsInductive) as a plain invariant on every reachable state: an inductive
\* invariant must also be a true one. Halt resolution with the lease check outside the
\* drivers' processes, one leased driver per process; tool calls; cancellations, an eviction.
\* SPEC: ClaimsInductive.tla
CONSTANTS
  Drivers = {"d1", "d2"}
  Procs = {"p1", "p2"}
  Calls = {"c1", "c2"}
  ProcOf <- ApCrossProc
  CallOf <- ApOneCall
  Kind <- ApAllTool
  PauseCalls <- ApNoStrs
  NextOf <- ApC1ThenC2
  FirstCalls = {"c1"}
  MaxGen = 3
  MaxIds = 6
  MaxAmbig = 2
  MaxCrash = 1
  MaxCancel = 1
  MaxEvict = 1
  LateCommit = FALSE
  HasResolver = TRUE
  LiveCheck = "lease"
  LeasedDrivers = {"d1"}
  ResolveClaim = TRUE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = TRUE
  Policy0 <- ApNoGate
  Policies <- ApPols
  PolicyChoices <- ApNoStrs
  ApproverIds <- ApNoStrs
  Actors <- ApNoStrs
  KeyOf <- ApNoKeys
  KeyOf2 <- ApNoKeys
  MaxResolverChange = 0
  Holder <- ApNoHolder
  FoldSame <- ApNoPairs
  Subjects = {"this"}
  MaxApprove1 = 0
  MaxSubmit = 0
  MaxRedeploy = 0
  KeyCheck = TRUE
  Bug = "none"
INIT Init
NEXT FullNext
INVARIANT IndInv
CHECK_DEADLOCK FALSE
