\* Apalache must find a historical bug TLC's regress/reuse-nohold.cfg finds: a remembered claim id
\* reused for a claim (Bug = "ReuseNoHold") fires under a marker whose not-started record lands
\* later. Shows the bounded symbolic check can fail on this model.
\* SPEC: ClaimsApalache.tla
\* CHECK: invariant NotStartedExclusive | --init=Init --inv=NotStartedExclusive --length=14
CONSTANTS
  Drivers = {"d1", "d2"}
  Procs = {"p1"}
  Calls = {"c1"}
  ProcOf <- ApSameProc
  CallOf <- ApOneCall
  Kind <- ApAllStep
  PauseCalls <- ApNoStrs
  NextOf <- ApNoNext
  FirstCalls = {"c1"}
  MaxGen = 3
  MaxIds = 8
  MaxAmbig = 2
  MaxCrash = 0
  MaxCancel = 0
  MaxEvict = 0
  LateCommit = FALSE
  HasResolver = FALSE
  LiveCheck = "none"
  LeasedDrivers <- ApNoStrs
  ResolveClaim = FALSE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = FALSE
  Policy0 <- ApNoGate
  Policies <- ApPols
  PolicyChoices <- ApNoStrs
  ApproverIds <- ApNoStrs
  Actors <- ApNoStrs
  KeyOf <- ApNoKeys
  KeyOf2 <- ApNoKeys
  MaxResolverChange = 0
  Holder <- ApNoHolder
  FoldSame <- ApNoPairs
  Subjects = {"this"}
  MaxApprove1 = 0
  MaxSubmit = 0
  MaxRedeploy = 0
  KeyCheck = TRUE
  Bug = "ReuseNoHold"
INIT Init
NEXT FullNext
