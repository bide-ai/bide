\* The inductive invariant of ClaimsInductive (AtMostOnce, NotStartedExclusive), for 3 drivers over
\* two processes on one call: Init implies IndInv, every FullNext step keeps it, and it implies the
\* properties. The placement, the call's kind, LateCommit, the lease and whether a Step pauses are
\* left to the solver (CInit3x2x1); IndInv leaves the fault counters free, so every fault budget is
\* covered. The last check is for vacuity: IndInv admits states in which the effect has fired.
\* SPEC: ClaimsInductive.tla
\* CHECK: pass | --cinit=CInit3x2x1 --init=Init --inv=IndInv --length=0
\* CHECK: pass | --cinit=CInit3x2x1 --init=IndInit --inv=IndProps --length=0
\* CHECK: pass | --cinit=CInit3x2x1 --init=IndInit --inv=IndInv --length=1
\* CHECK: invariant EffectNotReachable | --cinit=CInit3x2x1 --init=IndInit --inv=EffectNotReachable --length=0
CONSTANTS
  Drivers = {"d1", "d2", "d3"}
  Procs = {"p1", "p2"}
  Calls = {"c1"}
  CallOf <- ApOneCall
  NextOf <- ApNoNext
  FirstCalls = {"c1"}
  MaxGen = 3
  MaxIds = 7
  MaxAmbig = 3
  MaxCrash = 2
  MaxCancel = 2
  MaxEvict = 1
  HasResolver = FALSE
  LiveCheck = "none"
  ResolveClaim = FALSE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = FALSE
  Policy0 <- ApNoGate
  Policies <- ApPols
  PolicyChoices <- ApNoStrs
  ApproverIds <- ApNoStrs
  Actors <- ApNoStrs
  KeyOf <- ApNoKeys
  KeyOf2 <- ApNoKeys
  MaxResolverChange = 0
  Holder <- ApNoHolder
  FoldSame <- ApNoPairs
  Subjects = {"this"}
  MaxApprove1 = 0
  MaxSubmit = 0
  MaxRedeploy = 0
  KeyCheck = TRUE
  Bug = "none"
