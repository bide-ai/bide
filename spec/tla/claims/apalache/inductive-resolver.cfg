\* The inductive invariant of ClaimsInductive with halt resolution and the caller (all four of
\* AtMostOnce, NotStartedExclusive, NoLiveOverride, AtMostOncePerIntent): 2 drivers over two
\* processes on two calls of one intent (c2 is issued when c1 reads as not charged), the resolver
\* as the current protocol runs it (CInitResolver2x2x2: the lease or the minimum-age check, in
\* either process or neither), every placement, kind, lease holder and LateCommit left to the
\* solver. This file runs the base checks (Init implies IndInv, IndInv implies the properties) and
\* the vacuity check; the induction step is split into the four inductive-resolver-step-*.cfg.
\* SPEC: ClaimsInductive.tla
\* CHECK: pass | --cinit=CInitResolver2x2x2 --init=Init --inv=IndInv --length=0
\* CHECK: pass | --cinit=CInitResolver2x2x2 --init=IndInit --inv=IndProps --length=0
