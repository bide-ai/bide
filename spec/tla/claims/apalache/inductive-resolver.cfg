\* The inductive invariant of ClaimsInductive (AtMostOnce, NotStartedExclusive), for 2 drivers over
\* two processes on one call: Init implies IndInv, every FullNext step keeps it, and it implies the
\* properties. The placement, the call's kind, LateCommit, the lease and whether a Step pauses are
\* left to the solver (CInitResolver2x2x2); IndInv leaves the fault counters free, so every fault budget is
\* covered. The last check is for vacuity: IndInv admits states in which the effect has fired.
\* SPEC: ClaimsInductive.tla
\* CHECK: pass | --cinit=CInitResolver2x2x2 --init=Init --inv=IndInv --length=0
\* CHECK: pass | --cinit=CInitResolver2x2x2 --init=IndInit --inv=IndProps --length=0
\* CHECK: pass | --cinit=CInitResolver2x2x2 --init=IndInit --inv=IndInv --length=1
\* CHECK: invariant EffectNotReachable | --cinit=CInitResolver2x2x2 --init=IndInit --inv=EffectNotReachable --length=0
CONSTANTS
  Drivers = {"d1", "d2"}
  Procs = {"p1", "p2"}
  Calls = {"c1", "c2"}
  NextOf <- ApC1ThenC2
  FirstCalls = {"c1"}
  MaxGen = 3
  MaxIds = 6
  MaxAmbig = 3
  MaxCrash = 2
  MaxCancel = 2
  MaxEvict = 1
  HasResolver = TRUE
  ResolveClaim = TRUE
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = TRUE
  Policy0 <- ApNoGate
  Policies <- ApPols
  PolicyChoices <- ApNoStrs
  ApproverIds <- ApNoStrs
  Actors <- ApNoStrs
  KeyOf <- ApNoKeys
  KeyOf2 <- ApNoKeys
  MaxResolverChange = 0
  Holder <- ApNoHolder
  FoldSame <- ApNoPairs
  Subjects = {"this"}
  MaxApprove1 = 0
  MaxSubmit = 0
  MaxRedeploy = 0
  KeyCheck = TRUE
  Bug = "none"
INIT Init
NEXT FullNext
