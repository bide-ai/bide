\* One shard of the induction step of the resolver scope (see inductive-resolver.cfg): every step
\* of StepEnv from a state satisfying IndInv satisfies IndInv. The four shards (StepD1, StepD2,
\* StepResolver, StepEnv) together are FullNext, so they make the step check of this scope.
\* SPEC: ClaimsInductive.tla
\* CHECK: pass | --cinit=CInitResolver2x2x2 --init=IndInit --next=StepEnv --inv=IndInv --length=1
CONSTANTS
  Drivers = {"d1", "d2"}
  Procs = {"p1", "p2"}
  Calls = {"c1", "c2"}
  NextOf <- ApC1ThenC2
  FirstCalls = {"c1"}
  MaxGen = 3
  MaxIds = 6
  MaxAmbig = 3
  MaxCrash = 2
  MaxCancel = 2
  MaxEvict = 1
  HasResolver = TRUE
  ResolveClaim = TRUE
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = TRUE
  Policy0 <- ApNoGate
  Policies <- ApPols
  PolicyChoices <- ApNoStrs
  ApproverIds <- ApNoStrs
  Actors <- ApNoStrs
  KeyOf <- ApNoKeys
  KeyOf2 <- ApNoKeys
  MaxResolverChange = 0
  Holder <- ApNoHolder
  FoldSame <- ApNoPairs
  Subjects = {"this"}
  MaxApprove1 = 0
  MaxSubmit = 0
  MaxRedeploy = 0
  KeyCheck = TRUE
  Bug = "none"
INIT Init
NEXT FullNext
