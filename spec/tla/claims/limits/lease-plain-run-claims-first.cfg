\* ACCEPTED LIMIT, suspicion (a) of the #103 re-review: a plain Run (d2, no lease) voids the live
\* attempt through its process's remembered claim and claims the next one before the leased
\* resolution reads the history; the resolution then claims past the plain run's fresh attempt
\* and records "not charged" while d2 runs the effect, and the caller's new call fires again. The
\* plain run holds the live claim at the check, so this is #90's documented limit (the same config
\* with PlainRunIdleAtCheck passes: resolve-lease-claim). 2 error replies, no crash.
\* GROUP: limit
\* EXPECT: invariant AtMostOncePerIntent
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1, p2}
  Calls = {c1, c2}
  ProcOf <- CrossProc
  CallOf <- TwoCalls
  Kind <- AllTool
  NextOf <- C1ThenC2
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 4
  MaxIds = 9
  MaxAmbig = 2
  MaxCrash = 0
  MaxCancel = 0
  MaxEvict = 0
  LateCommit = FALSE
  HasResolver = TRUE
  LiveCheck = "lease"
  LeasedDrivers = {}
  ResolveClaim = TRUE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = FALSE
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS AtMostOncePerIntent
CHECK_DEADLOCK FALSE
