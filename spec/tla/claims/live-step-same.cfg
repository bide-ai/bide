\* Liveness (Progress): a provably unstarted effect does not halt for ever. Weak fairness of
\* driver steps; faults are finite and never fair. No symmetry (TLC does not combine it with
\* liveness). Faults: 1 error reply, 1 crash, 1 cancellation (the nightly live-*-a2 configs: 2).
\* Step path, two drivers in one process.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1}
  Calls = {c1}
  ProcOf <- SameProc
  CallOf <- OneCall
  Kind <- AllStep
  NextOf <- NoNext
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 2
  MaxIds = 8
  MaxAmbig = 1
  MaxCrash = 1
  MaxCancel = 1
  LateCommit = FALSE
  HasResolver = FALSE
  LiveCheck = "none"
  LeasedDrivers = {}
  ResolveClaim = FALSE
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS BoundNotHit
PROPERTIES Progress
CHECK_DEADLOCK FALSE
