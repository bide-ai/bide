\* This model's finding: pendingClaims holding one id per marker key. A second remembered claim
\* for the key replaces the first, whose marker may be the live one; nobody can void it, and an
\* effect that never started halts for ever with no crash. Bug = "MemoOverwrite".
\* GROUP: regress
\* EXPECT: liveness
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1}
  Calls = {c1}
  ProcOf <- SameProc
  CallOf <- OneCall
  Kind <- AllStep
  NextOf <- NoNext
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 4
  MaxIds = 8
  MaxAmbig = 3
  MaxCrash = 0
  MaxCancel = 1
  LateCommit = FALSE
  HasResolver = FALSE
  LiveCheck = "none"
  LeasedDrivers = {}
  ResolveClaim = FALSE
  Bug = "MemoOverwrite"
SPECIFICATION FullSpec
INVARIANTS BoundNotHit
PROPERTIES Progress
CHECK_DEADLOCK FALSE
