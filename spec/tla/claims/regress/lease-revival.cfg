\* Finding F4 (fixed in #92 at 2c8d2db): on the lease path the resolution did not claim the next
\* attempt. A plain Run (d2, no lease) in the process of a leased driver (d1) takes
\* d1's remembered claim, voids the live attempt, and claims the next one while the resolution,
\* which saw no leased driver, records its verdict. Assumed: no unleased driver holds the live
\* claim at the check (PlainRunIdleAtCheck), so this is not #90's known limit. 2 error replies.
\* GROUP: regress
\* EXPECT: invariant NoLiveOverride
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1}
  Calls = {c1}
  ProcOf <- SameProc
  CallOf <- OneCall
  Kind <- AllTool
  NextOf <- NoNext
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 3
  MaxIds = 8
  MaxAmbig = 2
  MaxCrash = 0
  MaxCancel = 0
  MaxEvict = 0
  LateCommit = FALSE
  HasResolver = TRUE
  LiveCheck = "lease"
  LeasedDrivers = {d1}
  ResolveClaim = FALSE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = TRUE
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS NoLiveOverride
CHECK_DEADLOCK FALSE
