\* Finding F2 (fixed in #92): WithMinHaltAge without the resolver's claim of the next attempt
\* (ResolveClaim = FALSE, #90's rule). The holder process voids the live attempt later (a retried
\* not-started record) and wins the next one; the resolution overrides the live driver.
\* GROUP: regress
\* EXPECT: invariant NoLiveOverride
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1, p2}
  Calls = {c1}
  ProcOf <- CrossProc
  CallOf <- OneCall
  Kind <- AllTool
  NextOf <- NoNext
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 2
  MaxIds = 6
  MaxAmbig = 2
  MaxCrash = 0
  MaxCancel = 0
  MaxEvict = 0
  LateCommit = FALSE
  HasResolver = TRUE
  LiveCheck = "minAge"
  LeasedDrivers = {}
  ResolveClaim = FALSE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = FALSE
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS NoLiveOverride
CHECK_DEADLOCK FALSE
