\* #90's documented limit: the lease check sees only leased drivers; a plain Run (d2) holds no
\* lease, and resolution overrides it. Expected: NoLiveOverride violated.
\* GROUP: regress
\* EXPECT: invariant NoLiveOverride
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1, p2}
  Calls = {c1}
  ProcOf <- CrossProc
  CallOf <- OneCall
  Kind <- AllTool
  NextOf <- NoNext
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 3
  MaxIds = 8
  MaxAmbig = 0
  MaxCrash = 0
  MaxCancel = 0
  MaxEvict = 0
  LateCommit = FALSE
  HasResolver = TRUE
  LiveCheck = "lease"
  LeasedDrivers = {d1}
  ResolveClaim = FALSE
  ResolverProc = "none"
  ResolveVoidOnError = FALSE
  PlainRunIdleAtCheck = FALSE
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS NoLiveOverride
CHECK_DEADLOCK FALSE
