\* OPEN FINDING (spec/tla/README.md, "Findings"): WithMinHaltAge measures the live attempt, but
\* its holder process may still void it later (a retried not-started record) and win the next
\* attempt; the resolution then overrides the live driver. Flip to "pass" when fixed.
\* GROUP: finding
\* EXPECT: invariant NoLiveOverride
CONSTANTS
  d1 = d1  d2 = d2  d3 = d3  p1 = p1  p2 = p2  c1 = c1  c2 = c2
  Drivers = {d1, d2}
  Procs = {p1, p2}
  Calls = {c1}
  ProcOf <- CrossProc
  CallOf <- OneCall
  Kind <- AllTool
  NextOf <- NoNext
  PauseCalls = {}
  FirstCalls = {c1}
  MaxGen = 2
  MaxIds = 6
  MaxAmbig = 2
  MaxCrash = 0
  MaxCancel = 0
  LateCommit = FALSE
  HasResolver = TRUE
  LiveCheck = "minAge"
  LeasedDrivers = {}
  ResolveClaim = FALSE
  Bug = "none"
SPECIFICATION FullSpec
INVARIANTS NoLiveOverride
CHECK_DEADLOCK FALSE
