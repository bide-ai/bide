\* Accepted: a middleware answers without next (a cache), its result write fails, and the
\* closed call counts as possibly called (it could have called the tool itself), so the re-drive
\* halts on a tool that never began.
\* GROUP: limit
\* EXPECT: liveness
CONSTANTS
  NCalls = 1
  Kinds <- OneSide
  MW <- MWCache
  Saga = FALSE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 1
  MaxCrash = 0
  MaxCancel = 0
  MaxDeadline = 0
  MaxGuard = 0
  MaxUnk = 0
  MaxToolErr = 0
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {}
SPECIFICATION FullSpec
PROPERTY NeverBegunProgress
CHECK_DEADLOCK FALSE
