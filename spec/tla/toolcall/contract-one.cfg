\* One side effect, its middleware within the contract (a result check included); every fault:
\* a deadline, a cancellation, an error reply, a crash, a guard refusal, an unknown outcome.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  NCalls = 1
  Kinds <- OneSide
  MW <- MWContract
  Saga = FALSE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 1
  MaxCrash = 1
  MaxCancel = 1
  MaxDeadline = 1
  MaxGuard = 1
  MaxUnk = 1
  MaxToolErr = 1
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {}
SPECIFICATION FullSpec
INVARIANTS NoDoubleFire TruthfulRecord NoLostSibling SagaAccounted ArgsAfterReach BoundNotHit
CHECK_DEADLOCK FALSE
