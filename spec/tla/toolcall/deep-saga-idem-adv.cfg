  NCalls = 1
  Kinds <- OneIdem
  MW <- MWAdv
  Saga = TRUE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 1
  MaxCrash = 1
  MaxCancel = 1
  MaxDeadline = 1
  MaxGuard = 0
  MaxUnk = 1
  MaxToolErr = 1
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {}
SPECIFICATION FullSpec
INVARIANTS NoDoubleFire TruthfulRecord NoLostSibling SagaAccounted ArgsAfterReach BoundNotHit
CHECK_DEADLOCK FALSE
