\* Model 9: rollbackRun's re-run of a retry-safe step stops the rollback on any error, so a result
\* check that rejects every success leaves the rollback with no end (no SagaAborted, no halt).
\* Bugs = {"NoRbUnknown"}.
\* GROUP: regress
\* EXPECT: liveness
CONSTANTS
  NCalls = 2
  Kinds <- IdemSide
  MW <- MWIdemMapErr
  Saga = TRUE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 0
  MaxErr = 0
  MaxCrash = 0
  MaxCancel = 0
  MaxDeadline = 0
  MaxGuard = 0
  MaxUnk = 0
  MaxToolErr = 1
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {"NoRbUnknown"}
SPECIFICATION FullSpec
PROPERTY RollbackEnds
CHECK_DEADLOCK FALSE
