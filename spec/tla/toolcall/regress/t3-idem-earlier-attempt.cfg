\* Model 9, T3: a retry-safe saga step that changes state fires, the run is cut off with nothing
\* recorded (no attempt marker), and the re-run fails with a known failure: the rollback skips the
\* step, and the first attempt's effect is listed nowhere.
\* Bugs = {"NoIdemBegan"}: no "may have begun" record.
\* GROUP: regress
\* EXPECT: invariant SagaAccounted
CONSTANTS
  NCalls = 1
  Kinds <- OneIdem
  MW <- MWContract
  Saga = TRUE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 1
  MaxCrash = 1
  MaxCancel = 1
  MaxDeadline = 1
  MaxGuard = 0
  MaxUnk = 1
  MaxToolErr = 1
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {"NoIdemBegan"}
SPECIFICATION FullSpec
INVARIANTS SagaAccounted
CHECK_DEADLOCK FALSE
