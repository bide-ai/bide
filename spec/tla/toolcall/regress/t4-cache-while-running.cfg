\* Model 9, T4: a middleware leaves next running and answers from a cache; the call is recorded
\* and, when a later step fails the saga, compensated before its tool's effect lands.
\* Bugs = {"NoRunningCheck"}: a success is recorded whether or not the tool still runs.
\* GROUP: regress
\* EXPECT: invariant NoDoubleFire
CONSTANTS
  NCalls = 2
  Kinds <- TwoSide
  MW <- MWLeakCache
  Saga = TRUE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 0
  MaxCrash = 0
  MaxCancel = 0
  MaxDeadline = 0
  MaxGuard = 0
  MaxUnk = 0
  MaxToolErr = 1
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {"NoRunningCheck"}
SPECIFICATION FullSpec
INVARIANTS NoDoubleFire
CHECK_DEADLOCK FALSE
