\* The refusal check sits after beginCall (a reservation made once the tool was begun): the began word says the tool began, and the call is refused and recorded as a known failure for a tool that may have run.
\* GROUP: regress
\* EXPECT: invariant RefusedNeverBegan
CONSTANTS
  NCalls = 1
  Kinds <- OneSide
  MW <- MWContract
  Saga = FALSE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 1
  MaxCrash = 1
  MaxCancel = 1
  MaxDeadline = 1
  MaxGuard = 1
  MaxUnk = 1
  MaxToolErr = 1
  MaxWrongAuth = 0
  MaxRefuse = 1
  MaxAtt = 3
  Bugs = {"RefuseAfterBegin"}
SPECIFICATION FullSpec
INVARIANTS RefusedNeverBegan
CHECK_DEADLOCK FALSE
