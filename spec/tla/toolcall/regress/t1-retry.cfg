\* Model 9, T1: a retry of next after the tool fired is refused, and that refusal is recorded
\* as the call's known failure. Bugs = {"NoToolOutcome"}: the loop judged a reached call by the chain's error alone.
\* GROUP: regress
\* EXPECT: invariant NoDoubleFire
CONSTANTS
  NCalls = 1
  Kinds <- OneSide
  MW <- MWRetry
  Saga = FALSE
  Rewrite = FALSE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 0
  MaxCrash = 0
  MaxCancel = 0
  MaxDeadline = 0
  MaxGuard = 1
  MaxUnk = 0
  MaxToolErr = 0
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {"NoToolOutcome"}
SPECIFICATION FullSpec
INVARIANTS NoDoubleFire
CHECK_DEADLOCK FALSE
