\* Round 4, finding 1: refused was not terminal. A middleware that got a refusal, left next
\* running and returned has the call recorded as not called; the leaked next then moves refused
\* to reached and fires. Bugs = {"RefusedNotTerminal", "NoClosedBegin"} (T5's rule, no begin
\* after the chain returned, also stops it).
\* GROUP: regress
\* EXPECT: invariant NoDoubleFire
CONSTANTS
  NCalls = 1
  Kinds <- OneSide
  MW <- MWRefLeak
  Saga = FALSE
  Rewrite = FALSE
  Timeout = FALSE
  MaxExtra = 1
  MaxErr = 0
  MaxCrash = 0
  MaxCancel = 0
  MaxDeadline = 0
  MaxGuard = 0
  MaxUnk = 0
  MaxToolErr = 0
  MaxWrongAuth = 0
  MaxAtt = 3
  Bugs = {"RefusedNotTerminal", "NoClosedBegin"}
SPECIFICATION FullSpec
INVARIANTS NoDoubleFire
CHECK_DEADLOCK FALSE
