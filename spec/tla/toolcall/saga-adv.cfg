\* A saga Compensator whose middleware rewrites its arguments (the accepted-arguments write)
\* and may do anything but call the tool itself.
\* GROUP: nightly
\* EXPECT: pass
CONSTANTS
  NCalls = 1
  Kinds <- OneSide
  MW <- MWAdv
  Saga = TRUE
  Rewrite = TRUE
  Timeout = TRUE
  MaxExtra = 1
  MaxErr = 1
  MaxCrash = 1
  MaxCancel = 1
  MaxDeadline = 1
  MaxGuard = 0
  MaxUnk = 1
  MaxToolErr = 0
  MaxWrongAuth = 0
  MaxAtt = 4
  Bugs = {}
SPECIFICATION FullSpec
INVARIANTS NoDoubleFire TruthfulRecord NoLostSibling SagaAccounted ArgsAfterReach BoundNotHit
CHECK_DEADLOCK FALSE
