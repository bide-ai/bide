  CheckDep = TRUE
  BasicHonoursPlainLift = FALSE
  UnkOnUnverified = FALSE
  WithTrail = FALSE
  LiftStoreFirst = FALSE
  CatchUp = TRUE
  ApplySuffixOnly = TRUE
  UseKinds = {"set", "lift", "pol", "mode"}
  AttackerRoots = FALSE
