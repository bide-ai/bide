  MaxJunk = 2
  MaxPol = 2
  SettersOf <- SettersOfDef
  LiftersOf <- LiftersOfDef
  QuorumOf <- QuorumOfOneDef
  NeedsOther = TRUE
  WantOther = TRUE
  People = {a, b, c, eve}
  Forger = eve
  Cfg = "audited"
  Pin = 1
  Deps = {"mine"}
  CheckDep = TRUE
  BasicHonoursPlainLift = FALSE
  UnkOnUnverified = FALSE
  WithTrail = FALSE
  LiftStoreFirst = FALSE
  CatchUp = TRUE
  ApplySuffixOnly = TRUE
  UseKinds = {"set", "lift", "pol", "mode"}
  AttackerRoots = FALSE
  TrustRootOnly = TRUE
