\* Revocation, status and execution: one certificate, one decision, three CRLs; the CA revokes with a past E;
\* a CRL may be withheld or an older one delivered; freshness, the number rule and the execution re-check on.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  p1 = p1  p2 = p2  i1 = i1  i2 = i2
  Persons = {p1, p2}
  Idents = {i1, i2}
  IdOwner <- OwnerInj
  MaxT = 4
  NaSet = {4}
  IssueMax = 0
  MaxCert = 1
  MaxDec = 1
  MaxCRL = 3
  MaxHeads = 1
  K = 1
  MaxAge = 2
  ExecAge = 1
  Period = 2
  MinSpacing = 1
  Skew = 1
  Grace = 1
  W = 1
  NameCons = TRUE
  IdBind = TRUE
  Fresh = TRUE
  NumRule = TRUE
  NonDec = TRUE
  GateAnchor = TRUE
  ExecRecheck = TRUE
  StickyTally = TRUE
  StaleSticky = TRUE
  RevByClaim = FALSE
  DedupSeat = TRUE
  Cov = "number"
  CountLive = FALSE
  Prune = FALSE
  CanRevoke = TRUE
  CanMisIssue = FALSE
  CanWithhold = TRUE
  CanRollback = TRUE
  CanSkew = FALSE
  CanBackdate = FALSE
  CanMisbind = FALSE
SPECIFICATION Spec
