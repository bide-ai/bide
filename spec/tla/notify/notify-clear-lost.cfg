  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1, p2}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 1
  FailCount = "trail"
  MaxRounds = 3
  MaxCrash = 0
  MaxLost = 1
  MaxAmbig = 0
  MaxFail = 0
  MaxSlow = 1
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = TRUE
  LongClaims = FALSE
  Holder = "deliverer"
  Levels = 0
  EscMode = "unacked"
  Bug = "none"
SYMMETRY ProcSym
SPECIFICATION Spec
INVARIANTS TypeOK AckTrue FailingBy DupBound NoConcurrentDouble ClaimWon OverdueBounded Terminal Once ObservedFirst BoundNotHit ClearNeverEarly ClearOnlyIfTold ClearAfterClose ClearNeverOverdue
