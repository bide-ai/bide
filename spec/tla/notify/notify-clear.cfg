\* The all-clear: two processes deliver one event and its resolved notification (key r_e1); the
\* event may stop standing at any time, before or after it is delivered; a crash, a lost sink
\* reply and a claim that lapses mid-round. No all-clear for an event that still stands, none for
\* one nobody was told of, none before the event is closed, and none is ever overdue.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1, p2}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 1
  FailCount = "trail"
  MaxRounds = 3
  MaxCrash = 1
  MaxLost = 0
  MaxAmbig = 0
  MaxFail = 0
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = TRUE
  LongClaims = FALSE
  Holder = "deliverer"
  Bug = "none"
SYMMETRY ProcSym
SPECIFICATION Spec
INVARIANTS TypeOK AckTrue FailingBy DupBound NoConcurrentDouble ClaimWon OverdueBounded Terminal Once ObservedFirst BoundNotHit ClearNeverEarly ClearOnlyIfTold ClearAfterClose ClearNeverOverdue
CHECK_DEADLOCK FALSE
