\* A crash loop: recovery of the run fails, and the process crashes without bound, each restart
\* losing its memory. recovery_failing is observed, and a successful pass closes the episode.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1}
  Slots = 1
  Events = {}
  Episodes = 1
  Reqs = 2
  FailAfter = 2
  FailCount = "trail"
  MaxRounds = 1
  MaxCrash <- NoBudget
  MaxLost = 0
  MaxAmbig = 0
  MaxFail = 0
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = FALSE
  LongClaims = FALSE
  Holder = "deliverer"
  Bug = "none"
SPECIFICATION LiveSpec
INVARIANTS TypeOK
PROPERTIES CrashLoopAlerts EpisodeCloses
CHECK_DEADLOCK FALSE
