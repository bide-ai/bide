\* Liveness of the all-clear: every event that stopped standing after a delivery of it was
\* attempted gets its all-clear acknowledged (a sink that accepts in the end), whether the event was
\* acknowledged, or cleared with its request failed; every step and time weakly fair; a failed
\* request.
\* GROUP: ci
\* EXPECT: pass
CONSTANTS
  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1, p2}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 1
  FailCount = "trail"
  MaxRounds = 3
  MaxCrash = 0
  MaxLost = 0
  MaxAmbig = 0
  MaxFail = 1
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = TRUE
  LongClaims = FALSE
  Holder = "deliverer"
  Levels = 0
  EscMode = "unacked"
  Bug = "none"
SPECIFICATION LiveSpec
INVARIANTS BoundNotHit AckTrue ClearNeverEarly ClearNeverOverdue
PROPERTIES ClearsDelivered NoSilentDrop StaleStops
CHECK_DEADLOCK FALSE
