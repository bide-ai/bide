  Procs = {p1, p2}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 1
  FailCount = "trail"
  MaxRounds = 2
  MaxCrash = 0
  MaxLost = 0
  MaxAmbig = 0
  MaxFail = 1
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = TRUE
  LongClaims = FALSE
  Holder = "deliverer"
  Levels = 1
  EscMode = "unacked"
  Bug = "none"
SYMMETRY ProcSym
SPECIFICATION Spec
INVARIANTS TypeOK AckTrue FailingBy DupBound NoConcurrentDouble ClaimWon OverdueBounded Terminal Once ObservedFirst BoundNotHit EscOnlyIfDue EscChain EscNotWhenSatisfied ClearNeverEarly ClearOnlyIfTold ClearAfterClose ClearNeverOverdue
