\* Escalation, two steps, every fault at once: a crash, a lost sink reply, a sink that fails once, a claim that lapses
\* mid-round; two processes; the event may be resolved at any time.
\* GROUP: nightly
\* EXPECT: pass
CONSTANTS
  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1, p2}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 1
  FailCount = "trail"
  MaxRounds = 3
  MaxCrash = 1
  MaxLost = 1
  MaxAmbig = 0
  MaxFail = 1
  MaxSlow = 1
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = FALSE
  LongClaims = FALSE
  Holder = "deliverer"
  Levels = 2
  EscMode = "unacked"
  Bug = "none"
SYMMETRY ProcSym
SPECIFICATION Spec
INVARIANTS TypeOK AckTrue FailingBy DupBound NoConcurrentDouble ClaimWon OverdueBounded Terminal Once ObservedFirst BoundNotHit EscOnlyIfDue EscChain EscNotWhenSatisfied
CHECK_DEADLOCK FALSE
