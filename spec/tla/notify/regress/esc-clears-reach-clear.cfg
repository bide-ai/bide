\* Reachability: with Clears and an escalation chain, the all-clear of an escalation step is delivered (two processes, a sink that fails once). The
\* properties of steps and of their all-clears hold vacuously otherwise; the pass configurations
\* esc-clears and live-esc-clears are one-process (too small to reach it) and rely on this.
\* GROUP: regress
\* EXPECT: invariant EscClearNotReachable
CONSTANTS
  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1, p2}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 1
  FailCount = "trail"
  MaxRounds = 2
  MaxCrash = 0
  MaxLost = 0
  MaxAmbig = 0
  MaxFail = 1
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = TRUE
  LongClaims = FALSE
  Holder = "deliverer"
  Levels = 1
  EscMode = "unacked"
  Bug = "none"
SYMMETRY ProcSym
SPECIFICATION Spec
INVARIANTS EscClearNotReachable
CHECK_DEADLOCK FALSE
