\* N1, adopted: failures counted in each process's memory (the note's first "count it"). With a
\* sink that is down, one request a round and one crash, the restarted process counts from zero: a third
\* round is claimed after two failed requests with no failing (FailingBy). A crash loop never raises it.
\* GROUP: regress
\* EXPECT: invariant FailingBy
CONSTANTS
  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 2
  FailCount = "memory"
  MaxRounds = 4
  MaxCrash = 1
  MaxLost = 0
  MaxAmbig = 0
  MaxFail <- NoBudget
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  LongClaims = FALSE
  Holder = "deliverer"
  Bug = "none"
SYMMETRY ProcSym
SPECIFICATION Spec
INVARIANTS TypeOK FailingBy
CHECK_DEADLOCK FALSE
