  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1}
  Slots = 1
  Events = {}
  Episodes = 1
  Reqs = 2
  FailAfter = 2
  FailCount = "trail"
  MaxRounds = 2
  MaxCrash <- NoBudget
  MaxLost = 0
  MaxAmbig = 0
  MaxFail = 0
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Holder = "deliverer"
  Bug = "MemFailingSince"
SPECIFICATION LiveSpec
PROPERTIES CrashLoopAlerts
CHECK_DEADLOCK FALSE
