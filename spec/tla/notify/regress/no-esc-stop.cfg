\* Broken rule: a step stands after its event stopped standing, so an escalation to a receiver that is never reached
\* is never closed when the event is resolved.
\* GROUP: regress
\* EXPECT: liveness
CONSTANTS
  p1 = p1  p2 = p2  p3 = p3
  Procs = {p1, p2}
  Slots = 1
  Events = {"e1"}
  Episodes = 0
  Reqs = 1
  FailAfter = 1
  FailCount = "trail"
  MaxRounds = 2
  MaxCrash = 0
  MaxLost = 0
  MaxAmbig = 0
  MaxFail <- NoBudget
  MaxSlow = 0
  Resolve = TRUE
  UseLease = FALSE
  Notice = FALSE
  Clears = FALSE
  LongClaims = FALSE
  Holder = "deliverer"
  Levels = 1
  EscMode = "unacked"
  Bug = "NoEscStop"
SYMMETRY ProcSym
SPECIFICATION LiveSpec
PROPERTIES EscStops
CHECK_DEADLOCK FALSE
